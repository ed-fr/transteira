title = "TransTeira gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "transteira-api-token"
description = "TransTeira API token"
regex = '''\btt_[A-Za-z0-9]{40,}\b'''
keywords = ["tt_"]

# Example API tokens, wherever they appear (specification, documentation, code), use the
# unmistakably fake shape "tt_EXAMPLE" followed by base62 characters. Only that shape is
# allowed: any other token-shaped value is reported, in docs/ and api/ too.
[[rules.allowlists]]
description = "Fake example API tokens (tt_EXAMPLE...)"
regexTarget = "match"
regexes = [
  '''^tt_EXAMPLE[A-Za-z0-9]*$''',
]

# The API specification (and the web types generated from it, which copy its descriptions) and
# the documentation contain fake passwords and keys in their examples. Only the generic rule is relaxed there; every other rule still applies.
[[allowlists]]
description = "Fake example values in the API specification, the types generated from it and the documentation"
targetRules = ["generic-api-key"]
paths = [
  '''^api/openapi\.yaml$''',
  '''^web/src/shared/api/schema\.ts$''',
  '''^docs/''',
]

[[allowlists]]
description = "Test fixtures use fake values"
paths = [
  '''(^|/)testdata/''',
]

# Third-party npm packages and the web build output are not project sources (they are
# reproduced from web/package-lock.json and web/src); scanning them only yields false positives.
[[allowlists]]
description = "npm dependencies and web build output"
paths = [
  '''^web/node_modules/''',
  '''^web/dist/''',
  '''^test/e2e/node_modules/''',
]
