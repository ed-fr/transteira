title = "TransTeira gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "transteira-api-token"
description = "TransTeira API token"
regex = '''\btt_[A-Za-z0-9]{40,}\b'''
keywords = ["tt_"]

# Example API tokens, wherever they appear (specification, documentation, code), use the
# unmistakably fake shape "tt_EXAMPLE" followed by base62 characters. Only that shape is
# allowed: any other token-shaped value is reported, in docs/ and api/ too.
[[rules.allowlists]]
description = "Fake example API tokens (tt_EXAMPLE...)"
regexTarget = "match"
regexes = [
  '''^tt_EXAMPLE[A-Za-z0-9]*$''',
]

[[rules]]
id = "transteira-provisioning-token"
description = "TransTeira provisioning token"
regex = '''\bttp_[0-9A-Za-z]{43}\b'''
keywords = ["ttp_"]

# Example provisioning tokens use the unmistakably fake shape "ttp_EXAMPLE" followed by base62
# characters; only that shape is allowed, anywhere.
[[rules.allowlists]]
description = "Fake example provisioning tokens (ttp_EXAMPLE...)"
regexTarget = "match"
regexes = [
  '''^ttp_EXAMPLE[A-Za-z0-9]*$''',
]

# The API specification (and the web types generated from it, which copy its descriptions) and
# the documentation contain fake passwords and keys in their examples. Only the generic rule is relaxed there; every other rule still applies.
[[allowlists]]
description = "Fake example values in the API specification, the types generated from it and the documentation"
targetRules = ["generic-api-key"]
paths = [
  '''^api/openapi\.yaml$''',
  '''^web/src/shared/api/schema\.ts$''',
  '''^docs/''',
]

# Provisioning token record identifiers ("prv_" + ULID) are public identifiers, never secrets
# (the secret is "ttp_..."); their ULID is reported by the generic rule. Only that exact shape
# is allowed, and only for the generic rule.
[[allowlists]]
description = "Provisioning token identifiers (prv_ + ULID), not secrets"
targetRules = ["generic-api-key"]
# The generic rule matches the key and the quotes too: the identifier is its secret group.
regexTarget = "secret"
regexes = [
  '''^prv_[0-9A-HJKMNP-TV-Z]{26}$''',
]

[[allowlists]]
description = "Test fixtures use fake values"
paths = [
  '''(^|/)testdata/''',
]

# Third-party npm packages and the web build output are not project sources (they are
# reproduced from web/package-lock.json and web/src); scanning them only yields false positives.
[[allowlists]]
description = "npm dependencies and web build output"
paths = [
  '''^web/node_modules/''',
  '''^web/dist/''',
  '''^test/e2e/node_modules/''',
]

# End-to-end run artefacts (gitignored): the seeded throwaway credentials of the run
# (test/e2e/.run/state.json, storage states with session cookies) and the Playwright traces and
# reports, which record request headers. They only exist locally and hold no real secret.
[[allowlists]]
description = "End-to-end run artefacts (gitignored, throwaway credentials of a local run)"
paths = [
  '''^test/e2e/\.run/''',
  # Run lock of a run in progress (owner.json: PID and a random lock token).
  '''^test/e2e/\.run\.lock''',
  '''^test/e2e/test-results/''',
  '''^test/e2e/playwright-report/''',
]
