            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmailTemplateSummary' }
              example:
                - { key: verification-code, language: fr, customised: false }
                - { key: transfer-notification, language: fr, customised: true, updatedAt: '2026-10-02T10:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/email-templates/{templateKey}/{language}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/TemplateKey'
      - $ref: '#/components/parameters/LanguagePath'
    get:
      tags: [Admin tenants]
      operationId: getEmailTemplate
      summary: Get a template (customised or default)
      description: "Returns the customised template, or the default one, with the variables available for this template."
      security:
        - adminSession: []
      responses:
        '200':
          description: Template source and available variables.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
              example:
                key: transfer-notification
                language: en
                customised: false
                subject: '{{sender_email}} sent you files via {{tenant_name}}'
                bodyHtml: '<p><strong>{{sender_email}}</strong> sent you {{file_count}} file(s).</p>{{message}}<p><a href="{{download_link}}">Download the files</a></p><p>Available until {{expiry_datetime}}.</p>{{password_notice}}{{qr_code}}{{files}}'
                bodyText: "{{sender_email}} sent you {{file_count}} file(s).\n\n{{message}}\n\n{{download_link}}\n\nAvailable until {{expiry_datetime}}.\n\n{{password_notice}}\n\nFiles:\n{{files}}"
                variables: [tenant_name, sender_email, message, download_link, expiry_datetime, password_notice, qr_code, files, file_count]
                requiredVariables: [download_link, password_notice, files]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateEmailTemplate
      summary: Customise a template
      description: |
        Templates contain plain text (subject and text part) or HTML (HTML part) with `{{snake_case}}`
        variables only: no logic, no condition, loop, function or any other template syntax.
        Only the variables listed by `getEmailTemplate` for this template are accepted, and the
        required ones (such as the download link or the verification code) must be present.
        Values are HTML-escaped in the HTML part; list variables such as `{{files}}` are pre-rendered
        blocks. The HTML is sanitized by an allowlist: formatting tags and `https:` or `mailto:`
        links only; scripts, `<style>` elements, forms, frames, event handlers and remote images
        are removed (only `cid:` images, for the QR code), and inline `style` attributes are
        filtered to an allowlist of properties (colors, fonts, spacing, borders, sizes; not
        `display`). In the HTML part, a required variable counts only where the recipient sees
        it: in the text, or as the `href` of a link for a URL variable (not in `title` or `alt`).
        The saved (sanitized) template is returned.

        An invalid template is refused with `400 validation-failed`: each entry of `errors` names
        the part (`/subject`, `/bodyHtml` or `/bodyText`) with its `line`, `column` and `message`.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateUpdate' }
            example:
              subject: 'Files from {{sender_email}}'
              bodyHtml: '<p>Hello,</p><p>{{sender_email}} sent you files.</p><p><a href="{{download_link}}">Download</a></p>{{password_notice}}{{files}}'
              bodyText: "Hello,\n{{sender_email}} sent you files.\n{{download_link}}\n\n{{password_notice}}\n\n{{files}}"
      responses:
        '200':
          description: Saved template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
              example:
                key: transfer-notification
                language: en
                customised: true
                subject: 'Files from {{sender_email}}'
                bodyHtml: '<p>Hello,</p><p>{{sender_email}} sent you files.</p><p><a href="{{download_link}}">Download</a></p>{{password_notice}}{{files}}'
                bodyText: "Hello,\n{{sender_email}} sent you files.\n{{download_link}}\n\n{{password_notice}}\n\n{{files}}"
                variables: [tenant_name, sender_email, message, download_link, expiry_datetime, password_notice, qr_code, files, file_count]
                requiredVariables: [download_link, password_notice, files]
                updatedAt: '2026-10-19T16:10:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin tenants]
      operationId: resetEmailTemplate
      summary: Revert to the default template
      description: "Deletes the tenant customisation of a template; the default template is used again."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Customisation removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/email-templates/{templateKey}/{language}/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/TemplateKey'
      - $ref: '#/components/parameters/LanguagePath'
    post:
      tags: [Admin tenants]
      operationId: previewEmailTemplate
      summary: Render a template with sample data
      description: >-
        Renders the submitted (unsaved) template, or the stored one when the body is empty.
        The HTML of the preview is meant to be shown inside the administration: style
        attributes and style elements are removed (the administration CSP would block them)
        and each image is replaced by its alt text in brackets (inline `cid:` images cannot be
        loaded by a browser). The mails sent keep their styles and images.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateUpdate' }
            example:
              subject: 'Files from {{sender_email}}'
              bodyHtml: '<p>{{sender_email}} sent you files.</p><p><a href="{{download_link}}">Download</a></p>{{password_notice}}{{files}}'
              bodyText: "{{sender_email}} sent you files.\n{{download_link}}\n\n{{password_notice}}\n\n{{files}}"
      responses:
        '200':
          description: Rendered email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailPreview' }
              example:
                subject: Files from alice@entity-a.example.com
                bodyHtml: "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n<title>Files from alice@entity-a.example.com</title>\n</head>\n<body>\n<div role=\"main\">\n<p>alice@entity-a.example.com sent you files.</p><p><a href=\"https://transfer.entity-a.example.com/d/dl_sample\">Download</a></p><p><strong>This transfer is protected by a password. The password will be sent to you by another channel; it is never written in this message.</strong></p><ul>\n<li><strong>report.pdf</strong> (1.5 MB)<br/>\n<span>SHA-256: <code>abababababababababababababababababababababababababababababababab</code></span></li>\n</ul>\n</div>\n</body></html>"
                bodyText: "alice@entity-a.example.com sent you files.\nhttps://transfer.entity-a.example.com/d/dl_sample\n\nThis transfer is protected by a password. The password will be sent to you by another channel; it is never written in this message.\n\n- report.pdf (1.5 MB)\n  SHA-256: abababababababababababababababababababababababababababababababab\n"
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

