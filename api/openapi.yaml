  /admin/tenants/{tenantId}/confidentiality-levels:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getConfidentialityLevels
      summary: Confidentiality levels and their rules
      description: |
        Since 1.1. Returns the confidentiality levels offered to the senders of the tenant, in
        display order, with their labels per language and the rules each one imposes. A new
        tenant (and every tenant existing before 1.1) starts with three default levels:
        `public`, `internal` (the default) and `confidential` (recipient verification and
        password required, 1 or 7 days, internal recipients only). Readable by any admin attached
        to the tenant.
      security:
        - adminSession: []
      responses:
        '200':
          description: Levels in display order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfidentialityLevelList' }
              example:
                items:
                  - key: public
                    labels: { fr: Public, en: Public }
                    isDefault: false
                    rules: { requireRecipientVerification: false, requirePassword: false, allowedExpiryDays: [1, 7, 30], internalRecipientsOnly: false, forceDeleteAfterFirstDownload: false, maxDownloads: null }
                  - key: internal
                    labels: { fr: Interne, en: Internal }
                    isDefault: true
                    rules: { requireRecipientVerification: false, requirePassword: false, allowedExpiryDays: [1, 7, 30], internalRecipientsOnly: false, forceDeleteAfterFirstDownload: false, maxDownloads: null }
                  - key: confidential
                    labels: { fr: Confidentiel, en: Confidential }
                    descriptions: { fr: Réservé aux destinataires internes vérifiés., en: Verified internal recipients only. }
                    isDefault: false
                    rules: { requireRecipientVerification: true, requirePassword: true, allowedExpiryDays: [1, 7], internalRecipientsOnly: true, forceDeleteAfterFirstDownload: false, maxDownloads: null }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateConfidentialityLevels
      summary: Replace the confidentiality levels
      description: |
        Since 1.1. Replaces the whole list (the array order is the display order): 1 to 10
        levels with unique keys, exactly one of them the default (`400 validation-failed` naming
        the member otherwise). With a single level, the deposit form hides the level selector.
        Every level needs a label in each supported language (an optional description per
        language is shown in the form and the help), and `allowedExpiryDays` must be a non-empty
        subset of the tenant durations. The change applies to new transfers only: existing transfers keep the level
        key, label and rules they were created with. Requires the right to change the tenant.
        Audited as `tenant.confidentiality_updated` with the list of keys.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfidentialityLevelList' }
            example:
              items:
                - key: internal
                  labels: { fr: Interne, en: Internal }
                  isDefault: true
                  rules: { requireRecipientVerification: false, requirePassword: false, allowedExpiryDays: [1, 7, 30], internalRecipientsOnly: false, forceDeleteAfterFirstDownload: false, maxDownloads: null }
                - key: confidential
                  labels: { fr: Confidentiel, en: Confidential }
                  isDefault: false
                  rules: { requireRecipientVerification: true, requirePassword: true, allowedExpiryDays: [1], internalRecipientsOnly: true, forceDeleteAfterFirstDownload: true, maxDownloads: 3 }
      responses:
        '200':
          description: Saved levels.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfidentialityLevelList' }
              example:
                items:
                  - key: internal
                    labels: { fr: Interne, en: Internal }
                    isDefault: true
                    rules: { requireRecipientVerification: false, requirePassword: false, allowedExpiryDays: [1, 7, 30], internalRecipientsOnly: false, forceDeleteAfterFirstDownload: false, maxDownloads: null }
                  - key: confidential
                    labels: { fr: Confidentiel, en: Confidential }
                    isDefault: false
                    rules: { requireRecipientVerification: true, requirePassword: true, allowedExpiryDays: [1], internalRecipientsOnly: true, forceDeleteAfterFirstDownload: true, maxDownloads: 3 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/recipient-rules:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getRecipientRules
      summary: Allowed and denied recipient domains
      description: "Since 1.1. Returns the recipient domain rules of the tenant (see `RecipientRules` for the matching). Both lists are empty by default: any recipient is allowed. Readable by any admin attached to the tenant."
      security:
        - adminSession: []
      responses:
        '200':
          description: Recipient domain rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientRules' }
              example:
                allowedDomains: []
                deniedDomains: [mail.example.net, webmail.example.org]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateRecipientRules
      summary: Replace the allowed and denied recipient domains
      description: |
        Since 1.1. Replaces both lists. Domains are trimmed, normalised to lower-case punycode
        without trailing dot and validated (`400 validation-failed` naming the entry, for example
        `/deniedDomains/1`); duplicates within a list are refused. The rules apply to transfers
        created afterwards (`POST /transfers` answers `403 recipient-domain-refused` naming the
        refused recipients). Requires the right to change the tenant. Audited as
        `tenant.recipient_rules_updated` with the domains.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipientRules' }
            examples:
              denyList:
                summary: Deny consumer mail domains
                value: { allowedDomains: [], deniedDomains: [mail.example.net, webmail.example.org] }
              allowList:
                summary: Only partners
                value: { allowedDomains: [entity-a.example.com, partner.example.org], deniedDomains: [] }
      responses:
        '200':
          description: Saved rules (normalised).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientRules' }
              example: { allowedDomains: [], deniedDomains: [mail.example.net, webmail.example.org] }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/abuse-thresholds:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getAbuseThresholds
      summary: Abuse detection thresholds
      description: |
        Since 1.1. Returns the abuse detection settings of the tenant (see `AbuseThresholds`):
        per-sender daily limits, unusual behaviour detection, office hours, invitation limit and
        external quotas. A `null` threshold disables its rule. Readable by any admin attached to
        the tenant.
      security:
        - adminSession: []
      responses:
        '200':
          description: Abuse detection settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbuseThresholds' }
              example:
                maxDailyBytesPerSender: 107374182400
                maxDailyTransfersPerSender: 50
                maxRecipientsPerTransfer: 50
                blockOnExceed: false
                unusualVolumeFactor: 5
                unusualMinHistoryDays: 7
                largeExternalTransferBytes: 10737418240
                timeZone: Europe/Paris
                officeHours: { start: '08:00', end: '19:00', weekdays: [1, 2, 3, 4, 5] }
                maxInvitationsPerInviter: 20
                externalMaxDailyBytes: 21474836480
                externalMaxDailyDeposits: 10
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateAbuseThresholds
      summary: Replace the abuse detection thresholds
      description: |
        Since 1.1. Replaces every setting (absent nullable members are refused, so that a
        forgotten field never silently disables a rule: send `null` to disable one). Counters are
        computed per day of the thresholds' `timeZone` (UTC by default) from the transfers of the
        tenant. A threshold exceeded raises an
        alert to the delegated admins (mail `abuse-alert`, webhook event
        `abuse.threshold_exceeded` or `abuse.unusual_activity`), at most once per sender, rule and
        day; with `blockOnExceed`, a transfer creation that would exceed a per-sender limit or an
        external quota is refused (`403 abuse-threshold-blocked`). Requires the right to change the
        tenant. Audited as `tenant.abuse_settings_updated` with the changed field names.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbuseThresholds' }
            example:
              maxDailyBytesPerSender: 107374182400
              maxDailyTransfersPerSender: 50
              maxRecipientsPerTransfer: 50
              blockOnExceed: true
              unusualVolumeFactor: 2.5
              unusualMinHistoryDays: 14
              largeExternalTransferBytes: 10737418240
              timeZone: UTC
              officeHours: null
              maxInvitationsPerInviter: 20
              externalMaxDailyBytes: 21474836480
              externalMaxDailyDeposits: 10
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbuseThresholds' }
              example:
                maxDailyBytesPerSender: 107374182400
                maxDailyTransfersPerSender: 50
                maxRecipientsPerTransfer: 50
                blockOnExceed: true
                unusualVolumeFactor: 2.5
                unusualMinHistoryDays: 14
                largeExternalTransferBytes: 10737418240
                timeZone: UTC
                officeHours: null
                maxInvitationsPerInviter: 20
                externalMaxDailyBytes: 21474836480
                externalMaxDailyDeposits: 10
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/webhooks:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: listTenantWebhooks
      summary: List the webhooks of the tenant
      description: "Since 1.1. Lists the webhooks of the tenant with their subscribed events and last delivery status. The URL is never returned in full (it often embeds a secret): only `urlHint` (scheme and host). Readable by any admin attached to the tenant."
      security:
