      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReason' }
            example: { reason: Sent to the wrong recipient at the sender's request. }
      responses:
        '204': { description: Transfer deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

