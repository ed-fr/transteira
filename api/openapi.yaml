      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: "Invitation revoked, or already revoked or expired (no-op)." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/blocklist:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin operations]
      operationId: listBlocklist
      summary: List blocklist entries
      description: "Lists the blocklist entries of the tenant (email addresses, domains and SHA-256 fingerprints)."
      security:
        - adminSession: []
      parameters:
        - name: kind
          in: query
          description: "Filter by entry kind."
          schema: { $ref: '#/components/schemas/BlocklistKind' }
          example: domain
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlocklistList' }
              example:
                items:
                  - { id: blk_01JABCH2J3K415M6N7P8Q9R0S1, kind: domain, value: spam.example.net, comment: Repeated abuse, createdBy: admin.entity-a, createdAt: '2026-10-10T08:00:00Z' }
                  - { id: blk_01JABCH3K415M6N7P8Q9R0S1T2, kind: sha256, value: 275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f, comment: Known malware sample, createdBy: admin.entity-a, createdAt: '2026-10-11T08:00:00Z' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin operations]
      operationId: createBlocklistEntry
      summary: Add a blocklist entry
      description: |
        Adds an email address, a domain or a SHA-256 fingerprint to the tenant blocklist. The value
        is trimmed and normalised to lower case, then validated according to its kind: an email
        address (`email`), a domain name without `@` (`domain`, such as `spam.example.net`), or
        64 hexadecimal characters (`sha256`); otherwise `400 validation-failed` on `/value`. A
        value already listed for the same kind is refused with `409 already-exists`.

        Audited as `blocklist.updated`: the value is stored in the audit details for the `domain`
        and `sha256` kinds only, never for an `email` entry (only its kind and identifier).
        Requires the right to change the tenant.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlocklistEntryCreate' }
            example: { kind: email, value: mallory@example.net, comment: Phishing attempts }
      responses:
        '201':
          description: Entry created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlocklistEntry' }
              example: { id: blk_01JABCH415M6N7P8Q9R0S1T2V3, kind: email, value: mallory@example.net, comment: Phishing attempts, createdBy: admin.entity-a, createdAt: '2026-10-19T16:15:00Z' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/blocklist/{entryId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: entryId
        in: path
        description: "Blocklist entry identifier."
        required: true
        schema: { type: string, pattern: '^blk_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        example: blk_01JABCH415M6N7P8Q9R0S1T2V3
    delete:
      tags: [Admin operations]
      operationId: deleteBlocklistEntry
      summary: Remove a blocklist entry
      description: "Removes an entry from the tenant blocklist. Audited as `blocklist.updated`, with the value for the `domain` and `sha256` kinds only. Requires the right to change the tenant."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Entry removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/api-tokens:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin operations]
      operationId: listApiTokens
      summary: List API tokens (never the secret)
      description: "Lists the API tokens of the tenant (revoked ones included) with their allowed IP ranges and usage dates. Secrets are never returned. Readable by any admin attached to the tenant; a tenant the admin is not attached to answers `404`. `lastUsedAt` is updated at most once a minute per token."
      security:
        - adminSession: []
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
              example:
                - id: tok_01JABCJ5M6N7P8Q9R0S1T2V3V4
                  name: Nightly ERP export
                  prefix: tt_EXAM
                  allowedCidrs: [10.10.20.15/32]
                  allowedSenders: [reporting@entity-a.example.com]
                  createdBy: admin.entity-a
                  createdAt: '2026-10-01T08:00:00Z'
                  lastUsedAt: '2026-10-19T02:00:12Z'
                  expiresAt: null
                  revokedAt: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin operations]
      operationId: createApiToken
      summary: Create an API token
      description: |
        The secret is returned **once** in this response and stored hashed. No expiry by default.
        `allowedCidrs` is mandatory: list the IP ranges the token may be used from, or
        `0.0.0.0/0` and `::/0` to allow any address explicitly. `allowedSenders` optionally
        restricts the sender addresses the token may deposit as (see `AllowedSenders`); errors on
        one entry name `/allowedSenders/<index>`.

        Requires the right to change the tenant; a tenant the admin is not attached to answers
        `404`. Audited as `api_token.created` (never with the secret; the allowed senders are
        recorded as a count only, never the addresses).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreate' }
            examples:
              singleHost:
                summary: Restricted to one server
                value: { name: Nightly ERP export, allowedCidrs: [10.10.20.15/32], allowedSenders: [reporting@entity-a.example.com], expiresAt: null }
              anyAddress:
                summary: Usable from any address (explicit)
                value: { name: Partner integration, allowedCidrs: [0.0.0.0/0, '::/0'], expiresAt: '2027-06-30T23:59:59Z' }
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
              example:
                id: tok_01JABCJ5M6N7P8Q9R0S1T2V3V4
                name: Nightly ERP export
                prefix: tt_EXAM
                allowedCidrs: [10.10.20.15/32]
                allowedSenders: [reporting@entity-a.example.com]
                createdBy: admin.entity-a
                createdAt: '2026-10-19T16:20:00Z'
                lastUsedAt: null
                expiresAt: null
                revokedAt: null
                token: tt_EXAMPLE4fK2xQ8mL1zV4bN7cR0tY3wE6uI9oP2aS5dF
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/api-tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: tokenId
        in: path
        description: "API token identifier."
        required: true
        schema: { type: string, pattern: '^tok_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        example: tok_01JABCJ5M6N7P8Q9R0S1T2V3V4
    patch:
      tags: [Admin operations]
      operationId: updateApiToken
      summary: Rename a token or change its allowed IP ranges or senders
      description: "Renames an API token or replaces its allowed IP ranges or allowed senders (`allowedSenders: []` allows any internal address again). A revoked token cannot be modified (`409 state-conflict`). Requires the right to change the tenant; a tenant the admin is not attached to, or a token of another tenant, answers `404`. Audited as `api_token.updated` (the allowed senders as a count only)."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ApiTokenUpdate' }
            example: { allowedCidrs: [10.10.20.16/32] }
      responses:
        '200':
          description: Updated token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiToken' }
              example:
                id: tok_01JABCJ5M6N7P8Q9R0S1T2V3V4
                name: Nightly ERP export
                prefix: tt_EXAM
                allowedCidrs: [10.10.20.16/32]
                allowedSenders: [reporting@entity-a.example.com]
                createdBy: admin.entity-a
                createdAt: '2026-10-01T08:00:00Z'
                lastUsedAt: '2026-10-19T02:00:12Z'
                expiresAt: null
                revokedAt: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin operations]
      operationId: revokeApiToken
      summary: Revoke an API token (immediate)
      description: "Revokes an API token; subsequent calls with it are refused immediately (`401 invalid-credentials`). Revoking a token that is already revoked is a no-op answered `204` (not audited again). Requires the right to change the tenant; a tenant the admin is not attached to, or a token of another tenant, answers `404`. Audited as `api_token.revoked`."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: 'Token revoked, or already revoked.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

