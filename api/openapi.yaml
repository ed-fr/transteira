openapi: 3.1.0

info:
  title: TransTeira API
  version: 1.0.0-draft.1
  summary: Multi-tenant, self-hosted large file transfer.
  description: |
    TransTeira is a self-hosted, multi-tenant file transfer service (WeTransfer-like)
    designed for organisations with several entities (tenants).

    ## Tenant resolution
    Every request is bound to exactly **one tenant**, resolved from the `Host` header
    (for example `transfer.entity-a.example.com`). There is no tenant identifier in public
    URLs. A request for an unknown host is rejected with `421 Misdirected Request`
    (problem code `unknown-tenant`) and recorded in the security log.

    Administration endpoints are an exception: an admin may manage several tenants, so the
    tenant is given explicitly in the path (`/admin/tenants/{tenantId}/...`) and checked
    against the admin's assignments. The host used to reach the admin space is still
    validated (see `TT_ADMIN_HOSTS` in `.env.example`).

    ## Authentication
    | Scheme | Used by | Transport |
    |---|---|---|
    | `depositSession` | Depositors (internal users, invited externals) after email verification | Cookie `__Host-tt_deposit` |
    | `adminSession` | Super admin and delegated admins after password + TOTP | Cookie `__Host-tt_admin` |
    | `csrfToken` | Required with any cookie-based scheme on unsafe methods (`POST`, `PUT`, `PATCH`, `DELETE`) | Header `X-CSRF-Token` |
    | `apiToken` | Automated deposits by scripts and third-party software | `Authorization: Bearer tt_...` |
    | `downloadGrant` | Recipients who unlocked a password-protected transfer | Cookie `__Host-tt_dl` |

    Only strictly technical cookies are used (`Secure`, `HttpOnly`, `SameSite=Strict`).

    ## Errors
    All errors use **RFC 9457 Problem Details** (`application/problem+json`). Each problem carries
    a stable machine-readable `code` extension member; the full catalogue is documented in
    `docs/api/errors.md` and in the `ProblemCode` schema below. Clients must rely on `code`,
    never on `title` or `detail`, which are localised.

    ## Large uploads (tus)
    File content is uploaded with the [tus 1.0.0](https://tus.io/protocols/resumable-upload)
    resumable upload protocol. Creating a transfer (`POST /transfers`) pre-creates one tus upload
    resource per declared file and returns its `uploadUrl`; clients then use `HEAD` and `PATCH`
    on that URL. Supported tus extensions: `expiration`, `termination`.
    The tus `creation` extension is intentionally not exposed: uploads are always attached to a
    transfer whose limits and quota have been checked beforehand.

    ## Pagination
    List endpoints use opaque cursors: `?limit=50&cursor=...`; responses contain `items` and
    `nextCursor` (absent on the last page).

    ## Versioning
    The API is versioned in the URL (`/api/v1`). No incompatible change is made within a major
    version: fields may be added, never removed or retyped. Enumerations marked
    `x-extensible-enum` may gain new values; clients must tolerate unknown values.

    ## Roadmap reservations (not part of V1)
    The following path prefixes and fields are **reserved** so that later versions do not
    require a breaking change:
    - V1.1: `/me/transfers` ("My transfers"), `/downloads/{linkToken}/reply`,
      `/downloads/{linkToken}/abuse-reports`, `/admin/tenants/{tenantId}/webhooks`,
      `/admin/tenants/{tenantId}/abuse-thresholds`, `/admin/tenants/{tenantId}/confidentiality-levels`,
      `/admin/tenants/{tenantId}/recipient-rules`, `/status`, `/metrics`;
      transfer fields `maxDownloads`, `recipientVerification`, `confidentialityLevel`, file field `path`.
    - V2: `/admin/auth/oidc/*`, `/admin/tenants/{tenantId}/sso`, `/admin/tenants/{tenantId}/drop-links`,
      `/admin/tenants/{tenantId}/export`, `/admin/tenants/import`, `/transfers/{transferId}/proof`;
      admin role `auditor`; transfer fields `linkOnly`, `endToEndEncrypted`.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: TransTeira project
    url: https://github.com/ed-fr/transteira

servers:
  - url: /api/v1
    description: Same origin as the tenant FQDN (for example https://transfer.entity-a.example.com/api/v1)

tags:
  - name: Meta
    description: Version, health and public tenant information.
  - name: Deposit sessions
    description: Identification of depositors by email address and one-time verification code.
  - name: Transfers
    description: Creation and follow-up of transfers by their sender (session or API token).
  - name: Uploads (tus)
    description: Resumable upload of file content with the tus 1.0.0 protocol.
  - name: Invitations
    description: Invitations issued by internal users so that externals can deposit files.
  - name: Downloads
    description: Public download pages for recipients.
  - name: Admin auth
    description: First-run setup, login with TOTP, own account management.
  - name: Admin tenants
    description: Tenant creation (super admin) and configuration (super admin and delegated admins).
  - name: Admin operations
    description: Transfers, invitations, blocklist, API tokens, audit, statistics and GDPR requests of a tenant.
  - name: Admin system
    description: Instance-wide operations reserved to the super admin.

paths:
  # ---------------------------------------------------------------------------
  # Meta
  # ---------------------------------------------------------------------------
  /healthz:
    servers:
      - url: /
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Health check
      description: |
        Checks the application, the database and ClamAV availability. Answers even in
        maintenance mode. Does not require a known tenant host, so that it can be probed
        directly on the container (Uptime Kuma, Docker healthcheck). Never exposes secrets
        or tenant data.
      security: []
      responses:
        '200':
          description: All components are healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: ok
                version: 1.0.0
                maintenance: false
                checks: { database: ok, antivirus: ok, storage: ok }
        '503':
          description: At least one component is unhealthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: degraded
                version: 1.0.0
                maintenance: false
                checks: { database: ok, antivirus: unavailable, storage: ok }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /openapi.yaml:
    servers:
      - url: /api
    get:
      tags: [Meta]
      operationId: getOpenApiSpec
      summary: Download the OpenAPI specification
      description: Returns this specification. Publicly accessible so that clients can be generated.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
              example: "openapi: 3.1.0\ninfo:\n  title: TransTeira API\n"
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /version:
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Application version
      description: "Returns the semantic version of the running instance and the API major version, so that clients can check compatibility."
      security: []
      responses:
        '200':
          description: Semantic version of the running instance and API.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
              example: { version: 1.0.0, apiVersion: v1, commit: 3f9c2ab }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tenant:
    get:
      tags: [Meta]
      operationId: getPublicTenant
      summary: Public configuration of the current tenant
      description: |
        Branding, language and limits needed by the public interface. The response language
        follows `Accept-Language` when available, otherwise the tenant default language.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Public tenant configuration.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTenant' }
              example:
                name: Entity A
                language: fr
                availableLanguages: [fr, en]
                branding:
                  primaryColor: '#0B5FFF'
                  accentColor: '#00875A'
                  logoUrl: /api/v1/tenant/assets/logo
                  backgroundUrl: /api/v1/tenant/assets/background
                limits:
                  maxTransferBytes: 21474836480
                  expiryDays: [1, 7, 30]
                maintenance: false
                legalDocuments: [legal-notice, privacy-policy]
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tenant/assets/{asset}:
    get:
      tags: [Meta]
      operationId: getTenantAsset
      summary: Tenant logo or background image
      description: Returns the configured image, or the default one when the tenant has none.
      security: []
      parameters:
        - name: asset
          in: path
          description: "Which image: `logo` or `background`."
          required: true
          schema: { type: string, enum: [logo, background] }
          example: logo
      responses:
        '200':
          description: "Image content. Served with `X-Content-Type-Options: nosniff` and a long cache lifetime with ETag."
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '304':
          description: Not modified.
        '404': { $ref: '#/components/responses/NotFound' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tenant/legal/{document}:
    get:
      tags: [Meta]
      operationId: getTenantLegalDocument
      summary: Legal notice or privacy policy of the tenant
      description: "Returns the legal notice or the privacy policy of the current tenant in the negotiated language, falling back to the tenant default language."
      security: []
      parameters:
        - $ref: '#/components/parameters/LegalDocumentPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Document in the negotiated language (Markdown source; rendered by the client).
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
              example:
                document: privacy-policy
                language: en
                markdown: "# Privacy policy\n\nEntity A processes the email addresses..."
                updatedAt: '2026-10-01T09:00:00Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Deposit sessions
  # ---------------------------------------------------------------------------
  /deposit-sessions:
    post:
      tags: [Deposit sessions]
      operationId: startDepositSession
      summary: Identify a depositor by email address
      description: |
        Starts the identification of a depositor.

        Eligibility is checked first (in this order): blocklist, then either an
        `invitationToken` (external depositor) or the internal-user rule (client IP in a tenant
        CIDR range **and** email domain in the tenant's allowed domains).

        - If the address has already been verified for this tenant, a deposit session is
          created immediately (`201`) and the address' last-use date is refreshed.
        - Otherwise a 6-digit code is sent through the tenant SMTP server and a verification
          challenge is returned (`202`). The code is valid 15 minutes and allows 2 wrong attempts.

        Rate limits: 5 codes per hour per address, 20 codes per hour per client IP.
        Refused deposits are written to the security log.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositSessionStart' }
            examples:
              internal:
                summary: Internal user on the corporate network
                value: { email: alice@entity-a.example.com }
              invited:
                summary: External user with an invitation
                value: { email: bob@partner.example.org, invitationToken: inv_9sK2mQ7xL0aZ4vR8tYb3nC6dE1fG5hJ }
      responses:
        '201':
          description: Address already verified; deposit session created.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetDepositCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositSession' }
              example:
                email: alice@entity-a.example.com
                kind: internal
                csrfToken: csrf_Jd83kLm0Qp2Zx7Vb
                expiresAt: '2026-10-19T20:00:00Z'
                limits: { maxTransferBytes: 21474836480, expiryDays: [1, 7, 30] }
                canInvite: true
        '202':
          description: A verification code has been sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationChallenge' }
              example:
                challengeId: vch_4Fq9Lm2Zx8Rt6Yb1Kd7Pw3
                email: alice@entity-a.example.com
                expiresAt: '2026-10-19T16:15:00Z'
                attemptsRemaining: 2
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/DepositForbidden' }
        '410': { $ref: '#/components/responses/InvitationGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MaintenanceMode' }
        '500': { $ref: '#/components/responses/InternalError' }

  /verification-challenges/{challengeId}/confirm:
    post:
      tags: [Deposit sessions]
      operationId: confirmVerificationChallenge
      summary: Submit the verification code
      description: |
        Validates the 6-digit code. On success the address is stored as verified for the tenant
        (it will not be asked again for 12 months of inactivity) and a deposit session is created.
        After 2 wrong codes the challenge is invalidated and a new code must be requested.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCode' }
            example: { code: '482913' }
      responses:
        '201':
          description: Code accepted; deposit session created.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetDepositCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositSession' }
              example:
                email: bob@partner.example.org
                kind: external
                csrfToken: csrf_Pq1Lm8Zx3Vb7Kd0R
                expiresAt: '2026-10-19T20:00:00Z'
                limits: { maxTransferBytes: 21474836480, expiryDays: [1, 7, 30] }
                canInvite: false
                invitation:
                  invitedBy: alice@entity-a.example.com
                  expiresAt: '2027-10-01T08:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Challenge expired or invalidated after too many wrong attempts.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#verification-exhausted
                title: Verification code invalidated
                status: 410
                code: verification-exhausted
                detail: Too many wrong attempts. Please request a new code.
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '422':
          description: Wrong code; at least one attempt remains.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#verification-code-invalid
                title: Invalid verification code
                status: 422
                code: verification-code-invalid
                attemptsRemaining: 1
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /deposit-sessions/current:
    get:
      tags: [Deposit sessions]
      operationId: getCurrentDepositSession
      summary: Current deposit session
      description: "Returns the address, depositor kind, limits and CSRF token of the current deposit session. Used by the web interface after a page reload."
      security:
        - depositSession: []
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositSession' }
              example:
                email: alice@entity-a.example.com
                kind: internal
                csrfToken: csrf_Jd83kLm0Qp2Zx7Vb
                expiresAt: '2026-10-19T20:00:00Z'
                limits: { maxTransferBytes: 21474836480, expiryDays: [1, 7, 30] }
                canInvite: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Deposit sessions]
      operationId: endDepositSession
      summary: End the deposit session
      description: "Revokes the deposit session server side and clears the session cookie."
      security:
        - depositSession: []
          csrfToken: []
      responses:
        '204':
          description: Session ended; cookie cleared.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Transfers (sender side)
  # ---------------------------------------------------------------------------
  /transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Create a transfer and its upload resources
      description: |
        Declares a transfer and its files. The server checks the per-transfer size limit, the
        tenant storage quota (reserving the declared size), the blocklist, and returns one tus
        `uploadUrl` per file. The transfer stays in `uploading` state until
        `POST /transfers/{transferId}/finalize` is called.

        With an API token, the token is authenticated first (an unknown, revoked or expired token
        always gives `401`, whatever the client IP), then the client IP must belong to the token's
        `allowedCidrs` (otherwise
        `403 ip-not-allowed`, written to the security log), `senderEmail` is mandatory and must
        belong to one of the tenant's internal domains; no email verification is performed (the
        token is the proof).
        With a deposit session, `senderEmail` must be omitted: the verified session address is used.
        An invited external depositor cannot choose recipients: files are addressed to the
        internal user who issued the invitation.

        An unfinished transfer (never finalized) is purged after `TT_UPLOAD_TTL` (24 h by default),
        releasing its quota reservation.
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreate' }
            examples:
              session:
                summary: Internal user, two files, password protected
                value:
                  recipients: [carol@customer.example.net, dave@customer.example.net]
                  message: Here are the plans discussed this morning.
                  expiryDays: 7
                  password: correct horse battery staple
                  deleteAfterFirstDownload: false
                  language: en
                  files:
                    - { name: plans-v3.pdf, size: 15728640, mediaType: application/pdf }
                    - { name: site-survey.mp4, size: 12884901888, mediaType: video/mp4 }
              apiToken:
                summary: Automated deposit with an API token
                value:
                  senderEmail: reporting@entity-a.example.com
                  recipients: [finance@entity-a.example.com]
                  expiryDays: 1
                  files:
                    - { name: export-2026-10-19.csv, size: 52428800, expectedSha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }
      responses:
        '201':
          description: Transfer created; upload the files with tus, then finalize.
          headers:
            Location:
              description: URL of the created transfer.
              schema: { type: string }
              example: /api/v1/transfers/trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderTransfer' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: uploading
                senderEmail: alice@entity-a.example.com
                recipients: [carol@customer.example.net, dave@customer.example.net]
                message: Here are the plans discussed this morning.
                expiryDays: 7
                passwordProtected: true
                deleteAfterFirstDownload: false
                totalBytes: 12900630528
                createdAt: '2026-10-19T16:00:00Z'
                uploadExpiresAt: '2026-10-20T16:00:00Z'
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    size: 15728640
                    mediaType: application/pdf
                    uploadUrl: /api/v1/uploads/upl_7Hq2Wm9Zx4Lp1Vb8Rt3Yk6Nd
                    uploadOffset: 0
                    scanStatus: pending
                  - id: fil_01JABCDA0K112M3N4P5Q6R7S8T
                    name: site-survey.mp4
                    size: 12884901888
                    mediaType: video/mp4
                    uploadUrl: /api/v1/uploads/upl_2Bc5Df8Gh1Jk4Lm7Np0Qr3St
                    uploadOffset: 0
                    scanStatus: pending
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DepositForbidden' }
        '413': { $ref: '#/components/responses/TransferTooLarge' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MaintenanceMode' }
        '507': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }

  /transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Follow a transfer as its sender
      description: |
        Returns the state of a transfer created by the same deposit session or by an API token of
        the same tenant. Used to poll antivirus progress after finalization.
      security:
        - depositSession: []
        - apiToken: []
      responses:
        '200':
          description: Transfer state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderTransfer' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: available
                senderEmail: alice@entity-a.example.com
                recipients: [carol@customer.example.net]
                expiryDays: 7
                expiresAt: '2026-10-26T16:20:00Z'
                passwordProtected: true
                deleteAfterFirstDownload: false
                totalBytes: 12900630528
                createdAt: '2026-10-19T16:00:00Z'
                finalizedAt: '2026-10-19T16:20:00Z'
                downloadUrl: https://transfer.entity-a.example.com/d/dl_Xk4Lm9Qp2Zr7Vb1Nt6Yc3Hd8Jf
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    size: 15728640
                    mediaType: application/pdf
                    sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                    scanStatus: clean
                  - id: fil_01JABCDA0K112M3N4P5Q6R7S8T
                    name: site-survey.mp4
                    size: 12884901888
                    mediaType: video/mp4
                    sha256: b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
                    scanStatus: not_scanned_too_large
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Transfers]
      operationId: cancelTransfer
      summary: Cancel or delete a transfer as its sender
      description: |
        Deletes the transfer, its uploads and files, with crypto-erase of the file keys.
        In V1 a sender may only cancel a transfer that is not yet `available`; deleting an
        available transfer is reserved to admins (and to the V1.1 "My transfers" feature).
        API tokens may delete any transfer they created.
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      responses:
        '204':
          description: Transfer deleted.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /transfers/{transferId}/finalize:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Transfers]
      operationId: finalizeTransfer
      summary: Finalize a transfer after all files are uploaded
      description: |
        Checks that every declared file is fully uploaded, compares `expectedSha256` when it was
        provided, checks file hashes against the blocklist, then queues the antivirus scan.
        Once every file is scanned, infected files are deleted (sender alerted), and notifications
        are sent: recipients receive the link, a QR code (inline CID) and SHA-256 fingerprints;
        the sender receives a confirmation. If every file is infected, the transfer ends in
        `rejected` state and no recipient is notified.

        Antivirus availability is **fail-closed**: while clamd is unreachable, files stay in
        `scanning`, the scan is retried with back-off, the super admin is alerted, and nothing is
        made available. Only files above the ClamAV size limits are released unscanned
        (`not_scanned_too_large`), as required by the specification.
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      responses:
        '202':
          description: Accepted; antivirus scan in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderTransfer' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: scanning
                senderEmail: alice@entity-a.example.com
                recipients: [carol@customer.example.net]
                expiryDays: 7
                passwordProtected: true
                deleteAfterFirstDownload: false
                totalBytes: 15728640
                createdAt: '2026-10-19T16:00:00Z'
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    size: 15728640
                    mediaType: application/pdf
                    sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                    scanStatus: scanning
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: CSRF failure, or a file hash is on the tenant blocklist (`blocked-file`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#blocked-file
                title: File refused
                status: 403
                code: blocked-file
                detail: One of the files is not allowed by the administrators of this service.
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Some files are not fully uploaded, a checksum mismatched, or the transfer is not in `uploading` state.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                incomplete:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#upload-incomplete
                    title: Upload incomplete
                    status: 409
                    code: upload-incomplete
                    files: [fil_01JABCDA0K112M3N4P5Q6R7S8T]
                checksum:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#checksum-mismatch
                    title: Checksum mismatch
                    status: 409
                    code: checksum-mismatch
                    files: [fil_01JABCD9F1A2B3C4D5E6F7G8H9]
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '503': { $ref: '#/components/responses/MaintenanceMode' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # tus uploads
  # ---------------------------------------------------------------------------
  /uploads:
    options:
      tags: [Uploads (tus)]
      operationId: getTusCapabilities
      summary: tus server capabilities
      description: "Returns the tus protocol version, the supported extensions and the maximum upload size for the current tenant."
      security: []
      responses:
        '204':
          description: Supported tus version and extensions.
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
            Tus-Version:
              schema: { type: string }
              example: 1.0.0
            Tus-Extension:
              schema: { type: string }
              example: expiration,termination
            Tus-Max-Size:
              description: Maximum size of a single upload resource, in bytes (the per-transfer limit of the tenant).
              schema: { type: integer }
              example: 21474836480
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    head:
      tags: [Uploads (tus)]
      operationId: getUploadOffset
      summary: Current offset of an upload (resume)
      description: "Returns the number of bytes durably stored for an upload, so that an interrupted upload can resume at the right offset."
      security:
        - depositSession: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/TusResumableHeader'
      responses:
        '200':
          description: "Current offset. Responses are never cached (`Cache-Control: no-store`)."
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
            Upload-Offset: { $ref: '#/components/headers/UploadOffset' }
            Upload-Length:
              schema: { type: integer }
              example: 12884901888
            Upload-Expires: { $ref: '#/components/headers/UploadExpires' }
        '401': { description: Unauthenticated. }
        '404': { description: "Unknown upload, or upload belonging to another session or tenant." }
        '410': { description: Upload expired and purged. }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Uploads (tus)]
      operationId: appendUploadChunk
      summary: Append bytes to an upload
      description: |
        Streams bytes at `Upload-Offset`. Content is encrypted (AES-256-GCM, chunked) and hashed
        (SHA-256) on the fly while being written to disk; nothing is buffered in memory and the
        database is not written per chunk. Any chunk size is accepted; the server persists
        progress on disk so that an interrupted request can be resumed from the last durable offset
        (obtained with `HEAD`).
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/TusResumableHeader'
        - name: Upload-Offset
          in: header
          description: "Offset at which the bytes of this request start; must equal the current offset of the upload."
          required: true
          schema: { type: integer, minimum: 0 }
          example: 0
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
            example: "<binary data>"
      responses:
        '204':
          description: Bytes appended.
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
            Upload-Offset: { $ref: '#/components/headers/UploadOffset' }
            Upload-Expires: { $ref: '#/components/headers/UploadExpires' }
        '401': { description: Unauthenticated. }
        '403': { description: CSRF failure. }
        '404': { description: "Unknown upload, or upload belonging to another session or tenant." }
        '409': { description: '`Upload-Offset` does not match the current offset.' }
        '410': { description: Upload expired and purged. }
        '412': { description: Unsupported `Tus-Resumable` version. }
        '413': { description: Bytes beyond the declared `Upload-Length`. }
        '415': { description: 'Content-Type is not `application/offset+octet-stream`.' }
        '503': { description: Maintenance mode; retry after `Retry-After`. Uploads already started may be resumed after maintenance. }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Uploads (tus)]
      operationId: terminateUpload
      summary: Abort an upload (tus termination)
      description: Removes the partial file. The file is removed from the transfer declaration and the quota reservation is released.
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/TusResumableHeader'
      responses:
        '204':
          description: Upload terminated.
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
        '401': { description: Unauthenticated. }
        '404': { description: Unknown upload. }
        '409': { description: Transfer already finalized. }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Invitations
  # ---------------------------------------------------------------------------
  /invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite an external user to deposit files
      description: |
        Reserved to internal depositors. Sends an invitation email (tenant SMTP and template)
        containing a unique link. Files deposited through it are addressed to the inviter.
        The invitation expires after 12 months if unused. The inviter is recorded in the
        database and in the audit log.
      security:
        - depositSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
            example:
              email: bob@partner.example.org
              message: Please send me the signed contract.
              language: en
      responses:
        '201':
          description: Invitation sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
              example:
                id: inv_01JABCF0Z9Y8X7W6V5V4T3S2R1
                email: bob@partner.example.org
                invitedBy: alice@entity-a.example.com
                status: pending
                createdAt: '2026-10-19T16:00:00Z'
                expiresAt: '2027-10-19T16:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DepositForbidden' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MaintenanceMode' }
        '500': { $ref: '#/components/responses/InternalError' }

  /invitations/{invitationToken}:
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: Check an invitation link
      description: Used by the invitation landing page. Reveals only what the invited person needs.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: Valid invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicInvitation' }
              example:
                email: bob@partner.example.org
                invitedBy: alice@entity-a.example.com
                message: Please send me the signed contract.
                expiresAt: '2027-10-19T16:00:00Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/InvitationGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Downloads (recipient side)
  # ---------------------------------------------------------------------------
  /downloads/{linkToken}:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    get:
      tags: [Downloads]
      operationId: getDownload
      summary: Download page content
      description: |
        Returns the transfer as seen by a recipient. When the transfer is password protected and
        not yet unlocked by this browser, only `locked: true`, the sender and the expiry date are
        returned (no file list).
      security:
        - {}
        - downloadGrant: []
      responses:
        '200':
          description: Transfer details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTransfer' }
              examples:
                unlocked:
                  value:
                    senderEmail: alice@entity-a.example.com
                    message: Here are the plans discussed this morning.
                    expiresAt: '2026-10-26T16:20:00Z'
                    passwordProtected: true
                    locked: false
                    deleteAfterFirstDownload: false
                    totalBytes: 12900630528
                    archiveUrl: /api/v1/downloads/dl_Xk4Lm9Qp2Zr7Vb1Nt6Yc3Hd8Jf/archive
                    files:
                      - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                        name: plans-v3.pdf
                        size: 15728640
                        mediaType: application/pdf
                        sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                        scanStatus: clean
                        downloadUrl: /api/v1/downloads/dl_Xk4Lm9Qp2Zr7Vb1Nt6Yc3Hd8Jf/files/fil_01JABCD9F1A2B3C4D5E6F7G8H9
                      - id: fil_01JABCDA0K112M3N4P5Q6R7S8T
                        name: site-survey.mp4
                        size: 12884901888
                        mediaType: video/mp4
                        sha256: b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
                        scanStatus: not_scanned_too_large
                        downloadUrl: /api/v1/downloads/dl_Xk4Lm9Qp2Zr7Vb1Nt6Yc3Hd8Jf/files/fil_01JABCDA0K112M3N4P5Q6R7S8T
                locked:
                  value:
                    senderEmail: alice@entity-a.example.com
                    expiresAt: '2026-10-26T16:20:00Z'
                    passwordProtected: true
                    locked: true
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/unlock:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      tags: [Downloads]
      operationId: unlockDownload
      summary: Unlock a password-protected transfer
      description: |
        Two independent failure counters apply, each locking for 15 minutes after 3 wrong
        passwords (`429`, with `Retry-After`):
        - **per transfer**, all client IPs combined: the transfer is locked for everyone;
        - **per client IP**, all transfers of the tenant combined: the IP is locked on every transfer.
        Each failure is written to the security log.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferPassword' }
            example: { password: correct horse battery staple }
      responses:
        '204':
          description: Unlocked; the download grant cookie is set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetDownloadGrantCookie' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: Wrong password.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-password-invalid
                title: Wrong password
                status: 401
                code: transfer-password-invalid
                attemptsRemaining: 2
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429':
          description: Too many wrong passwords; locked for 15 minutes.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-locked
                title: Too many attempts
                status: 429
                code: transfer-locked
                retryAfterSeconds: 900
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [Downloads]
      operationId: downloadFile
      summary: Download one file
      description: |
        Streams the decrypted file. Always sent as an attachment
        (`Content-Disposition: attachment` with RFC 6266 `filename*`, `X-Content-Type-Options: nosniff`,
        `Content-Type: application/octet-stream`). Single byte ranges are supported so that
        download managers can resume, including on transfers with `deleteAfterFirstDownload`.

        The transfer counts as downloaded once every byte of every file has been served at least
        once (the union of served ranges is tracked on disk, never per chunk in the database), or
        once the archive has been streamed to its end. This triggers the acknowledgement email to
        the sender. With `deleteAfterFirstDownload`, the transfer is then deleted (with crypto-erase)
        after a grace period (`TT_DELETE_AFTER_DOWNLOAD_GRACE`, 15 minutes by default) so that an
        interrupted final range can still be resumed.
      security:
        - {}
        - downloadGrant: []
      parameters:
        - name: Range
          in: header
          description: "Optional single byte range (RFC 9110) to resume a download."
          required: false
          schema: { type: string }
          example: bytes=1048576-
      responses:
        '200':
          description: Full file content.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDispositionAttachment' }
            Content-Length: { $ref: '#/components/headers/ContentLength' }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
              example: bytes
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
              example: "<binary data>"
        '206':
          description: Partial content.
          headers:
            Content-Range:
              schema: { type: string }
              example: bytes 1048576-15728639/15728640
            Content-Disposition: { $ref: '#/components/headers/ContentDispositionAttachment' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
              example: "<binary data>"
        '401': { $ref: '#/components/responses/DownloadLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '416': { description: Range not satisfiable. }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/archive:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    get:
      tags: [Downloads]
      operationId: downloadArchive
      summary: Download all files as a ZIP archive
      description: |
        Generates a ZIP64 archive on the fly in store mode (no compression, no temporary copy
        on disk). The `Content-Length` is computed in advance. File names inside the archive are
        sanitised (no absolute paths, no `..`, no control or bidirectional characters).
        Range requests are not supported on the archive.
      security:
        - {}
        - downloadGrant: []
      responses:
        '200':
          description: ZIP stream.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDispositionAttachment' }
            Content-Length: { $ref: '#/components/headers/ContentLength' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/zip:
              schema: { type: string, format: binary }
              example: "<binary data>"
        '401': { $ref: '#/components/responses/DownloadLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Admin auth
  # ---------------------------------------------------------------------------
  /admin/setup:
    get:
      tags: [Admin auth]
      operationId: getSetupStatus
      summary: Is first-run setup required?
      description: "Tells the web interface whether the first-run setup (creation of the super admin) still has to be done."
      security: []
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
              example: { setupRequired: true }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin auth]
      operationId: createSuperAdmin
      summary: First-run setup - create the super admin
      description: |
        Only available while no admin exists. If `TT_SETUP_TOKEN` is configured, the token must
        be provided (protects the window between deployment and setup). Returns a pre-auth session
        in `totp_enrollment_required` state: no other admin endpoint is usable until TOTP is confirmed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
            example:
              username: superadmin
              email: it-admin@example.com
              password: a-long-passphrase-of-at-least-12-characters
              setupToken: stp_Kd82Lq0Zm4Xv7Bn1
      responses:
        '201':
          description: Super admin created; TOTP enrollment must follow.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/TransTeira:superadmin?secret=JBSWY3DPEHPK3PXP&issuer=TransTeira
                qrCodePng: iVBORw0KGgoAAAANSUhEUgAA...
                csrfToken: csrf_Ab12Cd34Ef56Gh78
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: Invalid setup token.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#setup-token-invalid
                title: Invalid setup token
                status: 403
                code: setup-token-invalid
        '409':
          description: Setup already completed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#setup-already-done
                title: Setup already completed
                status: 409
                code: setup-already-done
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/auth/login:
    post:
      tags: [Admin auth]
      operationId: adminLogin
      summary: First factor - username and password
      description: |
        On success, sets a pre-auth session cookie whose `status` tells the next step. A full
        session is never granted on password alone. Failures are rate limited and written to the
        security log; the response does not reveal whether the username exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: admin.entity-a, password: a-long-passphrase-of-at-least-12-characters }
      responses:
        '200':
          description: Password accepted; second factor or enrollment required.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginState' }
              example: { status: totp_required, csrfToken: csrf_Ab12Cd34Ef56Gh78 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/auth/totp:
    post:
      tags: [Admin auth]
      operationId: adminVerifyTotp
      summary: Second factor - TOTP code or recovery code
      description: "Validates the second factor (6-digit TOTP code, or a single-use recovery code) of a pre-authenticated admin session and turns it into a full session. Failures are rate limited and written to the security log."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
            examples:
              totp: { value: { code: '204816' } }
              recovery: { value: { recoveryCode: rc-7KQ2-9XLM-4PZD } }
      responses:
        '200':
          description: Authenticated; the session cookie is rotated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginState' }
              example: { status: authenticated, csrfToken: csrf_Zx98Yw76Vu54Ts32 }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/auth/logout:
    post:
      tags: [Admin auth]
      operationId: adminLogout
      summary: Log out
      description: "Revokes the admin session server side and clears the session cookie."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204':
          description: Session revoked server side and cookie cleared.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me:
    get:
      tags: [Admin auth]
      operationId: getAdminMe
      summary: Current admin profile
      description: "Returns the profile of the authenticated admin, their role, the tenants they may manage and the CSRF token for subsequent requests."
      security:
        - adminSession: []
      responses:
        '200':
          description: Profile, role and assigned tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMe' }
              example:
                id: adm_01JABCG1H2J3K415M6N7P8Q9R0
                username: admin.entity-a
                email: admin@entity-a.example.com
                role: delegated_admin
                totpEnabled: true
                tenants:
                  - { id: ten_01JAB00000000000000ENT1TYA, name: Entity A, fqdn: transfer.entity-a.example.com }
                csrfToken: csrf_Zx98Yw76Vu54Ts32
                language: en
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me/password:
    put:
      tags: [Admin auth]
      operationId: changeAdminPassword
      summary: Change own password
      description: Other sessions of the admin are revoked.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
            example:
              currentPassword: a-long-passphrase-of-at-least-12-characters
              newPassword: another-even-longer-passphrase-2026
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me/totp:
    post:
      tags: [Admin auth]
      operationId: startTotpEnrollment
      summary: Start (or restart) TOTP enrollment
      description: "Generates a new TOTP secret for the authenticated admin. The secret only becomes active once confirmed with a valid code."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '200':
          description: New TOTP secret to confirm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/TransTeira:admin.entity-a?secret=JBSWY3DPEHPK3PXP&issuer=TransTeira
                qrCodePng: iVBORw0KGgoAAAANSUhEUgAA...
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin auth]
      operationId: disableTotp
      summary: Disable TOTP (delegated admins only)
      description: Refused for the super admin, for whom TOTP is mandatory. Requires the current password.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
            example: { currentPassword: a-long-passphrase-of-at-least-12-characters }
      responses:
        '204': { description: TOTP disabled. }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me/totp/confirm:
    post:
      tags: [Admin auth]
      operationId: confirmTotpEnrollment
      summary: Confirm TOTP enrollment
      description: |
        Confirms the pending secret with a valid code. Returns single-use recovery codes, shown
        once. When called from a pre-auth session (first-run setup or mandatory enrollment), the
        session becomes fully authenticated.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
            example: { code: '204816' }
      responses:
        '200':
          description: TOTP enabled.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpConfirmed' }
              example:
                recoveryCodes: [rc-7KQ2-9XLM-4PZD, rc-2HDF-8WQA-1MNB, rc-5TRE-3ZXC-0LKJ, rc-8YUI-6OPA-2SDF, rc-4GHJ-1KLZ-7XCV, rc-9BNM-5QWE-3RTY, rc-0UIO-2PAS-8DFG, rc-6HJK-4LZX-1CVB]
                csrfToken: csrf_Zx98Yw76Vu54Ts32
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Admin - tenants
  # ---------------------------------------------------------------------------
  /admin/tenants:
    get:
      tags: [Admin tenants]
      operationId: listTenants
      summary: List tenants visible to the admin
      description: Super admin sees all tenants; a delegated admin sees only assigned tenants.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantList' }
              example:
                items:
                  - id: ten_01JAB00000000000000ENT1TYA
                    name: Entity A
                    fqdn: transfer.entity-a.example.com
                    defaultLanguage: fr
                    maxTransferBytes: 21474836480
                    storageQuotaBytes: 1099511627776
                    storageUsedBytes: 274877906944
                    createdAt: '2026-09-01T08:00:00Z'
                    updatedAt: '2026-10-01T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin tenants]
      operationId: createTenant
      summary: Create a tenant (super admin)
      description: "Creates a tenant with its FQDN, default language and storage quota. Default branding, email templates and legal texts are provisioned. Reserved to the super admin."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
            example:
              name: Entity B
              fqdn: transfer.entity-b.example.com
              defaultLanguage: en
              storageQuotaBytes: 549755813888
              maxTransferBytes: 10737418240
      responses:
        '201':
          description: Tenant created (with default branding, templates and legal texts).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
              example:
                id: ten_01JAB00000000000000ENT1TYB
                name: Entity B
                fqdn: transfer.entity-b.example.com
                defaultLanguage: en
                maxTransferBytes: 10737418240
                storageQuotaBytes: 549755813888
                storageUsedBytes: 0
                createdAt: '2026-10-19T16:00:00Z'
                updatedAt: '2026-10-19T16:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getTenant
      summary: Tenant general settings
      description: "Returns the general settings of a tenant within the admin scope, including quota usage."
      security:
        - adminSession: []
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
              example:
                id: ten_01JAB00000000000000ENT1TYA
                name: Entity A
                fqdn: transfer.entity-a.example.com
                defaultLanguage: fr
                maxTransferBytes: 21474836480
                storageQuotaBytes: 1099511627776
                storageUsedBytes: 274877906944
                createdAt: '2026-09-01T08:00:00Z'
                updatedAt: '2026-10-01T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin tenants]
      operationId: updateTenant
      summary: Update tenant general settings
      description: |
        `fqdn` and `storageQuotaBytes` can only be changed by the super admin. A delegated admin
        may only lower `maxTransferBytes`, never above 20 GiB nor above the value set by the super admin.
        JSON Merge Patch semantics (RFC 7396).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TenantUpdate' }
            example: { defaultLanguage: en, maxTransferBytes: 5368709120 }
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
              example:
                id: ten_01JAB00000000000000ENT1TYA
                name: Entity A
                fqdn: transfer.entity-a.example.com
                defaultLanguage: en
                maxTransferBytes: 5368709120
                storageQuotaBytes: 1099511627776
                storageUsedBytes: 274877906944
                createdAt: '2026-09-01T08:00:00Z'
                updatedAt: '2026-10-19T16:05:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin tenants]
      operationId: deleteTenant
      summary: Delete a tenant and all its data (super admin)
      description: |
        Irreversible. Deletes every transfer (with crypto-erase), verified address, invitation,
        token, template and configuration of the tenant. Audit and security log entries are kept
        until their 12-month retention expires. The tenant name must be repeated as confirmation.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - name: confirm
          in: query
          required: true
          description: Exact tenant name.
          schema: { type: string }
          example: Entity B
      responses:
        '202': { description: Deletion scheduled. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/branding:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getBranding
      summary: Branding (colours, images)
      description: "Returns the colours of the tenant, whether custom images are configured, and the RGAA contrast diagnostics of the colours."
      security:
        - adminSession: []
      responses:
        '200':
          description: Branding with RGAA contrast diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branding' }
              example:
                primaryColor: '#0B5FFF'
                accentColor: '#00875A'
                hasLogo: true
                hasBackground: false
                contrast:
                  - { pair: primary-on-light, ratio: 5.1, level: AA }
                  - { pair: accent-on-light, ratio: 4.6, level: AA }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateBranding
      summary: Update colours
      description: |
        Colours are always saved; the response contains contrast diagnostics (`level: fail` when
        below RGAA/WCAG AA 4.5:1) so that the UI can warn the admin. The `contrast` array is
        designed to also cover the V1.1 dark theme (pairs `*-on-dark`).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandingUpdate' }
            example: { primaryColor: '#7FB3FF', accentColor: '#00875A' }
      responses:
        '200':
          description: Saved, with diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branding' }
              example:
                primaryColor: '#7FB3FF'
                accentColor: '#00875A'
                hasLogo: true
                hasBackground: false
                contrast:
                  - { pair: primary-on-light, ratio: 2.2, level: fail }
                  - { pair: accent-on-light, ratio: 4.6, level: AA }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/branding/{asset}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: asset
        in: path
        description: "Which image: `logo` or `background`."
        required: true
        schema: { type: string, enum: [logo, background] }
        example: background
    put:
      tags: [Admin tenants]
      operationId: uploadBrandingAsset
      summary: Upload logo or background image
      description: |
        PNG, JPEG or WebP only (detected from content, not from the declared type), 5 MiB max for
        a logo and 10 MiB for a background. Images are decoded and re-encoded server side to strip
        metadata and active content. SVG is refused.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary, description: "PNG, JPEG or WebP; the format is detected from the content." }
            example: "<binary data>"
      responses:
        '204': { description: Image stored. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin tenants]
      operationId: deleteBrandingAsset
      summary: Revert to the default image
      description: "Removes the custom logo or background image; the default image is served again."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Image removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/network:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getNetworkRules
      summary: Internal IP ranges and email domains
      description: "Returns the internal IP ranges and internal email domains that define an internal user of the tenant."
      security:
        - adminSession: []
      responses:
        '200':
          description: Rules defining internal users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkRules' }
              example:
                internalCidrs: [10.10.0.0/16, 192.0.2.0/24, '2001:db8:10::/48']
                internalDomains: [entity-a.example.com, corp.entity-a.example.com]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateNetworkRules
      summary: Replace internal IP ranges and email domains
      description: "Replaces the internal IP ranges (IPv4 or IPv6 CIDR) and internal email domains of the tenant. Values are validated and normalised; the change is audited."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkRules' }
            example:
              internalCidrs: [10.10.0.0/16]
              internalDomains: [entity-a.example.com]
      responses:
        '200':
          description: Saved rules (normalised).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkRules' }
              example:
                internalCidrs: [10.10.0.0/16]
                internalDomains: [entity-a.example.com]
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/smtp:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getSmtpSettings
      summary: SMTP settings
      description: The password is never returned; `passwordSet` tells whether one is stored.
      security:
        - adminSession: []
      responses:
        '200':
          description: SMTP settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmtpSettings' }
              example:
                host: smtp-relay
                port: 25
                security: none
                username: null
                passwordSet: false
                fromAddress: no-reply@entity-a.example.com
                fromName: Entity A Transfer
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateSmtpSettings
      summary: Replace SMTP settings
      description: |
        Authentication is optional (unauthenticated relay on the internal Docker network is
        supported). Omit `password` to keep the stored one; set `removePassword` to remove it. The
        password is encrypted at rest with the master key.

        To prevent a stored password from being sent to another server, `password` (or
        `removePassword`) is mandatory whenever `host`, `port` or `username` differs from the stored
        settings; otherwise the request is refused with `400 validation-failed`. Sending both
        `password` and `removePassword` is also refused.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmtpSettingsUpdate' }
            examples:
              relay:
                summary: Unauthenticated internal relay
                value: { host: smtp-relay, port: 25, security: none, fromAddress: no-reply@entity-a.example.com, fromName: Entity A Transfer }
              submission:
                summary: Authenticated submission with STARTTLS
                value: { host: smtp.example.com, port: 587, security: starttls, username: transfer@entity-a.example.com, password: s3cr3t-app-password, fromAddress: transfer@entity-a.example.com }
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmtpSettings' }
              example:
                host: smtp.example.com
                port: 587
                security: starttls
                username: transfer@entity-a.example.com
                passwordSet: true
                fromAddress: transfer@entity-a.example.com
                fromName: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/smtp/test:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Admin tenants]
      operationId: testSmtp
      summary: Send a test email
      description: "Sends a test email through the tenant SMTP settings and reports the result of the SMTP dialogue. Rate limited."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmtpTest' }
            example: { to: admin@entity-a.example.com }
      responses:
        '200':
          description: Result of the SMTP dialogue (the email may still be filtered downstream).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmtpTestResult' }
              examples:
                ok: { value: { success: true, durationMs: 412 } }
                ko: { value: { success: false, durationMs: 5003, error: 'dial tcp: i/o timeout' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/smtp/dns-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: checkMailDns
      summary: Indicative SPF, DKIM and DMARC check of the sender domain
      description: Informational only; DKIM selectors to probe can be given since they cannot be discovered.
      security:
        - adminSession: []
      parameters:
        - name: dkimSelector
          in: query
          description: "DKIM selectors to probe (they cannot be discovered from DNS)."
          required: false
          schema: { type: array, items: { type: string, maxLength: 63 }, maxItems: 5 }
          example: [selector1, selector2]
      responses:
        '200':
          description: DNS diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDnsCheck' }
              example:
                domain: entity-a.example.com
                spf: { status: ok, record: 'v=spf1 include:spf.protection.example.net -all' }
                dkim: { status: ok, selectors: [{ selector: selector1, found: true }] }
                dmarc: { status: warning, record: 'v=DMARC1; p=none', message: Policy is p=none. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/email-templates:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: listEmailTemplates
      summary: List email templates and whether they are customised
      description: "Lists every email template key and language, and whether the tenant customised it."
      security:
        - adminSession: []
      responses:
        '200':
          description: Templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmailTemplateSummary' }
              example:
                - { key: verification-code, language: fr, customised: false }
                - { key: transfer-notification, language: fr, customised: true, updatedAt: '2026-10-02T10:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/email-templates/{templateKey}/{language}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/TemplateKey'
      - $ref: '#/components/parameters/LanguagePath'
    get:
      tags: [Admin tenants]
      operationId: getEmailTemplate
      summary: Get a template (customised or default)
      description: "Returns the customised template, or the default one, with the variables available for this template."
      security:
        - adminSession: []
      responses:
        '200':
          description: Template source and available variables.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
              example:
                key: transfer-notification
                language: en
                customised: false
                subject: '{{.SenderEmail}} sent you files'
                bodyHtml: '<p>{{.SenderEmail}} sent you {{.FileCount}} file(s).</p><p><a href="{{.DownloadURL}}">Download</a></p>'
                bodyText: "{{.SenderEmail}} sent you {{.FileCount}} file(s).\n{{.DownloadURL}}"
                variables: [SenderEmail, Message, FileCount, Files, DownloadURL, ExpiresAt, PasswordProtected, TenantName]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateEmailTemplate
      summary: Customise a template
      description: |
        Templates use a restricted, auto-escaping template language: only the documented
        variables are available, no function call can reach the file system or the network.
        Invalid templates are refused with `400`.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateUpdate' }
            example:
              subject: 'Files from {{.SenderEmail}}'
              bodyHtml: '<p>Hello,</p><p>{{.SenderEmail}} sent you files.</p><p><a href="{{.DownloadURL}}">Download</a></p>'
              bodyText: "Hello,\n{{.SenderEmail}} sent you files.\n{{.DownloadURL}}"
      responses:
        '200':
          description: Saved template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
              example:
                key: transfer-notification
                language: en
                customised: true
                subject: 'Files from {{.SenderEmail}}'
                bodyHtml: '<p>Hello,</p><p>{{.SenderEmail}} sent you files.</p><p><a href="{{.DownloadURL}}">Download</a></p>'
                bodyText: "Hello,\n{{.SenderEmail}} sent you files.\n{{.DownloadURL}}"
                variables: [SenderEmail, Message, FileCount, Files, DownloadURL, ExpiresAt, PasswordProtected, TenantName]
                updatedAt: '2026-10-19T16:10:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin tenants]
      operationId: resetEmailTemplate
      summary: Revert to the default template
      description: "Deletes the tenant customisation of a template; the default template is used again."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Customisation removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

