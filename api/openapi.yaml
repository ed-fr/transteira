      summary: List invitations with their issuer
      description: "Lists the invitations of the tenant, most recent first, with their issuer and status. After a GDPR erasure of the issuer, its invitations are revoked and `invitedBy` holds the pseudonym `erased-<16 hex>` instead of the address."
      security:
