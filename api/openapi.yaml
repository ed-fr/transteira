        - name: period
          in: query
          description: "Statistics period: last 7 days, 30 days or 12 months."
          schema: { type: string, enum: [7d, 30d, 12m], default: 30d }
          example: 30d
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantStats' }
              example:
                period: 30d
                transferCount: 412
                bytesUploaded: 1932735283200
                downloadCount: 1287
                bytesDownloaded: 4123168604160
                virusDetections: 2
                storageUsedBytes: 274877906944
                storageQuotaBytes: 1099511627776
                storageUsedRatio: 0.25
                series:
                  - { date: '2026-10-18', transfers: 17, bytesUploaded: 64424509440 }
                  - { date: '2026-10-19', transfers: 9, bytesUploaded: 32212254720 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/data-subjects/search:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Admin operations]
      operationId: searchDataSubject
      summary: GDPR - find all data linked to an email address
      description: POST is used so that the address does not appear in URLs and proxy logs.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubjectRequest' }
            example: { email: carol@customer.example.net }
      responses:
        '200':
          description: Summary of the data held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectSummary' }
              example:
                email: carol@customer.example.net
                verifiedAddress: false
                transfersAsSender: 0
                transfersAsRecipient: 3
                invitations: 0
                auditEvents: 7
                securityEvents: 0
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/data-subjects/erase:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Admin operations]
      operationId: eraseDataSubject
      summary: GDPR - erase all data linked to an email address
      description: |
        Deletes transfers sent by the address (with crypto-erase), removes the address from
        recipient lists (a transfer left without recipient is deleted), deletes its verified
        address record, verification codes and invitations, and pseudonymises it in audit and
        security log entries. The erase itself is audited without the address in clear.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubjectRequest' }
            example: { email: carol@customer.example.net }
      responses:
        '200':
          description: Erasure report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectEraseReport' }
              example:
                transfersDeleted: 0
                recipientEntriesRemoved: 3
                verifiedAddressDeleted: false
                invitationsDeleted: 0
                logEntriesPseudonymised: 7
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Admin - system (super admin)
  # ---------------------------------------------------------------------------
  /admin/admins:
    get:
      tags: [Admin system]
      operationId: listAdmins
      summary: List admin accounts (super admin)
      description: "Lists every admin account with role, tenant assignments and TOTP status. Reserved to the super admin."
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Admins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminList' }
              example:
                items:
                  - id: adm_01JABCG1H2J3K415M6N7P8Q9R0
                    username: admin.entity-a
                    email: admin@entity-a.example.com
                    role: delegated_admin
                    tenantIds: [ten_01JAB00000000000000ENT1TYA]
                    totpEnabled: true
                    disabled: false
                    lastLoginAt: '2026-10-19T08:30:00Z'
                    createdAt: '2026-09-01T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin system]
      operationId: createAdmin
      summary: Create a delegated admin (super admin)
      description: |
        The account is created with a one-time activation link sent by email (through the SMTP
        of the first assigned tenant); the admin chooses a password and enrolls TOTP on first login.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreate' }
            example:
              username: admin.entity-b
              email: admin@entity-b.example.com
              role: delegated_admin
              tenantIds: [ten_01JAB00000000000000ENT1TYB]
              requireTotp: true
      responses:
        '201':
          description: Admin created; activation email sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Admin' }
              example:
                id: adm_01JABC17P8Q9R0S1T2V3V4W5X6
                username: admin.entity-b
                email: admin@entity-b.example.com
                role: delegated_admin
                tenantIds: [ten_01JAB00000000000000ENT1TYB]
                totpEnabled: false
                requireTotp: true
                disabled: false
                lastLoginAt: null
                createdAt: '2026-10-19T16:25:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/admins/{adminId}:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    get:
      tags: [Admin system]
      operationId: getAdmin
      summary: Get an admin account (super admin)
      description: "Returns one admin account. Reserved to the super admin."
      security:
        - adminSession: []
      responses:
        '200':
          description: Admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Admin' }
              example:
                id: adm_01JABCG1H2J3K415M6N7P8Q9R0
                username: admin.entity-a
                email: admin@entity-a.example.com
                role: delegated_admin
                tenantIds: [ten_01JAB00000000000000ENT1TYA]
                totpEnabled: true
                requireTotp: true
                disabled: false
                lastLoginAt: '2026-10-19T08:30:00Z'
                createdAt: '2026-09-01T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin system]
      operationId: updateAdmin
      summary: Update assignments, TOTP requirement or disable an account (super admin)
      description: Disabling an account or changing its assignments revokes its sessions.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/AdminUpdate' }
            example: { tenantIds: [ten_01JAB00000000000000ENT1TYA, ten_01JAB00000000000000ENT1TYB] }
      responses:
        '200':
          description: Updated admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Admin' }
              example:
                id: adm_01JABCG1H2J3K415M6N7P8Q9R0
                username: admin.entity-a
                email: admin@entity-a.example.com
                role: delegated_admin
                tenantIds: [ten_01JAB00000000000000ENT1TYA, ten_01JAB00000000000000ENT1TYB]
                totpEnabled: true
                requireTotp: true
                disabled: false
                lastLoginAt: '2026-10-19T08:30:00Z'
                createdAt: '2026-09-01T08:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin system]
      operationId: deleteAdmin
      summary: Delete an admin account (super admin)
      description: The last super admin cannot be deleted.
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Admin deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/admins/{adminId}/reset-credentials:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    post:
      tags: [Admin system]
      operationId: resetAdminCredentials
      summary: Reset password and TOTP of an admin (super admin)
      description: Revokes sessions, clears TOTP and recovery codes, and sends a new activation link.
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '202': { description: Reset done; activation email queued. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/activation:
    post:
      tags: [Admin auth]
      operationId: activateAdmin
      summary: Activate an admin account from the emailed link
      description: Sets the password; the resulting pre-auth session must then enroll TOTP if required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationRequest' }
            example: { activationToken: act_Lm3Qz8Xv1Bn6Kd0R4Tp7Yw2H, password: a-long-passphrase-of-at-least-12-characters }
      responses:
        '200':
          description: Account activated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginState' }
              example: { status: totp_enrollment_required, csrfToken: csrf_Ab12Cd34Ef56Gh78 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/stats:
    get:
      tags: [Admin system]
      operationId: getGlobalStats
      summary: Global dashboard (super admin)
      description: "Returns the disk usage of the instance and the statistics of every tenant. Reserved to the super admin."
      security:
        - adminSession: []
      parameters:
        - name: period
          in: query
          description: "Statistics period: last 7 days, 30 days or 12 months."
          schema: { type: string, enum: [7d, 30d, 12m], default: 30d }
          example: 30d
      responses:
        '200':
          description: Global and per-tenant statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalStats' }
              example:
                period: 30d
                disk: { totalBytes: 4398046511104, usedBytes: 1319413953331, usedRatio: 0.30, alertThreshold: 0.85 }
                tenants:
                  - tenantId: ten_01JAB00000000000000ENT1TYA
                    name: Entity A
                    transferCount: 412
                    bytesUploaded: 1932735283200
                    storageUsedBytes: 274877906944
                    storageQuotaBytes: 1099511627776
                    storageUsedRatio: 0.25
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/settings:
    get:
      tags: [Admin system]
      operationId: getSystemSettings
      summary: Instance settings editable at runtime (super admin)
      description: "Returns the instance settings that can be changed at runtime, such as the disk alert threshold. Reserved to the super admin."
      security:
        - adminSession: []
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
              example: { diskAlertThreshold: 0.85, alertEmail: it-admin@example.com }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin system]
      operationId: updateSystemSettings
      summary: Update instance settings (super admin)
      description: "Updates the instance settings that can be changed at runtime. JSON Merge Patch semantics; audited. Reserved to the super admin."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SystemSettings' }
            example: { diskAlertThreshold: 0.9 }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
              example: { diskAlertThreshold: 0.9, alertEmail: it-admin@example.com }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/maintenance:
    get:
      tags: [Admin system]
      operationId: getMaintenance
      summary: Maintenance mode state
      description: "Returns whether maintenance mode is enabled, by whom (environment or admin) and the displayed messages."
      security:
        - adminSession: []
      responses:
        '200':
          description: Maintenance state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
              example: { enabled: false, source: none }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin system]
      operationId: setMaintenance
      summary: Enable or disable maintenance mode (super admin)
      description: |
        When enabled, new deposits, invitations and uploads are refused with `503`; downloads,
        the health check and the admin space remain available. When forced by `TT_MAINTENANCE=true`,
        it cannot be disabled from the API (`409`).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceUpdate' }
            example: { enabled: true, message: { fr: "Mise à jour en cours, retour vers 20 h.", en: "Upgrade in progress, back around 8 pm." } }
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
              example: { enabled: true, source: admin, since: '2026-10-19T18:00:00Z', message: { fr: "Mise à jour en cours, retour vers 20 h.", en: "Upgrade in progress, back around 8 pm." } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/master-key/rotations:
    post:
      tags: [Admin system]
      operationId: startMasterKeyRotation
      summary: Start a master key rotation (super admin)
      description: |
        Re-wraps every per-file key (and every encrypted secret such as SMTP passwords) with the
        new master key provided through `TT_MASTER_KEY_NEW_FILE`. File contents are neither read
        nor rewritten. The operation is resumable after an interruption and audited. Equivalent
        to the `transteira rotate-master-key` command. Requires TOTP re-confirmation.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
            example: { code: '204816' }
      responses:
        '202':
          description: Rotation started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotation' }
              example:
                id: rot_01JABCM8Q9R0S1T2V3V4W5X6Y7
                status: running
                fromKeyId: mk_3f9a0c41d27be865
                toKeyId: mk_b81e2d07c4a95f13
                totalKeys: 18342
                rewrappedKeys: 0
                startedAt: '2026-10-19T16:30:00Z'
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A rotation is already running, or no new master key is configured.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#new-master-key-missing
                title: New master key not configured
                status: 409
                code: new-master-key-missing
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/master-key/rotations/{rotationId}:
    get:
      tags: [Admin system]
      operationId: getMasterKeyRotation
      summary: Progress of a master key rotation
      description: "Returns the progress of a master key rotation. Reserved to the super admin."
      security:
        - adminSession: []
      parameters:
        - name: rotationId
          in: path
          description: "Master key rotation identifier."
          required: true
          schema: { type: string, pattern: '^rot_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
          example: rot_01JABCM8Q9R0S1T2V3V4W5X6Y7
      responses:
        '200':
          description: Rotation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotation' }
              example:
                id: rot_01JABCM8Q9R0S1T2V3V4W5X6Y7
                status: completed
                fromKeyId: mk_3f9a0c41d27be865
                toKeyId: mk_b81e2d07c4a95f13
                totalKeys: 18342
                rewrappedKeys: 18342
                startedAt: '2026-10-19T16:30:00Z'
                completedAt: '2026-10-19T16:31:12Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/audit-events:
    get:
      tags: [Admin system]
      operationId: listGlobalAuditEvents
      summary: Instance-wide audit log (super admin)
      description: All tenants plus events without tenant (setup, admin management, maintenance, key rotation).
      security:
        - adminSession: []
      parameters:
        - name: tenantId
          in: query
          description: "Filter by tenant."
          schema: { type: string, pattern: '^ten_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
          example: ten_01JAB00000000000000ENT1TYA
        - name: action
          in: query
          description: "Filter by audit action."
          schema: { $ref: '#/components/schemas/AuditAction' }
          example: maintenance.enabled
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventList' }
              example:
                items:
                  - id: aud_01JABCN9R0S1T2V3V4W5X6Y7Z8
                    occurredAt: '2026-10-19T18:00:00Z'
                    tenantId: null
                    actor: { kind: admin, id: superadmin }
                    ip: 10.10.1.5
                    action: maintenance.enabled
                    object: { kind: system, id: maintenance }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    depositSession:
      type: apiKey
      in: cookie
      name: __Host-tt_deposit
      description: Opaque session identifier set after email verification. Bound to one tenant and one address. Lifetime `TT_DEPOSIT_SESSION_TTL` (4 h by default).
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-tt_admin
      description: Opaque admin session identifier (server-side session). Rotated after each authentication step. Idle timeout 30 min, absolute timeout 12 h by default.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token returned in the session payloads (`csrfToken`). Mandatory with cookie authentication on unsafe methods.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: tt_<random>
      description: Per-tenant API token created by an admin. Only valid on the host of its tenant.
    downloadGrant:
      type: apiKey
      in: cookie
      name: __Host-tt_dl
      description: Set after unlocking a password-protected transfer; lists the unlocked links for this browser. Lifetime 1 h.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: "Preferred languages of the client (RFC 9110); falls back to the tenant default language."
      required: false
      schema: { type: string }
      example: fr-FR,fr;q=0.9,en;q=0.8
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional key making retries of transfer creation safe (24 h retention).
      schema: { type: string, maxLength: 64 }
      example: 5f0c6c1e-8b7a-4a8e-9f0d-2c3b4a5d6e7f
    TusResumableHeader:
      name: Tus-Resumable
      in: header
      description: "tus protocol version used by the client."
      required: true
      schema: { type: string, enum: ['1.0.0'] }
      example: 1.0.0
    ChallengeId:
      name: challengeId
      in: path
      description: "Verification challenge identifier returned by `startDepositSession`."
      required: true
      schema: { type: string, pattern: '^vch_[A-Za-z0-9]{22,43}$' }
      example: vch_4Fq9Lm2Zx8Rt6Yb1Kd7Pw3
    TransferId:
      name: transferId
      in: path
      description: "Transfer identifier."
      required: true
      schema: { type: string, pattern: '^trf_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
    FileId:
      name: fileId
      in: path
      description: "File identifier within the transfer."
      required: true
      schema: { type: string, pattern: '^fil_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: fil_01JABCD9F1A2B3C4D5E6F7G8H9
    UploadId:
      name: uploadId
      in: path
      description: "tus upload identifier, part of the `uploadUrl` returned at transfer creation."
      required: true
      schema: { type: string, pattern: '^upl_[A-Za-z0-9]{22,43}$' }
      example: upl_7Hq2Wm9Zx4Lp1Vb8Rt3Yk6Nd
    LinkToken:
      name: linkToken
      in: path
      required: true
      description: Unguessable download token (at least 128 bits of entropy). Unknown and foreign-tenant tokens give the same `404`.
      schema: { type: string, pattern: '^dl_[A-Za-z0-9]{22,43}$' }
      example: dl_Xk4Lm9Qp2Zr7Vb1Nt6Yc3Hd8Jf
    InvitationToken:
      name: invitationToken
      in: path
      description: "Unguessable invitation token from the invitation link."
      required: true
      schema: { type: string, pattern: '^inv_[A-Za-z0-9]{22,43}$' }
      example: inv_9sK2mQ7xL0aZ4vR8tYb3nC6dE1fG5hJ
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Tenant identifier. A tenant outside the admin's scope gives `404` (never `403`) to avoid disclosing its existence.
      schema: { type: string, pattern: '^ten_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: ten_01JAB00000000000000ENT1TYA
    AdminId:
      name: adminId
      in: path
      description: "Admin account identifier."
      required: true
      schema: { type: string, pattern: '^adm_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: adm_01JABCG1H2J3K415M6N7P8Q9R0
    TemplateKey:
      name: templateKey
      in: path
      description: "Email template key."
      required: true
      schema: { $ref: '#/components/schemas/EmailTemplateKey' }
      example: transfer-notification
    LanguagePath:
      name: language
      in: path
      description: "Language of the template or text."
      required: true
      schema: { $ref: '#/components/schemas/Language' }
      example: fr
    LegalDocumentPath:
      name: document
      in: path
      description: "Legal document: legal notice or privacy policy."
      required: true
      schema: { type: string, enum: [legal-notice, privacy-policy] }
      example: privacy-policy
    Limit:
      name: limit
      in: query
      description: "Maximum number of items per page."
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      example: 50
    Cursor:
      name: cursor
      in: query
      description: "Opaque cursor returned as `nextCursor` by the previous page."
      required: false
      schema: { type: string, maxLength: 512 }
      example: eyJjIjoiMjAyNi0xMC0xOVQxNjowMDowMFoiLCJpIjoidHJmXzAxIn0

  headers:
    ContentLanguage:
      schema: { type: string }
      example: fr
    ETag:
      schema: { type: string }
      example: '"a1b2c3d4"'
    RetryAfter:
      description: Seconds before retrying.
      schema: { type: integer }
      example: 900
    TusResumable:
      schema: { type: string }
      example: 1.0.0
    UploadOffset:
      schema: { type: integer }
      example: 1048576
    UploadExpires:
      description: RFC 9110 date after which an unfinished upload is purged.
      schema: { type: string }
      example: Tue, 20 Oct 2026 16:00:00 GMT
    ContentLength:
      schema: { type: integer }
      example: 15728640
    NoSniff:
      schema: { type: string, enum: [nosniff] }
      example: nosniff
    ContentDispositionAttachment:
      schema: { type: string }
      example: attachment; filename="plans-v3.pdf"; filename*=UTF-8''plans-v3.pdf
    SetDepositCookie:
      schema: { type: string }
      example: __Host-tt_deposit=ds_Qm2Zx8...; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=14400
    SetAdminCookie:
      schema: { type: string }
      example: __Host-tt_admin=as_Hx7Lp1...; Path=/; Secure; HttpOnly; SameSite=Strict
    SetDownloadGrantCookie:
      schema: { type: string }
      example: __Host-tt_dl=dg_Vb4Nt9...; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=3600

  responses:
    ValidationFailed:
      description: The request is malformed or a field is invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#validation-failed
            title: Invalid request
            status: 400
            code: validation-failed
            errors:
              - { field: 'recipients[0]', code: invalid-email }
              - { field: expiryDays, code: not-allowed, allowed: [1, 7, 30] }
    Unauthenticated:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unauthenticated
            title: Authentication required
            status: 401
            code: unauthenticated
    InvalidCredentials:
      description: Wrong username/password, TOTP code, or API token. Written to the security log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invalid-credentials
            title: Invalid credentials
            status: 401
            code: invalid-credentials
    Forbidden:
      description: Authenticated but not allowed (role).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#forbidden
            title: Forbidden
            status: 403
            code: forbidden
    CsrfInvalid:
      description: Missing or invalid CSRF token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
            title: Invalid CSRF token
            status: 403
            code: csrf-invalid
    DepositForbidden:
      description: |
        Deposit not allowed. For public deposits the code is always the generic
        `deposit-not-allowed`, whatever the reason (client outside internal IP ranges, email domain
        not internal, address or domain blocklisted), so that the response does not reveal which
        check failed; the precise reason is written to the security log. Other codes:
        `ip-not-allowed` (API token used outside its `allowedCidrs`, visible to the token owner only)
        and `invitation-not-allowed` (external depositor trying to invite).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            depositNotAllowed:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#deposit-not-allowed
                title: Deposit not allowed
                status: 403
                code: deposit-not-allowed
                detail: Deposits are only possible from the internal network with an internal address, or with an invitation.
            ipNotAllowed:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#ip-not-allowed
                title: Address not allowed for this token
                status: 403
                code: ip-not-allowed
            invitationNotAllowed:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invitation-not-allowed
                title: Invitations are reserved to internal users
                status: 403
                code: invitation-not-allowed
    InvitationGone:
      description: Invitation expired, revoked or already used.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invitation-gone
            title: Invitation no longer valid
            status: 410
            code: invitation-gone
    NotFound:
      description: Resource not found (or outside the caller's tenant / scope).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#not-found
            title: Not found
            status: 404
            code: not-found
    TransferGone:
      description: Transfer expired or deleted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-gone
            title: Transfer no longer available
            status: 410
            code: transfer-gone
    DownloadLocked:
      description: The transfer is password protected and not unlocked for this browser.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#download-locked
            title: Password required
            status: 401
            code: download-locked
    StateConflict:
      description: The operation is not allowed in the current state of the resource.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
            title: Operation not allowed in the current state
            status: 409
            code: state-conflict
    AlreadyExists:
      description: A resource with the same unique key already exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#already-exists
            title: Already exists
            status: 409
            code: already-exists
            detail: The FQDN transfer.entity-b.example.com is already used.
    TransferTooLarge:
      description: Declared total size exceeds the tenant per-transfer limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-too-large
            title: Transfer too large
            status: 413
            code: transfer-too-large
            maxTransferBytes: 21474836480
    PayloadTooLarge:
      description: Request body too large.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#payload-too-large
            title: Payload too large
            status: 413
            code: payload-too-large
    UnsupportedMediaType:
      description: Unsupported content type.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unsupported-media-type
            title: Unsupported media type
            status: 415
            code: unsupported-media-type
    QuotaExceeded:
      description: The tenant storage quota is reached; new deposits are blocked until space is freed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#quota-exceeded
            title: Storage quota reached
            status: 507
            code: quota-exceeded
            detail: The storage space of this service is full. Please try again later.
    RateLimited:
      description: Too many requests. Written to the security log.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#rate-limited
            title: Too many requests
            status: 429
            code: rate-limited
            retryAfterSeconds: 1800
    MaintenanceMode:
      description: Maintenance mode; deposits are temporarily refused.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#maintenance
            title: Maintenance in progress
            status: 503
            code: maintenance
            detail: Upgrade in progress, back around 8 pm.
    InternalError:
      description: Unexpected server error. The response never contains internal details; the `instance` identifier allows correlation with the server logs.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#internal-error
            title: Internal error
            status: 500
            code: internal-error
            instance: req_01JABCP0S1T2V3V4W5X6Y7Z8A9
    UnknownTenant:
      description: The `Host` header does not match any tenant. Written to the security log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unknown-tenant
            title: Unknown host
            status: 421
            code: unknown-tenant

  schemas:
    # --- Common -----------------------------------------------------------
    Problem:
      type: object
      description: RFC 9457 Problem Details with TransTeira extension members.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, description: Documentation URL of the problem type. }
        title: { type: string, description: Short localised summary. }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Localised human-readable explanation. }
        instance: { type: string, description: Request identifier (also in the `X-Request-Id` header and in logs). }
        code: { $ref: '#/components/schemas/ProblemCode' }
        errors:
          type: array
          description: Field-level validation errors (`validation-failed` only).
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              allowed: { type: array, items: {} }
        attemptsRemaining: { type: integer, minimum: 0 }
        retryAfterSeconds: { type: integer, minimum: 0 }
        maxTransferBytes: { type: integer, format: int64 }
        files: { type: array, items: { type: string } }
      additionalProperties: false
    ProblemCode:
      type: string
      x-extensible-enum: true
      description: Stable error code. See `docs/api/errors.md`.
      enum:
        - validation-failed
        - unauthenticated
        - invalid-credentials
        - forbidden
        - csrf-invalid
        - deposit-not-allowed
        - ip-not-allowed
        - blocked-file
        - invitation-not-allowed
        - invitation-gone
        - verification-code-invalid
        - verification-exhausted
        - not-found
        - method-not-allowed
        - transfer-gone
        - download-locked
        - transfer-password-invalid
        - transfer-locked
        - state-conflict
        - already-exists
        - upload-incomplete
        - checksum-mismatch
        - transfer-too-large
        - payload-too-large
        - unsupported-media-type
        - quota-exceeded
        - rate-limited
        - maintenance
        - unknown-tenant
        - setup-already-done
        - setup-token-invalid
        - new-master-key-missing
        - internal-error
    Language:
      type: string
      x-extensible-enum: true
      description: Supported UI language (ISO 639-1). New languages may be added.
      enum: [fr, en]
    Email:
      type: string
      format: email
      maxLength: 254
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    ByteSize:
      type: integer
      format: int64
      minimum: 0
    PageCursor:
      type: string
      description: Opaque cursor for the next page; absent on the last page.

    # --- Meta -------------------------------------------------------------
    Health:
      type: object
      required: [status, version, maintenance, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        maintenance: { type: boolean }
        checks:
          type: object
          required: [database, antivirus, storage]
          properties:
            database: { $ref: '#/components/schemas/ComponentHealth' }
            antivirus: { $ref: '#/components/schemas/ComponentHealth' }
            storage: { $ref: '#/components/schemas/ComponentHealth' }
    ComponentHealth:
      type: string
      enum: [ok, unavailable]
    VersionInfo:
      type: object
      required: [version, apiVersion]
      properties:
        version: { type: string, description: SemVer of the application. }
        apiVersion: { type: string, enum: [v1] }
        commit: { type: string }
    PublicTenant:
      type: object
      required: [name, language, availableLanguages, branding, limits, maintenance, legalDocuments]
      properties:
        name: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        availableLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        branding:
          type: object
          required: [primaryColor, accentColor, logoUrl, backgroundUrl]
          properties:
            primaryColor: { $ref: '#/components/schemas/HexColor' }
            accentColor: { $ref: '#/components/schemas/HexColor' }
            logoUrl: { type: string }
            backgroundUrl: { type: string }
        limits:
          type: object
          required: [maxTransferBytes, expiryDays]
          properties:
            maxTransferBytes: { $ref: '#/components/schemas/ByteSize' }
            expiryDays: { type: array, items: { $ref: '#/components/schemas/ExpiryDays' } }
        maintenance: { type: boolean }
        maintenanceMessage: { type: string }
        legalDocuments: { type: array, items: { type: string, enum: [legal-notice, privacy-policy] } }
    LegalDocument:
      type: object
      required: [document, language, markdown]
      properties:
        document: { type: string, enum: [legal-notice, privacy-policy] }
        language: { $ref: '#/components/schemas/Language' }
        markdown: { type: string, maxLength: 100000 }
        updatedAt: { type: string, format: date-time }
    LegalDocumentUpdate:
      type: object
      required: [markdown]
      properties:
        markdown: { type: string, maxLength: 100000 }
      additionalProperties: false

    # --- Deposit sessions -------------------------------------------------
    DepositSessionStart:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        invitationToken: { type: string, pattern: '^inv_[A-Za-z0-9]{22,43}$' }
      additionalProperties: false
    VerificationChallenge:
      type: object
      required: [challengeId, email, expiresAt, attemptsRemaining]
      properties:
        challengeId: { type: string }
        email: { $ref: '#/components/schemas/Email' }
        expiresAt: { type: string, format: date-time }
        attemptsRemaining: { type: integer, minimum: 0, maximum: 2 }
    VerificationCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
      additionalProperties: false
    DepositorKind:
      type: string
      x-extensible-enum: true
      description: |
        `internal`: internal IP and domain. `external`: invited external.
        Reserved for V1.1: `internal_remote` (verified internal depositing from outside),
        `reply` (recipient replying to a transfer). Reserved for V2: `drop_link`.
      enum: [internal, external]
    DepositSession:
      type: object
      required: [email, kind, csrfToken, expiresAt, limits, canInvite]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        kind: { $ref: '#/components/schemas/DepositorKind' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        limits:
          type: object
          required: [maxTransferBytes, expiryDays]
          properties:
            maxTransferBytes: { $ref: '#/components/schemas/ByteSize' }
            expiryDays: { type: array, items: { $ref: '#/components/schemas/ExpiryDays' } }
        canInvite: { type: boolean }
        invitation:
          type: object
          description: Present for external depositors.
          required: [invitedBy, expiresAt]
          properties:
            invitedBy: { $ref: '#/components/schemas/Email' }
            expiresAt: { type: string, format: date-time }

    # --- Transfers --------------------------------------------------------
    ExpiryDays:
      type: integer
      enum: [1, 7, 30]
    TransferStatus:
      type: string
      x-extensible-enum: true
      description: |
        `uploading` → `scanning` → `available` → `expired` | `deleted`.
        `rejected`: every file was infected or blocklisted.
      enum: [uploading, scanning, available, rejected, expired, deleted]
    ScanStatus:
      type: string
      x-extensible-enum: true
      description: |
        `not_scanned_too_large`: file above ClamAV limits, accepted and flagged.
        `infected`: file deleted, kept in the list for the sender's information only.
        `scan_error`: the file could not be scanned after all retries; it is withheld (fail-closed,
        never downloadable) and the sender and super admin are informed.
      enum: [pending, scanning, clean, infected, not_scanned_too_large, scan_error]
    FileDeclaration:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Original file name (UTF-8). Stored in the database only; never used on disk. Control and bidirectional characters are rejected.
        size: { $ref: '#/components/schemas/ByteSize' }
        mediaType: { type: string, maxLength: 255, description: Informational only; downloads are always served as `application/octet-stream`. }
        expectedSha256: { $ref: '#/components/schemas/Sha256' }
      additionalProperties: false
    TransferCreate:
      type: object
      required: [expiryDays, files]
      properties:
        senderEmail:
          allOf: [{ $ref: '#/components/schemas/Email' }]
          description: Mandatory with an API token, forbidden with a deposit session.
        recipients:
          type: array
          description: Mandatory for internal depositors and API tokens; ignored for invited externals (the inviter is the recipient).
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/Email' }
        message: { type: string, maxLength: 5000, description: Plain text; never interpreted as HTML. }
        expiryDays: { $ref: '#/components/schemas/ExpiryDays' }
        password: { type: string, minLength: 1, maxLength: 1024, description: Optional; stored as an argon2id hash. }
        deleteAfterFirstDownload: { type: boolean, default: false }
        language: { $ref: '#/components/schemas/Language' }
        files:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/FileDeclaration' }
      additionalProperties: false
    SenderFile:
      type: object
      required: [id, name, size, scanStatus]
      properties:
        id: { type: string }
        name: { type: string }
        size: { $ref: '#/components/schemas/ByteSize' }
        mediaType: { type: string }
        sha256: { $ref: '#/components/schemas/Sha256' }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        uploadUrl: { type: string, description: tus upload URL (only while the transfer is `uploading`). }
        uploadOffset: { $ref: '#/components/schemas/ByteSize' }
    SenderTransfer:
      type: object
      required: [id, status, senderEmail, recipients, expiryDays, passwordProtected, deleteAfterFirstDownload, totalBytes, createdAt, files]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        senderEmail: { $ref: '#/components/schemas/Email' }
        recipients: { type: array, items: { $ref: '#/components/schemas/Email' } }
        message: { type: string }
        expiryDays: { $ref: '#/components/schemas/ExpiryDays' }
        expiresAt: { type: string, format: date-time, description: Set at finalization. }
        passwordProtected: { type: boolean }
        deleteAfterFirstDownload: { type: boolean }
        totalBytes: { $ref: '#/components/schemas/ByteSize' }
        createdAt: { type: string, format: date-time }
        uploadExpiresAt: { type: string, format: date-time }
        finalizedAt: { type: string, format: date-time }
        downloadUrl: { type: string, format: uri, description: Public download page (available once the transfer is `available`). }
        files: { type: array, items: { $ref: '#/components/schemas/SenderFile' } }

    # --- Invitations ------------------------------------------------------
    InvitationStatus:
      type: string
      x-extensible-enum: true
      enum: [pending, used, expired, revoked]
    InvitationCreate:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        message: { type: string, maxLength: 2000 }
        language: { $ref: '#/components/schemas/Language' }
      additionalProperties: false
    Invitation:
      type: object
      required: [id, email, invitedBy, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        email: { $ref: '#/components/schemas/Email' }
        invitedBy: { $ref: '#/components/schemas/Email' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    PublicInvitation:
      type: object
      required: [email, invitedBy, expiresAt]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        invitedBy: { $ref: '#/components/schemas/Email' }
        message: { type: string }
        expiresAt: { type: string, format: date-time }

    # --- Downloads --------------------------------------------------------
    TransferPassword:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
      additionalProperties: false
    PublicFile:
      type: object
      required: [id, name, size, sha256, scanStatus, downloadUrl]
      properties:
        id: { type: string }
        name: { type: string }
        size: { $ref: '#/components/schemas/ByteSize' }
        mediaType: { type: string }
        sha256: { $ref: '#/components/schemas/Sha256' }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        downloadUrl: { type: string }
    PublicTransfer:
      type: object
      required: [senderEmail, expiresAt, passwordProtected, locked]
      properties:
        senderEmail: { $ref: '#/components/schemas/Email' }
        message: { type: string, description: "Plain text, to be rendered as text (never HTML)." }
        expiresAt: { type: string, format: date-time }
        passwordProtected: { type: boolean }
        locked: { type: boolean, description: True when a password is required and not yet provided. }
        deleteAfterFirstDownload: { type: boolean }
        totalBytes: { $ref: '#/components/schemas/ByteSize' }
        archiveUrl: { type: string }
        files:
          type: array
          description: Absent while `locked`. Infected files are not listed.
          items: { $ref: '#/components/schemas/PublicFile' }

    # --- Admin auth -------------------------------------------------------
    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean }
    Username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
    AdminPassword:
      type: string
      minLength: 12
      maxLength: 1024
      description: At least 12 characters; checked against a list of common passwords.
    SetupRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/AdminPassword' }
        setupToken: { type: string, maxLength: 128 }
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 1024 }
      additionalProperties: false
    LoginState:
      type: object
      required: [status, csrfToken]
      properties:
        status:
          type: string
          x-extensible-enum: true
          description: Reserved for V2 - `sso_redirect`.
          enum: [totp_required, totp_enrollment_required, password_change_required, authenticated]
        csrfToken: { type: string }
    TotpCode:
      type: object
      description: Exactly one of `code` or `recoveryCode`.
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, maxLength: 32 }
      oneOf:
        - required: [code]
        - required: [recoveryCode]
      additionalProperties: false
    TotpEnrollment:
      type: object
      required: [secret, otpauthUri, qrCodePng]
      properties:
        secret: { type: string, description: Base32 secret (shown once). }
        otpauthUri: { type: string }
        qrCodePng: { type: string, contentEncoding: base64 }
        csrfToken: { type: string }
    TotpConfirmed:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: { type: array, items: { type: string }, minItems: 8, maxItems: 10, description: "Single-use codes, shown once, stored hashed." }
        csrfToken: { type: string }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        newPassword: { $ref: '#/components/schemas/AdminPassword' }
      additionalProperties: false
    PasswordConfirmation:
      type: object
      required: [currentPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
      additionalProperties: false
    ActivationRequest:
      type: object
      required: [activationToken, password]
      properties:
        activationToken: { type: string, maxLength: 128 }
        password: { $ref: '#/components/schemas/AdminPassword' }
      additionalProperties: false
    AdminRole:
      type: string
      x-extensible-enum: true
      description: Reserved for V2 - `auditor` (read-only on assigned tenants).
      enum: [super_admin, delegated_admin]
    TenantRef:
      type: object
      required: [id, name, fqdn]
      properties:
        id: { type: string }
        name: { type: string }
        fqdn: { type: string }
    AdminMe:
      type: object
      required: [id, username, email, role, totpEnabled, tenants, csrfToken]
      properties:
        id: { type: string }
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/AdminRole' }
        totpEnabled: { type: boolean }
        tenants: { type: array, items: { $ref: '#/components/schemas/TenantRef' } }
        csrfToken: { type: string }
        language: { $ref: '#/components/schemas/Language' }
    Admin:
      type: object
      required: [id, username, email, role, tenantIds, totpEnabled, disabled, createdAt]
      properties:
        id: { type: string }
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/AdminRole' }
        tenantIds: { type: array, items: { type: string }, description: Empty for super admins (implicit access to all tenants). }
        totpEnabled: { type: boolean }
        requireTotp: { type: boolean, description: Always true for super admins. }
        disabled: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Admin' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    AdminCreate:
      type: object
      required: [username, email, role]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/AdminRole' }
        tenantIds: { type: array, items: { type: string }, uniqueItems: true }
        requireTotp: { type: boolean, default: true }
      additionalProperties: false
    AdminUpdate:
      type: object
      properties:
        email: { $ref: '#/components/schemas/Email' }
        tenantIds: { type: array, items: { type: string }, uniqueItems: true }
        requireTotp: { type: boolean }
        disabled: { type: boolean }
      additionalProperties: false

    # --- Admin tenants ----------------------------------------------------
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
    Fqdn:
      type: string
      maxLength: 253
      pattern: '^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+([a-z]{2,63}|xn--[a-z0-9-]{1,59})$'
    Tenant:
      type: object
      required: [id, name, fqdn, defaultLanguage, maxTransferBytes, storageQuotaBytes, storageUsedBytes, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        fqdn: { $ref: '#/components/schemas/Fqdn' }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        maxTransferBytes: { type: integer, format: int64, minimum: 1, maximum: 21474836480 }
        storageQuotaBytes: { $ref: '#/components/schemas/ByteSize' }
        storageUsedBytes: { $ref: '#/components/schemas/ByteSize' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TenantList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    TenantCreate:
      type: object
      required: [name, fqdn, defaultLanguage, storageQuotaBytes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        fqdn: { $ref: '#/components/schemas/Fqdn' }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        storageQuotaBytes: { type: integer, format: int64, minimum: 1 }
        maxTransferBytes: { type: integer, format: int64, minimum: 1, maximum: 21474836480, default: 21474836480 }
      additionalProperties: false
    TenantUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        fqdn: { $ref: '#/components/schemas/Fqdn' }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        storageQuotaBytes: { type: integer, format: int64, minimum: 1 }
        maxTransferBytes: { type: integer, format: int64, minimum: 1, maximum: 21474836480 }
      additionalProperties: false
    ContrastResult:
      type: object
      required: [pair, ratio, level]
      properties:
        pair:
          type: string
          x-extensible-enum: true
          enum: [primary-on-light, accent-on-light, text-on-primary]
          description: V1.1 adds `*-on-dark` pairs for the dark theme.
        ratio: { type: number }
        level: { type: string, enum: [AAA, AA, fail] }
    Branding:
      type: object
      required: [primaryColor, accentColor, hasLogo, hasBackground, contrast]
      properties:
        primaryColor: { $ref: '#/components/schemas/HexColor' }
        accentColor: { $ref: '#/components/schemas/HexColor' }
        hasLogo: { type: boolean }
        hasBackground: { type: boolean }
        contrast: { type: array, items: { $ref: '#/components/schemas/ContrastResult' } }
    BrandingUpdate:
      type: object
      required: [primaryColor, accentColor]
      properties:
        primaryColor: { $ref: '#/components/schemas/HexColor' }
        accentColor: { $ref: '#/components/schemas/HexColor' }
      additionalProperties: false
    NetworkRules:
      type: object
      required: [internalCidrs, internalDomains]
      properties:
        internalCidrs:
          type: array
          maxItems: 500
          items: { type: string, description: IPv4 or IPv6 CIDR. }
        internalDomains:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 253, description: Exact domain match (subdomains must be listed explicitly). }
      additionalProperties: false
    SmtpSecurity:
      type: string
      enum: [none, starttls, tls]
      description: '`none` is intended for an unauthenticated relay on the internal Docker network.'
    SmtpSettings:
      type: object
      required: [host, port, security, passwordSet, fromAddress]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { $ref: '#/components/schemas/SmtpSecurity' }
        username: { type: [string, 'null'], maxLength: 320 }
        passwordSet: { type: boolean }
        fromAddress: { $ref: '#/components/schemas/Email' }
        fromName: { type: [string, 'null'], maxLength: 100 }
    SmtpSettingsUpdate:
      type: object
      required: [host, port, security, fromAddress]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { $ref: '#/components/schemas/SmtpSecurity' }
        username: { type: [string, 'null'], maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1024, description: "New password. Omit to keep the stored one." }
        removePassword: { type: boolean, default: false, description: "Remove the stored password (unauthenticated relay). Cannot be combined with `password`." }
        fromAddress: { $ref: '#/components/schemas/Email' }
        fromName: { type: [string, 'null'], maxLength: 100 }
      additionalProperties: false
      not:
        required: [password, removePassword]
    SmtpTest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/Email' }
      additionalProperties: false
    SmtpTestResult:
      type: object
      required: [success, durationMs]
      properties:
        success: { type: boolean }
        durationMs: { type: integer }
        error: { type: string, description: SMTP error message (never contains credentials). }
    DnsRecordCheck:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, warning, missing, error] }
        record: { type: string }
        message: { type: string }
    MailDnsCheck:
      type: object
      required: [domain, spf, dkim, dmarc]
      properties:
        domain: { type: string }
        spf: { $ref: '#/components/schemas/DnsRecordCheck' }
        dkim:
          type: object
          required: [status, selectors]
          properties:
            status: { type: string, enum: [ok, warning, missing, error] }
            selectors:
              type: array
              items:
                type: object
                required: [selector, found]
                properties:
                  selector: { type: string }
                  found: { type: boolean }
        dmarc: { $ref: '#/components/schemas/DnsRecordCheck' }
    EmailTemplateKey:
      type: string
      x-extensible-enum: true
      description: |
        Reserved for V1.1: `expiry-reminder`, `abuse-alert`, `my-transfers-link`,
        `recipient-verification-code`.
      enum:
        - verification-code
        - transfer-notification
        - transfer-confirmation
        - first-download
        - virus-detected
        - file-not-scanned
        - invitation
        - quota-warning
        - quota-reached
        - disk-alert
        - antivirus-unavailable
        - admin-activation
    EmailTemplateSummary:
      type: object
      required: [key, language, customised]
      properties:
        key: { $ref: '#/components/schemas/EmailTemplateKey' }
        language: { $ref: '#/components/schemas/Language' }
        customised: { type: boolean }
        updatedAt: { type: string, format: date-time }
    EmailTemplate:
      type: object
      required: [key, language, customised, subject, bodyHtml, bodyText, variables]
      properties:
        key: { $ref: '#/components/schemas/EmailTemplateKey' }
        language: { $ref: '#/components/schemas/Language' }
        customised: { type: boolean }
        subject: { type: string, maxLength: 255 }
        bodyHtml: { type: string, maxLength: 100000 }
        bodyText: { type: string, maxLength: 100000 }
        variables: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time }
    EmailTemplateUpdate:
      type: object
      required: [subject, bodyHtml, bodyText]
      properties:
        subject: { type: string, minLength: 1, maxLength: 255 }
        bodyHtml: { type: string, maxLength: 100000 }
        bodyText: { type: string, maxLength: 100000 }
      additionalProperties: false
    EmailPreview:
      type: object
      required: [subject, bodyHtml, bodyText]
      properties:
        subject: { type: string }
        bodyHtml: { type: string }
        bodyText: { type: string }

    # --- Admin operations -------------------------------------------------
    TransferOrigin:
      type: string
      x-extensible-enum: true
      description: Reserved for V1.1 - `internal_remote`, `reply`; V2 - `drop_link`.
      enum: [internal, external, api]
    AdminTransfer:
      type: object
      required: [id, status, origin, senderEmail, recipients, fileCount, totalBytes, passwordProtected, deleteAfterFirstDownload, createdAt, downloadCount]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        origin: { $ref: '#/components/schemas/TransferOrigin' }
        senderEmail: { $ref: '#/components/schemas/Email' }
        recipients: { type: array, items: { $ref: '#/components/schemas/Email' } }
        invitationId: { type: string }
        apiTokenId: { type: string }
        fileCount: { type: integer }
        totalBytes: { $ref: '#/components/schemas/ByteSize' }
        passwordProtected: { type: boolean }
        deleteAfterFirstDownload: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        firstDownloadedAt: { type: [string, 'null'], format: date-time }
        downloadCount: { type: integer }
    AdminTransferDetail:
      allOf:
        - $ref: '#/components/schemas/AdminTransfer'
        - type: object
          required: [files]
          properties:
            senderIp: { type: string }
            files:
              type: array
              items:
                type: object
                required: [id, name, size, scanStatus]
                properties:
                  id: { type: string }
                  name: { type: string }
                  size: { $ref: '#/components/schemas/ByteSize' }
                  mediaType: { type: string }
                  sha256: { $ref: '#/components/schemas/Sha256' }
                  scanStatus: { $ref: '#/components/schemas/ScanStatus' }
    AdminTransferList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminTransfer' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    AdminReason:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Recorded in the audit log. }
      additionalProperties: false
    ResendRequest:
      type: object
      properties:
        recipients:
          type: array
          description: Subset of the original recipients; all of them when omitted.
          items: { $ref: '#/components/schemas/Email' }
      additionalProperties: false
    BlocklistKind:
      type: string
      enum: [email, domain, sha256]
    BlocklistEntryCreate:
      type: object
      required: [kind, value]
      properties:
        kind: { $ref: '#/components/schemas/BlocklistKind' }
        value: { type: string, maxLength: 320, description: Normalised to lower case. }
        comment: { type: string, maxLength: 500 }
      additionalProperties: false
    BlocklistEntry:
      type: object
      required: [id, kind, value, createdBy, createdAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/BlocklistKind' }
        value: { type: string }
        comment: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    BlocklistList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BlocklistEntry' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    AllowedCidrs:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      description: IPv4 or IPv6 CIDR ranges the token may be used from. `0.0.0.0/0` and `::/0` mean any address.
      items: { type: string, maxLength: 43 }
    ApiToken:
      type: object
      required: [id, name, prefix, allowedCidrs, createdBy, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: "First characters of the token, to recognise it." }
        allowedCidrs: { $ref: '#/components/schemas/AllowedCidrs' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    ApiTokenCreate:
      type: object
      required: [name, allowedCidrs]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        allowedCidrs: { $ref: '#/components/schemas/AllowedCidrs' }
        expiresAt: { type: [string, 'null'], format: date-time }
      additionalProperties: false
    ApiTokenUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        allowedCidrs: { $ref: '#/components/schemas/AllowedCidrs' }
      additionalProperties: false
    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "Secret value, returned only once." }
    AuditAction:
      type: string
      x-extensible-enum: true
      enum:
        - transfer.created
        - transfer.finalized
        - transfer.downloaded
        - transfer.expired
        - transfer.deleted
        - transfer.notification_resent
        - file.infected
        - file.not_scanned
        - address.verified
        - invitation.created
        - invitation.used
        - invitation.revoked
        - quota.warning
        - quota.reached
        - api_token.created
        - api_token.used
        - api_token.revoked
        - admin.login
        - admin.logout
        - admin.created
        - admin.updated
        - admin.deleted
        - tenant.created
        - tenant.updated
        - tenant.deleted
        - config.updated
        - blocklist.updated
        - data_subject.erased
        - maintenance.enabled
        - maintenance.disabled
        - master_key.rotation_started
        - master_key.rotation_completed
        - setup.completed
    AuditEvent:
      type: object
      required: [id, occurredAt, actor, action, object]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        tenantId: { type: [string, 'null'] }
        actor:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, x-extensible-enum: true, enum: [depositor, recipient, admin, api_token, system] }
            id: { type: string }
        ip: { type: string }
        action: { $ref: '#/components/schemas/AuditAction' }
        object:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: string }
        details: { type: object, additionalProperties: true }
    AuditEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    TenantStats:
      type: object
      required: [period, transferCount, bytesUploaded, downloadCount, bytesDownloaded, virusDetections, storageUsedBytes, storageQuotaBytes, storageUsedRatio, series]
      properties:
        period: { type: string, enum: [7d, 30d, 12m] }
        transferCount: { type: integer }
        bytesUploaded: { $ref: '#/components/schemas/ByteSize' }
        downloadCount: { type: integer }
        bytesDownloaded: { $ref: '#/components/schemas/ByteSize' }
        virusDetections: { type: integer }
        storageUsedBytes: { $ref: '#/components/schemas/ByteSize' }
        storageQuotaBytes: { $ref: '#/components/schemas/ByteSize' }
        storageUsedRatio: { type: number, minimum: 0 }
        series:
          type: array
          items:
            type: object
            required: [date, transfers, bytesUploaded]
            properties:
              date: { type: string, format: date }
              transfers: { type: integer }
              bytesUploaded: { $ref: '#/components/schemas/ByteSize' }
    DataSubjectRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
      additionalProperties: false
    DataSubjectSummary:
      type: object
      required: [email, verifiedAddress, transfersAsSender, transfersAsRecipient, invitations, auditEvents, securityEvents]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        verifiedAddress: { type: boolean }
        transfersAsSender: { type: integer }
        transfersAsRecipient: { type: integer }
        invitations: { type: integer }
        auditEvents: { type: integer }
        securityEvents: { type: integer }
    DataSubjectEraseReport:
      type: object
      required: [transfersDeleted, recipientEntriesRemoved, verifiedAddressDeleted, invitationsDeleted, logEntriesPseudonymised]
      properties:
        transfersDeleted: { type: integer }
        recipientEntriesRemoved: { type: integer }
        verifiedAddressDeleted: { type: boolean }
        invitationsDeleted: { type: integer }
        logEntriesPseudonymised: { type: integer }

    # --- System -----------------------------------------------------------
    GlobalStats:
      type: object
      required: [period, disk, tenants]
      properties:
        period: { type: string, enum: [7d, 30d, 12m] }
        disk:
          type: object
          required: [totalBytes, usedBytes, usedRatio, alertThreshold]
          properties:
            totalBytes: { $ref: '#/components/schemas/ByteSize' }
            usedBytes: { $ref: '#/components/schemas/ByteSize' }
            usedRatio: { type: number }
            alertThreshold: { type: number }
        tenants:
          type: array
          items:
            type: object
            required: [tenantId, name, transferCount, bytesUploaded, storageUsedBytes, storageQuotaBytes, storageUsedRatio]
            properties:
              tenantId: { type: string }
              name: { type: string }
              transferCount: { type: integer }
              bytesUploaded: { $ref: '#/components/schemas/ByteSize' }
              storageUsedBytes: { $ref: '#/components/schemas/ByteSize' }
              storageQuotaBytes: { $ref: '#/components/schemas/ByteSize' }
              storageUsedRatio: { type: number }
    SystemSettings:
      type: object
      properties:
        diskAlertThreshold: { type: number, minimum: 0.5, maximum: 0.99, default: 0.85 }
        alertEmail: { $ref: '#/components/schemas/Email' }
      additionalProperties: false
    Maintenance:
      type: object
      required: [enabled, source]
      properties:
        enabled: { type: boolean }
        source: { type: string, enum: [none, environment, admin] }
        since: { type: string, format: date-time }
        message:
          type: object
          description: Message per language.
          additionalProperties: { type: string, maxLength: 500 }
    MaintenanceUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        message:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
      additionalProperties: false
    KeyRotation:
      type: object
      required: [id, status, fromKeyId, toKeyId, totalKeys, rewrappedKeys, startedAt]
      properties:
        id: { type: string, pattern: '^rot_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        status: { type: string, enum: [running, completed, failed] }
        fromKeyId:
          type: string
          pattern: '^mk_[0-9a-f]{16}$'
          description: Identifier of the master key being replaced, derived from the key (not secret).
        toKeyId:
          type: string
          pattern: '^mk_[0-9a-f]{16}$'
          description: Identifier of the new master key, derived from the key (not secret).
        totalKeys:
          type: integer
          format: int64
          minimum: 0
          description: Number of wrapped keys under the old master key when the rotation started.
        rewrappedKeys:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of wrapped keys rewrapped so far. It can exceed totalKeys when keys were created
            under the old master key while the rotation was running.
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        error: { type: string }
