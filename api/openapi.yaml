  /transfers/{transferId}/finalize:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Transfers]
      operationId: finalizeTransfer
      summary: Finalize a transfer after all files are uploaded
      description: |
        Checks that every declared file is fully uploaded, compares `expectedSha256` when it was
        provided and checks the file hashes against the blocklist, then hands the transfer to the
        antivirus: the answer (`202`, status `scanning`) comes at once and the analysis runs
        **asynchronously**; poll `GET /transfers/{transferId}` to follow it.

        Each file is decrypted on the fly and streamed to ClamAV, then gets its final
        `scanStatus`: `clean`, `infected` (with `scanSignature`, shown to the sender only),
        `not_scanned_too_large` (above the ClamAV size limits) or `not_scanned_encrypted` (an
        encrypted archive ClamAV cannot read), both delivered unscanned and flagged (the sender is
        told and the download page says so), or `scan_error` (could not be analyzed after several
        attempts: withheld, never downloadable). Since 1.1, when the antivirus is disabled
        (`TT_ANTIVIRUS_ENGINE=none`, or `antivirusEnabled: false` for the tenant) at the time of
        the finalization, files get `not_scanned_disabled` at once: delivered unscanned and
        flagged like `not_scanned_too_large`. The status is decided at finalization: files
        already waiting for the engine when a tenant disables its antivirus keep waiting, and
        re-enabling it never rescans past files. When the instance starts with
        `TT_ANTIVIRUS_ENGINE=none`, files still waiting for a scan are released as
        `not_scanned_disabled` (audited `antivirus.scans_released`). Infected files are **erased** (their key is
        destroyed, then their content), and the sender is alerted; their entries stay in the file
        list for the sender's information.

        When at least one file can be delivered, the transfer becomes `available`: the recipients
        receive the link, a QR code (inline CID) and the SHA-256 fingerprints, the sender a
        confirmation, and, for a transfer created before 1.1 (single shared link), `downloadUrl`
        appears in the sender's view; `expiresAt` is set then, so
        the chosen duration runs from the availability, not from the finalization. When no file
        can be delivered (every file infected or in `scan_error`), the transfer ends `rejected`,
        the sender is alerted and no recipient is notified.

        The antivirus is **fail-closed**: while ClamAV is unreachable, files stay `scanning`, the
        analysis is retried with back-off (and resumed after a restart), and nothing is made
        available.

        Only the sender may finalize: the deposit session of the sender for a session transfer,
        the API token that created it for a token transfer (`404` otherwise).
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      responses:
        '202':
          description: Accepted; antivirus scan in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderTransfer' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: scanning
                senderEmail: alice@entity-a.example.com
                recipients: [carol@customer.example.net]
                expiryDays: 7
                passwordProtected: true
                deleteAfterFirstDownload: false
                totalBytes: 15728640
                createdAt: '2026-10-19T16:00:00Z'
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    size: 15728640
                    mediaType: application/pdf
                    sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                    scanStatus: scanning
        '401': { $ref: '#/components/responses/DepositUnauthenticated' }
        '403':
          description: |
            A file hash is on the tenant blocklist (`blocked-file`), the depositor is no longer
            allowed to deposit (`deposit-not-allowed`: eligibility is checked again), an API token
            is used from an IP outside its `allowedCidrs` (`ip-not-allowed`, written to the
            security log), or the CSRF check of a session request failed (`csrf-invalid`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                blockedFile:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#blocked-file
                    title: File refused
                    status: 403
                    code: blocked-file
                    detail: One of the files is not allowed by the administrators of this service.
                depositNotAllowed:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#deposit-not-allowed
                    title: Deposit not allowed
                    status: 403
                    code: deposit-not-allowed
                ipNotAllowed:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#ip-not-allowed
                    title: Address not allowed for this token
                    status: 403
                    code: ip-not-allowed
                csrfInvalid:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
                    title: Invalid CSRF token
                    status: 403
                    code: csrf-invalid
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Some files are not fully uploaded (`upload-incomplete`), a checksum mismatched
            (`checksum-mismatch`), or the transfer is not in `uploading` state, has no file left,
            or one of its uploads is in progress (`state-conflict`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                incomplete:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#upload-incomplete
                    title: Upload incomplete
                    status: 409
                    code: upload-incomplete
                    files: [fil_01JABCDA0K112M3N4P5Q6R7S8T]
                checksum:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#checksum-mismatch
                    title: Checksum mismatch
                    status: 409
                    code: checksum-mismatch
                    files: [fil_01JABCD9F1A2B3C4D5E6F7G8H9]
                stateConflict:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                    title: Operation not allowed in the current state
                    status: 409
                    code: state-conflict
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MaintenanceMode' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # tus uploads
  # ---------------------------------------------------------------------------
  /uploads:
    options:
      tags: [Uploads (tus)]
      operationId: getTusCapabilities
      summary: tus server capabilities
      description: "Returns the tus protocol version, the supported extensions and the maximum upload size for the current tenant."
      security: []
      responses:
        '204':
          description: Supported tus version and extensions.
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
            Tus-Version:
              schema: { type: string }
              example: 1.0.0
            Tus-Extension:
              schema: { type: string }
              example: expiration,termination
            Tus-Max-Size:
              description: Maximum size of a single upload resource, in bytes (the per-transfer limit of the tenant).
              schema: { type: integer, format: int64, minimum: 0 }
              example: 21474836480
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    head:
      tags: [Uploads (tus)]
      operationId: getUploadOffset
      summary: Current offset of an upload (resume)
      description: "Returns the number of bytes durably stored for an upload, so that an interrupted upload can resume at the right offset."
      security:
        - depositSession: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/TusResumableHeader'
      responses:
        '200':
          description: "Current offset. Responses are never cached (`Cache-Control: no-store`)."
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
            Upload-Offset: { $ref: '#/components/headers/UploadOffset' }
            Upload-Length:
              schema: { type: integer, format: int64, minimum: 0 }
              example: 12884901888
            Upload-Expires: { $ref: '#/components/headers/UploadExpires' }
        '401': { description: 'Missing deposit session or `Authorization` header, or invalid, revoked or expired API token (written to the security log). No body.' }
        '403': { description: 'API token used from an IP outside its `allowedCidrs` (written to the security log). No body.' }
        '404': { description: "Unknown upload, or upload belonging to another sender or tenant." }
        '410': { description: 'Upload expired, or transfer no longer being uploaded.' }
        '412': { $ref: '#/components/responses/TusVersionUnsupported' }
        '429': { description: 'Too many invalid API tokens from this IP (written to the security log); retry after `Retry-After`. No body.' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Uploads (tus)]
      operationId: appendUploadChunk
      summary: Append bytes to an upload
      description: |
        Streams bytes at `Upload-Offset`. Content is encrypted (AES-256-GCM, chunked) and hashed
        (SHA-256) on the fly while being written to disk; nothing is buffered in memory and the
        database is not written per chunk. Any chunk size is accepted; the server persists
        progress on disk so that an interrupted request can be resumed from the last durable offset
        (obtained with `HEAD`).
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/TusResumableHeader'
        - name: Upload-Offset
          in: header
          description: "Offset at which the bytes of this request start; must equal the current offset of the upload."
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          example: 0
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
            example: "<binary data>"
      responses:
        '204':
          description: Bytes appended.
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
            Upload-Offset: { $ref: '#/components/headers/UploadOffset' }
            Upload-Expires: { $ref: '#/components/headers/UploadExpires' }
        '400': { description: '`Upload-Offset` header missing or malformed, or request body interrupted (the bytes received are kept; resume after `HEAD`).' }
        '401': { description: 'Missing deposit session or `Authorization` header, or invalid, revoked or expired API token (written to the security log). No body.' }
        '403': { description: 'CSRF failure of a session request, or API token used from an IP outside its `allowedCidrs` (written to the security log). No body.' }
        '404': { description: "Unknown upload, or upload belonging to another sender or tenant." }
        '409': { description: '`Upload-Offset` does not match the current offset, another request is uploading to this resource, or the transfer is no longer being uploaded.' }
        '410': { description: Upload expired. }
        '412': { $ref: '#/components/responses/TusVersionUnsupported' }
        '413': { description: 'Bytes beyond the declared `Upload-Length`: the bytes up to `Upload-Length` are kept, the rest is discarded. An empty `PATCH` at `Upload-Offset` = `Upload-Length` then completes the upload.' }
        '415': { description: 'Content-Type is not `application/offset+octet-stream`.' }
        '503': { description: Maintenance mode; retry after `Retry-After`. Uploads already started may be resumed after maintenance. }
        '429': { description: 'Too many invalid API tokens from this IP (written to the security log); retry after `Retry-After`. No body.' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Uploads (tus)]
      operationId: terminateUpload
      summary: Abort an upload (tus termination)
      description: Removes the partial file. The file is removed from the transfer declaration and the quota reservation is released.
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/TusResumableHeader'
      responses:
        '204':
          description: Upload terminated.
          headers:
            Tus-Resumable: { $ref: '#/components/headers/TusResumable' }
        '401': { description: 'Missing deposit session or `Authorization` header, or invalid, revoked or expired API token (written to the security log). No body.' }
        '403': { description: 'CSRF failure of a session request, or API token used from an IP outside its `allowedCidrs` (written to the security log). No body.' }
        '404': { description: "Unknown upload, or upload belonging to another sender or tenant." }
        '409': { description: 'Transfer no longer being uploaded, or another request is uploading to this resource.' }
        '412': { $ref: '#/components/responses/TusVersionUnsupported' }
        '429': { description: 'Too many invalid API tokens from this IP (written to the security log); retry after `Retry-After`. No body.' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Invitations
  # ---------------------------------------------------------------------------
  /invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite an external user to deposit files
      description: |
        Reserved to internal depositors. Sends an invitation email (tenant SMTP and template)
        containing a unique link. Files deposited through it are addressed to the inviter.
        The invitation expires after 12 months if unused. The inviter is recorded in the
        database and in the audit log.

        Rate limit: 20 invitations per hour per inviting address (`429 rate-limited` with
        `Retry-After`); since 1.1 the number is the tenant's `maxInvitationsPerInviter` (abuse
        thresholds, 20 by default). Control and invisible characters (bidirectional overrides, zero-width
        characters...) are removed from `message` before it is stored and mailed.
      security:
        - depositSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
            example:
              email: bob@partner.example.org
              message: Please send me the signed contract.
              language: en
      responses:
        '201':
          description: Invitation sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
              example:
                id: inv_01JABCF0Z9Y8X7W6V5V4T3S2R1
                email: bob@partner.example.org
                invitedBy: alice@entity-a.example.com
                status: pending
                createdAt: '2026-10-19T16:00:00Z'
                expiresAt: '2027-10-19T16:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DepositForbidden' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

