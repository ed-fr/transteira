      operationId: searchDataSubject
      summary: GDPR - find all data linked to an email address
      description: |
        Counts the data of this tenant linked to an email address. Only this tenant is searched:
        the same address in another tenant is neither counted nor revealed. POST is used so that
        the address does not appear in URLs and proxy logs. The search is itself audited as
        `data_subject.searched`, without the address. Requires the right to change the tenant.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubjectRequest' }
            example: { email: carol@customer.example.net }
      responses:
        '200':
          description: Summary of the data held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectSummary' }
              example:
                email: carol@customer.example.net
                verifiedAddress: false
                transfersAsSender: 0
                transfersAsRecipient: 3
                invitations: 0
                auditEvents: 7
                securityEvents: 0
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/data-subjects/erase:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Admin operations]
      operationId: eraseDataSubject
      summary: GDPR - erase all data linked to an email address
      description: |
        Erases the data of this tenant linked to an email address. Only this tenant is affected:
        the same address in another tenant is left untouched. Requires the right to change the
        tenant. Each step can be replayed safely, so a failed erasure can simply be repeated.

        What is erased:

        - transfers sent by the address, or tied to an invitation of which the address is the
          invitee: crypto-erased (keys destroyed, then files) and their rows deleted;
        - transfers received: the address is removed from the recipient list, and a transfer left
          without any recipient is deleted (crypto-erased) as well;
        - invitations of which the address is the invitee: deleted; invitations it issued:
          revoked, the issuer being replaced by the pseudonym;
        - verification codes, deposit sessions and the verified address record: deleted;
        - since 1.1, "My transfers" access links and sessions of the address: deleted; recipient
          links and download tracking of the address: deleted with its recipient entries; abuse
          reports it made, and those about its transfers: the address is replaced by the
          pseudonym;
        - audit log: the address is replaced by the pseudonym wherever it is the actor.

        The pseudonym has the form `erased-<16 hex>`: the first 16 hexadecimal characters of an
        HMAC-SHA256 of the address with a random salt drawn for this erasure and then discarded.
        It groups the events of one person within one erasure without allowing the address to be
        recovered. The security log never records e-mail addresses, so it has nothing to erase.

        What is kept, on purpose:

        - blocklist entries, so that an abuser is not unblocked;
        - client IP addresses in the audit log, for their 12-month retention (legitimate security
          interest);
        - mails already queued for sending;
        - backups: crypto-erasure makes the backed-up files unreadable, since their keys are
          destroyed.

        The erasure is audited as `data_subject.erased`, without the address, with the counts of
        the report. While an upload of a transfer of the address is in progress, the erasure
        stops with `409 state-conflict` and a `Retry-After` header: repeat it after the delay.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubjectRequest' }
            example: { email: carol@customer.example.net }
      responses:
        '200':
          description: Erasure report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectEraseReport' }
              example:
                transfersDeleted: 0
                recipientEntriesRemoved: 3
                verifiedAddressDeleted: false
                invitationsDeleted: 0
                logEntriesPseudonymised: 7
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "A transfer of the address is being uploaded (tus `PATCH` in progress), or a deposit was started with one of its invitations meanwhile; what was erased stays erased. Retry after `Retry-After` to complete the erasure."
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                title: Operation not allowed in the current state
                status: 409
                code: state-conflict
                retryAfterSeconds: 5
        '500': { $ref: '#/components/responses/InternalError' }

