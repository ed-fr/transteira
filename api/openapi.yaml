                  name: Security team channel
                  kind: teams
                  urlHint: https://entity-a.webhook.example.com
                  events: [virus.detected, abuse.threshold_exceeded, abuse.unusual_activity, abuse.reported]
                  enabled: true
                  hasSecret: false
                  createdBy: admin.entity-a
                  createdAt: '2026-10-20T08:00:00Z'
                  updatedAt: '2026-10-20T08:00:00Z'
                  lastDelivery: { at: '2026-10-26T14:02:00Z', success: true, httpStatus: 200, durationMs: 182 }
                  circuitOpenUntil: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin tenants]
      operationId: createTenantWebhook
      summary: Create a webhook
      description: |
        Since 1.1. Creates a webhook receiving the selected events of the tenant (see
        `WebhookEventType`; the system events such as `disk.alert_raised` are reserved to the
        instance-wide webhooks). Payloads are minimal (`WebhookEvent`): no e-mail address unless
        the tenant enables `webhookIncludeAddresses`.

        Network guard: the URL must be `https:`, at most 2048 characters, without user
        information. Its host is resolved again at every connection and the address checked
        before connecting (no DNS rebinding). Never reachable, whatever the configuration:
        unspecified addresses, link-local and cloud metadata (`169.254.169.254`,
        `fd00:ec2::254`), IPv4-compatible IPv6 (with `::1`), multicast, reserved and broadcast
        ranges, the container's own networks, and `TT_WEBHOOK_DENY_NETWORKS`. Denied unless
        `TT_WEBHOOK_ALLOW_NETWORKS` (CIDRs) opens them, for an internal receiver: private RFC
        1918 ranges, CGNAT `100.64.0.0/10`, `192.0.0.0/24`, `198.18.0.0/15`, unique local
        `fc00::/7`, site-local `fec0::/10`, the IPv6 prefixes embedding an IPv4 address and the
        IPv4 loopback (tests only). IPv4-mapped IPv6 addresses are judged as IPv4. Plain `http:`
        is accepted only towards `TT_WEBHOOK_ALLOW_HTTP_NETWORKS` (otherwise
        `invalid-format`). Redirects are never followed. A URL whose host does not resolve now,
        or resolves to a denied address, is refused at once with the same answer for both
        (`400 validation-failed`, field code `url-not-allowed`), so that the check reveals
        nothing of the internal DNS; `invalid-format` is kept for a malformed URL. Every URL
        checked counts against a limit of 30 creations and URL changes per hour per
        administrator and tenant (`429` with `Retry-After`). The URL is sealed with the master
        key and never returned in full.

        For the `generic` kind, the server generates a signing secret, returned **once** in
        `secret` and sealed in the database: every delivery carries
        `X-TransTeira-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>">` (see
        `WebhookEvent`). `teams` and `slack` receive a formatted message instead and have no
        secret. At most 20 webhooks per tenant (`409 state-conflict`). Requires the right to
        change the tenant. Audited as `webhook.created` (kind, events and URL host only).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
            examples:
              generic:
                summary: Generic JSON receiver
                value: { name: SIEM collector, kind: generic, url: 'https://siem.example.com/hooks/transteira', events: [virus.detected, abuse.reported, quota.reached] }
              teams:
                summary: Teams channel
                value: { name: Security team channel, kind: teams, url: 'https://entity-a.webhook.example.com/webhookb2/EXAMPLE', events: [virus.detected, abuse.threshold_exceeded] }
      responses:
        '201':
          description: Webhook created; for the `generic` kind, `secret` is shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookWithSecret' }
              example:
                id: whk_01JABCQ2S3T4V5W6X7Y8Z9A0B1
                name: SIEM collector
                kind: generic
                urlHint: https://siem.example.com
                events: [virus.detected, abuse.reported, quota.reached]
                enabled: true
                hasSecret: true
                createdBy: admin.entity-a
                createdAt: '2026-10-27T09:00:00Z'
                updatedAt: '2026-10-27T09:00:00Z'
                lastDelivery: null
                circuitOpenUntil: null
                secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/webhooks/{webhookId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Admin tenants]
      operationId: getTenantWebhook
      summary: Get a webhook
      description: "Since 1.1. Returns one webhook of the tenant (never its URL in full nor its secret). A webhook of another tenant answers `404`, like an unknown one."
      security:
        - adminSession: []
      responses:
        '200':
          description: Webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
              example:
                id: whk_01JABCQ1R2S3T4V5W6X7Y8Z9A0
                name: Security team channel
                kind: teams
                urlHint: https://entity-a.webhook.example.com
                events: [virus.detected, abuse.threshold_exceeded, abuse.unusual_activity, abuse.reported]
                enabled: true
                hasSecret: false
                createdBy: admin.entity-a
                createdAt: '2026-10-20T08:00:00Z'
                updatedAt: '2026-10-20T08:00:00Z'
                lastDelivery: { at: '2026-10-26T14:02:00Z', success: false, httpStatus: 502, durationMs: 10003, errorCategory: http_status }
                circuitOpenUntil: '2026-10-26T14:17:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin tenants]
      operationId: updateTenantWebhook
      summary: Update a webhook
      description: |
        Since 1.1. JSON Merge Patch (RFC 7396) of a webhook: an absent member is left unchanged,
        `null` is refused, an unknown member is refused (`400 validation-failed`). A new `url`
        follows the rules of `createTenantWebhook`, including its limit of 30 creations and URL
        changes per hour per administrator and tenant (`429`); the other members do not count.
        Deliveries still queued or retrying use the new settings, and stop when the webhook is
        disabled or no longer subscribed. `rotateSecret: true` (generic kind only)
        replaces the signing secret, returned once in `secret`; the previous key material is
        destroyed at once. Re-enabling a webhook closes its circuit breaker. Requires the right to change
        the tenant. Audited as `webhook.updated` (names of the changed fields only).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/WebhookUpdate' }
            example: { enabled: false }
      responses:
        '200':
          description: Updated webhook; `secret` only after a rotation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookWithSecret' }
              example:
                id: whk_01JABCQ1R2S3T4V5W6X7Y8Z9A0
                name: Security team channel
                kind: teams
                urlHint: https://entity-a.webhook.example.com
                events: [virus.detected, abuse.threshold_exceeded, abuse.unusual_activity, abuse.reported]
                enabled: false
                hasSecret: false
                createdBy: admin.entity-a
                createdAt: '2026-10-20T08:00:00Z'
                updatedAt: '2026-10-27T09:05:00Z'
                lastDelivery: { at: '2026-10-26T14:02:00Z', success: true, httpStatus: 200, durationMs: 182 }
                circuitOpenUntil: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin tenants]
      operationId: deleteTenantWebhook
      summary: Delete a webhook
      description: "Since 1.1. Deletes a webhook, destroying the key material of its sealed URL and secret first; deliveries in progress are abandoned. Requires the right to change the tenant. Audited as `webhook.deleted`."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Webhook deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/webhooks/{webhookId}/test:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Admin tenants]
      operationId: testTenantWebhook
      summary: Send a test event to a webhook
      description: |
        Since 1.1. Delivers a `webhook.test` event synchronously (one attempt, no retry, same
        timeout and network guard as real deliveries, even while the circuit breaker is open)
        and reports the outcome with a coarse `errorCategory` only (`dns`, `refused_network`,
        `connect`, `tls`, `timeout`, `http_status`): no address, port, banner or response body is
        ever returned. Limited to 10 tests per hour per administrator and tenant (`429`).
        Requires the right to change the tenant. Audited as `webhook.tested`.
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '200':
          description: Outcome of the test delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookTestResult' }
              examples:
                ok: { value: { success: true, httpStatus: 200, durationMs: 182 } }
                ko: { value: { success: false, durationMs: 10002, errorCategory: timeout } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Admin - operations of a tenant
  # ---------------------------------------------------------------------------
  /admin/tenants/{tenantId}/transfers:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin operations]
      operationId: listTenantTransfers
      summary: List transfers of the tenant
      description: "Lists the transfers of the tenant, most recent first, with filters on status, address and creation date. Metadata only."
      security:
        - adminSession: []
      parameters:
        - name: status
          in: query
          description: "Filter by status."
          schema: { $ref: '#/components/schemas/TransferStatus' }
          example: available
        - name: email
          in: query
          description: Filter on sender or recipient address (exact match).
          schema: { $ref: '#/components/schemas/Email' }
          example: alice@entity-a.example.com
        - name: createdAfter
          in: query
          description: "Only items created after this instant."
          schema: { type: string, format: date-time }
          example: '2026-10-01T00:00:00Z'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Transfers (most recent first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTransferList' }
              example:
                items:
                  - id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                    status: available
                    origin: internal
                    senderEmail: alice@entity-a.example.com
                    recipients: [carol@customer.example.net]
                    fileCount: 2
                    totalBytes: 12900630528
                    passwordProtected: true
                    deleteAfterFirstDownload: false
                    createdAt: '2026-10-19T16:00:00Z'
                    expiresAt: '2026-10-26T16:20:00Z'
                    firstDownloadedAt: null
                    downloadCount: 0
                nextCursor: eyJjIjoiMjAyNi0xMC0xOVQxNjowMDowMFoiLCJpIjoidHJmXzAxIn0
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/TransferId'
    get:
      tags: [Admin operations]
      operationId: getTenantTransfer
      summary: Transfer details (metadata only, never content)
      description: "Returns the metadata of a transfer, its files, SHA-256 fingerprints and antivirus results. File contents are never accessible to admins."
      security:
        - adminSession: []
      responses:
        '200':
          description: Transfer details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTransferDetail' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: available
                origin: internal
                senderEmail: alice@entity-a.example.com
                recipients: [carol@customer.example.net]
                fileCount: 1
                totalBytes: 15728640
                passwordProtected: false
                deleteAfterFirstDownload: false
                createdAt: '2026-10-19T16:00:00Z'
                expiresAt: '2026-10-26T16:20:00Z'
                firstDownloadedAt: '2026-10-19T17:02:00Z'
                downloadCount: 3
                senderIp: 10.10.4.21
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    size: 15728640
                    mediaType: application/pdf
                    sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                    scanStatus: clean
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin operations]
      operationId: deleteTenantTransfer
      summary: Delete a transfer before expiry
      description: |
        Deletes the transfer with crypto-erase: the key of each file is destroyed first, then the
        files, so that copies in backups become unreadable. The transfer is marked `deleted`, its
        download link answers `410 transfer-gone` and the space is freed from the quota. A transfer
        being scanned by the antivirus is withdrawn from the scan first: it is never made
        available and no notification is sent to its recipients.

        The optional `reason` is recorded in the audit log (`transfer.deleted`) after the e-mail
        addresses it contains are replaced by `[address]` and it is cut to 500 characters.

        Deleting a transfer that has already ended (`expired` or `deleted`) is a no-op answered
        `204`, without audit. When an upload (tus `PATCH`) of the transfer is in progress, the
        deletion is refused with `409 state-conflict` and a `Retry-After` header: retry after the
        delay. Requires the right to change the tenant.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminReason' }
            example: { reason: Sent to the wrong recipient at the sender's request. }
      responses:
        '204': { description: "Transfer deleted, or already ended (no-op)." }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An upload of the transfer is in progress; retry after `Retry-After`.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                title: Operation not allowed in the current state
                status: 409
                code: state-conflict
                retryAfterSeconds: 5
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/transfers/{transferId}/resend:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Admin operations]
      operationId: resendTransferNotification
      summary: Resend the notification email to recipients
      description: |
        Queues the notification email again, through the SMTP settings of the tenant, for all or
        some of the original recipients of an `available` transfer (otherwise `409
        state-conflict`). Every listed recipient must be an original recipient of the transfer
        (otherwise `400 validation-failed`); without a list, the notification goes to all of them.

        The mail carries the existing download link (since 1.1, each recipient's own link for a
        transfer with per-recipient links): the link is never returned to the admin nor
        written to any log, and the download token is never rotated, so links already received
        keep working. At most 5 resends per hour per transfer (`429 rate-limited`). When no SMTP
        server is configured for the tenant, nothing is queued (`503 mail-unavailable`). Audited
        as `transfer.notification_resent` with the number of recipients only. Requires the right
        to change the tenant.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendRequest' }
            example: { recipients: [carol@customer.example.net] }
      responses:
        '202': { description: Notification queued. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: No SMTP server is configured for the tenant; nothing was queued.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#mail-unavailable
                title: Email cannot be sent
                status: 503
                code: mail-unavailable

