openapi: 3.1.0

info:
  title: TransTeira API
  version: 1.1.0
  summary: Multi-tenant, self-hosted large file transfer.
  description: |
    TransTeira is a self-hosted, multi-tenant file transfer service (WeTransfer-like)
    designed for organisations with several entities (tenants).

    ## Tenant resolution
    Every request is bound to exactly **one tenant**, resolved from the `Host` header
    (for example `transfer.entity-a.example.com`). There is no tenant identifier in public
    URLs. A request for an unknown host is rejected with `421 Misdirected Request`
    (problem code `unknown-tenant`) and recorded in the security log.

    ## Admin host
    Administration endpoints (`/admin/*`) are served **only on the dedicated admin host(s)**
    listed in `TT_ADMIN_HOSTS` (see `.env.example`), for example `admin.transfer.example.com`,
    never on a tenant FQDN: under a tenant host every `/admin/*` path answers `404 not-found`,
    and under the admin host every tenant endpoint answers `404 not-found`. The admin host is
    not a tenant: no tenant is resolved there, and an admin may manage several tenants, so the
    tenant is given explicitly in the path (`/admin/tenants/{tenantId}/...`) and checked
    against the admin's assignments. The admin host also serves `/healthz`, `/version` and
    `/api/openapi.yaml`. The `421 unknown-tenant` answer only concerns hosts that are neither
    a tenant FQDN nor an admin host. An admin host can never be the FQDN of a tenant: the
    server refuses to start when one is.

    The admin session cookie `__Host-tt_admin` is bound to the admin host by its `__Host-`
    prefix, so it is never sent to a tenant FQDN. It is cleared by the server on logout and on
    a `401 unauthenticated` answer to a request whose cookie no longer resolves to a session
    (unknown, expired or revoked). A valid session whose login state does not open the
    operation (TOTP or enrollment still awaited) also gets `401 unauthenticated`, but keeps
    its cookie: the next login step remains possible.

    ## Authentication
    | Scheme | Used by | Transport |
    |---|---|---|
    | `depositSession` | Depositors (internal users, invited externals) after email verification | Cookie `__Host-tt_deposit` |
    | `adminSession` | Super admin and delegated admins after password + TOTP | Cookie `__Host-tt_admin` |
    | `csrfToken` | Required with any cookie-based scheme on unsafe methods (`POST`, `PUT`, `PATCH`, `DELETE`) | Header `X-CSRF-Token` |
    | `apiToken` | Automated deposits by scripts and third-party software | `Authorization: Bearer tt_...` |
    | `downloadGrant` | Recipients who unlocked a password-protected transfer | Cookie `__Host-tt_dl` |
    | `recipientVerification` | Recipients who proved their address with a code (since 1.1) | Cookie `__Host-tt_rv` |
    | `myTransfersSession` | Senders consulting "My transfers" after following a mailed access link (since 1.1) | Cookie `__Host-tt_me` |
    | `metricsToken` | Monitoring tools reading `/metrics` and `/status` (since 1.1) | `Authorization: Bearer <TT_METRICS_TOKEN>` |

    Only strictly technical cookies are used (`Secure`, `HttpOnly`, `SameSite=Strict`, no
    `Domain`). Besides the schemes above, the technical recognition cookie `__Host-tt_known`
    (not an authentication scheme, lifetime 1 year) is set for internal depositors who entered a
    code: it lets an already verified address skip the code on that browser only. It never
    contains an address: its entries are opaque values keyed by the master key and bound to the
    tenant and the address, worthless under another tenant. It proves nothing by itself; the
    database remains authoritative.

    ## API tokens
    An API token (`apiToken`) is an alternative to the deposit session on `POST /transfers`,
    `GET /transfers/{transferId}`, `DELETE /transfers/{transferId}`,
    `POST /transfers/{transferId}/finalize` and the tus operations `HEAD`, `PATCH` and `DELETE`
    on `/uploads/{uploadId}`. It is created by an admin of the tenant
    (`/admin/tenants/{tenantId}/api-tokens`) and its secret is shown once.
    - **Precedence:** when a request carries an `Authorization: Bearer` header, only the token is
      considered: a deposit session cookie sent along is ignored, and no `X-CSRF-Token` is needed
      (a browser never adds this header by itself). Without the header, nothing changes.
    - **Host:** a token is only valid on the FQDN of its own tenant; presented on another
      tenant's FQDN it is unknown (`401 invalid-credentials`). It never opens anything on the
      admin host (`404` on the deposit paths, `401` on `/admin/*`).
    - **Order of the checks:** the token is authenticated first: a missing `Authorization`
      header on an operation that has no other credential gives `401 unauthenticated`; an
      unknown, revoked or expired token gives `401 invalid-credentials`, whatever the client IP,
      and is written to the security log (`api_token_invalid`). Repeated invalid tokens from the
      same IP get `429 rate-limited` (written to the security log as well). Only then is the
      client IP checked against the token's `allowedCidrs`: outside them, `403 ip-not-allowed`,
      written to the security log.
    - **Ownership:** a token reads, cancels, finalizes and uploads only the transfers it created
      (`404` for any other, including those of another token of the same tenant). A deposit
      session never reaches a transfer created by a token, even with the same address, and a
      token never reaches a transfer created with a deposit session.
    - **Senders:** the `senderEmail` of a token deposit must be an address of one of the
      tenant's internal domains, not blocklisted. A token may further restrict it with
      `allowedSenders`: a list of full addresses and domains; the address must then equal one of
      the addresses or have exactly one of the domains as its domain (no subdomain matching).
      An empty list allows any internal address. A mismatch gives `403 deposit-not-allowed`
      (security log `deposit_refused`, reason `domain`); the rule is checked again on finalize,
      with the token's current `allowedSenders`.
    - **Limits:** the per-transfer limit, the storage quota, the blocklist and the antivirus
      apply as for an internal depositor; the cap on unfinished transfers
      (`TT_MAX_OPEN_TRANSFERS`) and the `Idempotency-Key` are counted per token.
    - **Audit:** `api_token.used` is recorded once per transfer created with a token, with the
      sender address as actor (a depositor, covered by the GDPR requests on that address), the
      token as object and the transfer identifier in its details; the transfer events name the
      token (`tok_...`) as actor.

    ## Interactive documentation
    An interactive documentation generated from this specification is served at `/api/docs`
    (embedded in the binary, no external resource). By default it is served on the admin host
    only and requires an admin session (`401` otherwise); when `TT_API_DOCS_PUBLIC=true`, it is
    also served, without authentication, on the tenant FQDNs. This specification itself is always
    downloadable at `/api/openapi.yaml`.

    ## Errors
    All errors use **RFC 9457 Problem Details** (`application/problem+json`). Each problem carries
    a stable machine-readable `code` extension member; the full catalogue is documented in
    `docs/api/errors.md` and in the `ProblemCode` schema below. Clients must rely on `code`,
    never on `title` or `detail`, which are localised.

    ## Large uploads (tus)
    File content is uploaded with the [tus 1.0.0](https://tus.io/protocols/resumable-upload)
    resumable upload protocol. Creating a transfer (`POST /transfers`) pre-creates one tus upload
    resource per declared file and returns its `uploadUrl`; clients then use `HEAD` and `PATCH`
    on that URL. Supported tus extensions: `expiration`, `termination`.
    The tus `creation` extension is intentionally not exposed: uploads are always attached to a
    transfer whose limits and quota have been checked beforehand.

    As tus requires, every request but `OPTIONS` carries `Tus-Resumable: 1.0.0` (otherwise
    `412`, with the supported versions in `Tus-Version`), and every response of `HEAD`,
    `PATCH` and `DELETE` carries `Tus-Resumable`. Their error responses (`4xx`, and the `503`
    of maintenance) have **no body**: the status code is the whole answer. Only `500` carries
    a Problem. A `PATCH` body must be `application/offset+octet-stream` (otherwise `415`).
    A `PATCH` whose body stalls for `TT_UPLOAD_IDLE_TIMEOUT` (60 s by default) between two
    reads is cut; the bytes received until then are kept and `HEAD` returns the offset to
    resume from.

    Upload resources are reached with the deposit session of the sender of the transfer (same
    address and, for an external depositor, same invitation), or with the API token that
    created the transfer; any other caller gets `404`.

    ## Pagination
    List endpoints use opaque cursors: `?limit=50&cursor=...`; responses contain `items` and
    `nextCursor` (absent on the last page).

    ## Versioning
    The API is versioned in the URL (`/api/v1`). No incompatible change is made within a major
    version: fields may be added, never removed or retyped. Enumerations marked
    `x-extensible-enum` may gain new values; clients must tolerate unknown values.

    ## Per-recipient download links (since 1.1)
    Every transfer created from version 1.1 on gives **each recipient their own download link**
    (`/downloads/{linkToken}` keeps the same form): downloads are tracked per recipient, the
    first-download receipt names the recipient, and a link forwarded to someone else can be made
    useless with the recipient verification option (`recipientVerification`, or imposed by a
    confidentiality level): the recipient then proves their address with a 6-digit code
    (`POST /downloads/{linkToken}/verification`) before anything is listed or served. Transfers
    created before 1.1 keep their single shared link, which is still served unchanged.

    Recipient links are only ever mailed to their recipient: they are **never returned** to the
    sender, to an API token or to an administrator. The sender sees, per recipient, the tracking
    status only (`recipientTracking`: verification and download dates, no URL, no token).

    ## Version 1.1 additions
    Version 1.1 only adds paths, optional fields and values of `x-extensible-enum` enumerations;
    every operation, field and value marked "Since 1.1." is absent from a 1.0 server (a 1.0
    server answers `404 not-found` on the new paths):
    - recipients: per-recipient links and tracking, recipient verification by code, maximum
      number of downloads (`maxDownloads`), expiry reminder the day before expiry, abuse report
      button (`/downloads/{linkToken}/abuse-reports`), reply to a transfer
      (`/downloads/{linkToken}/reply`);
    - senders: "My transfers" without an account (`/me/*`), deposit from outside for internal
      addresses already verified from the internal network (depositor kind `internal_remote`),
      folders (file field `path`), confidentiality levels (`confidentialityLevel`);
    - administrators: confidentiality levels, recipient domain rules, abuse detection thresholds,
      abuse reports, webhooks (per tenant and instance-wide);
    - operations: `/metrics` (Prometheus) and `/status` (JSON), outside any tenant.

    **Behaviour changes** a 1.0 client must know:
    - `SenderTransfer.downloadUrl` is absent for transfers created from 1.1 on (each recipient
      has their own link, mailed to them only); it is still set for transfers created before
      1.1. A script that forwarded `downloadUrl` must now rely on the notification mails, and
      follow the recipients with `recipientTracking`.
    - With per-recipient links, `deleteAfterFirstDownload` deletes the transfer once **every**
      recipient has completed at least one download (after the usual grace period), or at
      expiry; transfers created before 1.1 keep the 1.0 behaviour (first complete download).
    - The expiry reminder is mailed the day before expiry to the recipients who have not
      downloaded yet, except when the remaining lifetime at availability is under 36 hours
      (1-day transfers).

    ## Roadmap reservations (not part of 1.1)
    The following path prefixes and fields are **reserved** so that later versions do not
    require a breaking change:
    - V2: `/admin/auth/oidc/*`, `/admin/tenants/{tenantId}/sso`, `/admin/tenants/{tenantId}/drop-links`,
      `/admin/tenants/{tenantId}/export`, `/admin/tenants/import`, `/transfers/{transferId}/proof`;
      admin role `auditor`; depositor kind and transfer origin `drop_link`; transfer fields
      `linkOnly`, `endToEndEncrypted`.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: TransTeira project
    url: https://github.com/ed-fr/transteira

servers:
  - url: /api/v1
    description: |
      Same origin as the tenant FQDN (for example https://transfer.entity-a.example.com/api/v1)
      for the tenant endpoints, and as the admin host (`TT_ADMIN_HOSTS`, for example
      https://admin.transfer.example.com/api/v1) for the `/admin/*` endpoints, which answer 404
      on any other host.

tags:
  - name: Meta
    description: Version, health, monitoring and public tenant information.
  - name: Deposit sessions
    description: Identification of depositors by email address and one-time verification code.
  - name: Transfers
    description: Creation and follow-up of transfers by their sender (session or API token).
  - name: Uploads (tus)
    description: Resumable upload of file content with the tus 1.0.0 protocol.
  - name: Invitations
    description: Invitations issued by internal users so that externals can deposit files.
  - name: Downloads
    description: Public download pages for recipients.
  - name: My transfers
    description: "Since 1.1. Senders consult, delete and extend their transfers without an account, after following a mailed access link."
  - name: Webhooks
    description: "Since 1.1. Requests TransTeira sends to the receivers of generic webhooks (OpenAPI `webhooks`)."
  - name: Admin auth
    description: First-run setup, login with TOTP, own account management.
  - name: Admin tenants
    description: Tenant creation (super admin) and configuration (super admin and delegated admins).
  - name: Admin operations
    description: Transfers, invitations, blocklist, API tokens, abuse reports, audit, statistics and GDPR requests of a tenant.
  - name: Admin system
    description: Instance-wide operations reserved to the super admin.

paths:
  # ---------------------------------------------------------------------------
  # Meta
  # ---------------------------------------------------------------------------
  /healthz:
    servers:
      - url: /
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Health check
      description: |
        Checks the application, the database and ClamAV availability. Answers even in
        maintenance mode. Does not require a known tenant host, so that it can be probed
        directly on the container (Uptime Kuma, Docker healthcheck). Never exposes secrets
        or tenant data.

        Since 1.1, with `TT_ANTIVIRUS_ENGINE=none` (antivirus disabled for the whole instance, no
        antivirus container needed) the antivirus is not probed and `checks.antivirus` is `ok`.
        The engine name is never disclosed here (unauthenticated): see `/status` and the system
        settings.
      security: []
      responses:
        '200':
          description: All components are healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: ok
                version: 1.1.0
                maintenance: false
                checks: { database: ok, antivirus: ok, storage: ok }
        '503':
          description: At least one component is unhealthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: degraded
                version: 1.1.0
                maintenance: false
                checks: { database: ok, antivirus: unavailable, storage: ok }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /metrics:
    servers:
      - url: /
    get:
      tags: [Meta]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Since 1.1. Instance metrics in the Prometheus text exposition format (version 0.0.4):
        transfers and volumes per tenant, quota usage, antivirus detections and scan queue,
        download streams, errors, disk usage, webhook deliveries. Served outside any tenant, like
        `/healthz`, whatever the `Host` (a tenant FQDN, the admin host or the container address),
        and still answered in maintenance mode. Metrics carry the tenant identifier as a label
        (`tenant="ten_..."`), never an e-mail address, a file name or a token. Values are
        computed every 15 seconds and served from that snapshot: a scrape never queries the
        database. Counters (`_total`) count since the start of the process.

        Metric names (all prefixed `transteira_`): `build_info`, `uptime_seconds`, `maintenance`,
        `transfers_total`, `uploaded_bytes_total`, `downloads_total`, `downloaded_bytes_total`,
        `antivirus_detections_total` (per tenant), `storage_used_bytes`, `storage_quota_bytes`,
        `active_transfers` (per tenant), `scan_queue_files`, `antivirus_up`, `antivirus_alert`,
        `disk_used_ratio`, `disk_used_bytes`, `disk_total_bytes`, `disk_alert`, `download_streams`,
        `http_requests_total` (per status class), `webhook_deliveries_total` (per result),
        `events_dropped_total` (per subscriber), `syslog_messages_total` (per result),
        `mail_queue_length`, `mail_dropped_total`, `lifecycle_last_success_timestamp_seconds` (per
        task). New names may be added; existing ones are never renamed within `1.x`.

        Protection: the endpoint only exists when `TT_METRICS_TOKEN` is set (`404 not-found`
        otherwise, as for an unknown path). When `TT_METRICS_ALLOWED_IPS` (CIDR list) is set, a
        client whose real IP (read through the trusted proxies only) is outside it also gets
        `404`, before any token check. The request must then carry
        `Authorization: Bearer <TT_METRICS_TOKEN>`: a missing header is `401 unauthenticated`, a
        wrong token `401 invalid-credentials`, compared in constant time and written to the
        security log (`metrics_token_invalid`). Repeated invalid tokens from one IP get
        `429 rate-limited`.
      security:
        - metricsToken: []
      responses:
        '200':
          description: "Metrics in the Prometheus text format (`Content-Type: text/plain; version=0.0.4; charset=utf-8`), never cached (`Cache-Control: no-store`)."
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            text/plain:
              schema: { type: string }
              example: |
                # HELP transteira_build_info Version of the running instance.
                # TYPE transteira_build_info gauge
                transteira_build_info{version="1.1.0",commit="3f9c2ab"} 1
                # HELP transteira_transfers_total Transfers made available, per tenant.
                # TYPE transteira_transfers_total counter
                transteira_transfers_total{tenant="ten_01JAB00000000000000ENT1TYA"} 412
                # HELP transteira_uploaded_bytes_total Bytes of the transfers made available, per tenant.
                # TYPE transteira_uploaded_bytes_total counter
                transteira_uploaded_bytes_total{tenant="ten_01JAB00000000000000ENT1TYA"} 1932735283200
                # HELP transteira_storage_used_bytes Storage used, per tenant.
                # TYPE transteira_storage_used_bytes gauge
                transteira_storage_used_bytes{tenant="ten_01JAB00000000000000ENT1TYA"} 274877906944
                # HELP transteira_storage_quota_bytes Storage quota, per tenant.
                # TYPE transteira_storage_quota_bytes gauge
                transteira_storage_quota_bytes{tenant="ten_01JAB00000000000000ENT1TYA"} 1099511627776
                # HELP transteira_antivirus_detections_total Files found infected, per tenant.
                # TYPE transteira_antivirus_detections_total counter
                transteira_antivirus_detections_total{tenant="ten_01JAB00000000000000ENT1TYA"} 1
                # HELP transteira_scan_queue_files Files waiting for or under analysis.
                # TYPE transteira_scan_queue_files gauge
                transteira_scan_queue_files 0
                # HELP transteira_antivirus_up Whether clamd answers (1) or not (0).
                # TYPE transteira_antivirus_up gauge
                transteira_antivirus_up 1
                # HELP transteira_disk_used_ratio Usage of the filesystem holding the data directory.
                # TYPE transteira_disk_used_ratio gauge
                transteira_disk_used_ratio 0.3
                # HELP transteira_http_requests_total HTTP requests, per status class.
                # TYPE transteira_http_requests_total counter
                transteira_http_requests_total{class="2xx"} 18342
                transteira_http_requests_total{class="5xx"} 2
        '401': { $ref: '#/components/responses/MetricsUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /status:
    servers:
      - url: /
    get:
      tags: [Meta]
      operationId: getStatus
      summary: Instance status (JSON)
      description: |
        Since 1.1. A JSON summary of the instance state, for monitoring tools that do not read the
        Prometheus format (Observium, scripts): component health as in `/healthz`, maintenance,
        disk usage and alert, antivirus queue and outage alert, last successful run of each
        cleanup task, and per tenant the storage usage
        and transfer counters. Served outside any tenant and protected exactly like `/metrics`
        (same token, same optional IP allowlist, `404` when `TT_METRICS_TOKEN` is unset). Tenants
        are named by identifier and name only, never with an e-mail address. The answer is `200`
        even when a component is unhealthy: read `status`.
      security:
        - metricsToken: []
      responses:
        '200':
          description: "Instance status, never cached (`Cache-Control: no-store`)."
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceStatus' }
              example:
                status: ok
                version: 1.1.0
                checkedAt: '2026-10-27T09:00:00Z'
                uptimeSeconds: 864000
                maintenance: false
                checks: { database: ok, antivirus: ok, storage: ok }
                disk: { totalBytes: 4398046511104, usedBytes: 1319413953331, usedRatio: 0.3, alertThreshold: 0.85, alertActive: false }
                antivirus: { engine: clamd, queuedFiles: 0, alertActive: false }
                lifecycle: { expire: '2026-10-27T08:59:30Z', purge-rows: '2026-10-27T03:00:05Z', backup: '2026-10-27T02:30:41Z' }
                tenants:
                  - id: ten_01JAB00000000000000ENT1TYA
                    name: Entity A
                    storageUsedBytes: 274877906944
                    storageQuotaBytes: 1099511627776
                    storageUsedRatio: 0.25
                    activeTransfers: 37
                    transfersLast24h: 9
        '401': { $ref: '#/components/responses/MetricsUnauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /openapi.yaml:
    servers:
      - url: /api
    get:
      tags: [Meta]
      operationId: getOpenApiSpec
      summary: Download the OpenAPI specification
      description: Returns this specification. Publicly accessible so that clients can be generated.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
              example: "openapi: 3.1.0\ninfo:\n  title: TransTeira API\n"
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /version:
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Application version
      description: "Returns the semantic version of the running instance and the API major version, so that clients can check compatibility. Served on every tenant FQDN and on the admin host; `421` only answers an unknown host."
      security: []
      responses:
        '200':
          description: Semantic version of the running instance and API.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
              example: { version: 1.1.0, apiVersion: v1, commit: 3f9c2ab }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tenant:
    get:
      tags: [Meta]
      operationId: getPublicTenant
      summary: Public configuration of the current tenant
      description: |
        Branding, language and limits needed by the public interface. The response language
        follows `Accept-Language` when available, otherwise the tenant default language.

        Since 1.1 it also carries the real rules of the tenant, used by the deposit form and by
        the built-in help (per-entity user documentation and its print-friendly version):
        `features` (deposit from outside for verified internal addresses, reply to a transfer,
        recipient verification, maximum number of downloads, folders, recipient domain
        restrictions, antivirus state) and `confidentialityLevels` with their localised labels
        and rules. Nothing secret is exposed: neither the internal IP ranges, the internal or
        restricted domains, nor the abuse thresholds.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Public tenant configuration.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTenant' }
              examples:
                normal:
                  summary: Usual configuration
                  value:
                    name: Entity A
                    language: fr
                    availableLanguages: [fr, en]
                    branding:
                      primaryColor: '#0B5FFF'
                      accentColor: '#00875A'
                      hasLogo: true
                      hasBackground: false
                      logoUrl: /api/v1/tenant/assets/logo
                      backgroundUrl: /api/v1/tenant/assets/background
                    limits:
                      maxTransferBytes: 21474836480
                      expiryDays: [1, 7, 30]
                    maintenance: false
                    legalDocuments: [legal-notice, privacy-policy]
                    features:
                      remoteInternalDeposit: true
                      transferReply: false
                      recipientVerification: true
                      maxDownloads: true
                      folders: true
                      recipientRestrictions: true
                      antivirus: enabled
                    confidentialityLevels:
                      - key: public
                        label: Public
                        isDefault: false
                        rules: { requireRecipientVerification: false, requirePassword: false, allowedExpiryDays: [1, 7, 30], internalRecipientsOnly: false, forceDeleteAfterFirstDownload: false, maxDownloads: null }
                      - key: internal
                        label: Interne
                        isDefault: true
                        rules: { requireRecipientVerification: false, requirePassword: false, allowedExpiryDays: [1, 7, 30], internalRecipientsOnly: false, forceDeleteAfterFirstDownload: false, maxDownloads: null }
                      - key: confidential
                        label: Confidentiel
                        isDefault: false
                        rules: { requireRecipientVerification: true, requirePassword: true, allowedExpiryDays: [1, 7], internalRecipientsOnly: true, forceDeleteAfterFirstDownload: false, maxDownloads: null }
                maintenance:
                  summary: Maintenance mode, message only written in English
                  description: |
                    The client negotiated French, but the super admin wrote the maintenance message
                    in English only: `maintenanceMessageLanguage` reports the fallback language.
                  value:
                    name: Entity A
                    language: fr
                    availableLanguages: [fr, en]
                    branding:
                      primaryColor: '#0B5FFF'
                      accentColor: '#00875A'
                      hasLogo: false
                      hasBackground: false
                      backgroundUrl: /api/v1/tenant/assets/background
                    limits:
                      maxTransferBytes: 21474836480
                      expiryDays: [1, 7, 30]
                    maintenance: true
                    maintenanceMessage: Upgrade in progress, back around 8 pm.
                    maintenanceMessageLanguage: en
                    legalDocuments: []
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tenant/assets/{asset}:
    get:
      tags: [Meta]
      operationId: getTenantAsset
      summary: Tenant logo or background image
      description: |
        Returns the configured image, re-encoded by the server when it was uploaded (PNG for the
        logo, JPEG for the background), never the uploaded bytes. Without a configured image, the
        background is the built-in default one and the logo answers `404`. The response carries a
        strong `ETag` (quoted SHA-256 of the image) and a short public cache lifetime (5 minutes):
        a client revalidates with `If-None-Match` and gets `304` while the image is unchanged.
      security: []
      parameters:
        - name: asset
          in: path
          description: "Which image: `logo` or `background`."
          required: true
          schema: { type: string, enum: [logo, background] }
          example: logo
        - name: If-None-Match
          in: header
          description: Entity tag of the copy held by the client; `304` when it is still current.
          required: false
          schema: { type: string, maxLength: 256 }
          example: '"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"'
      responses:
        '200':
          description: "Image content, with its exact media type (`image/png` for the logo, `image/jpeg` for the background), `X-Content-Type-Options: nosniff` and `Cache-Control: public, max-age=300`."
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/AssetCacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            image/png: { schema: { type: string, format: binary }, example: "<binary data>" }
            image/jpeg: { schema: { type: string, format: binary }, example: "<binary data>" }
        '304':
          description: Not modified (the `If-None-Match` entity tag is current).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/AssetCacheControl' }
        '404': { $ref: '#/components/responses/NotFound' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tenant/legal/{document}:
    get:
      tags: [Meta]
      operationId: getTenantLegalDocument
      summary: Legal notice or privacy policy of the tenant
      description: |
        Returns the legal notice or the privacy policy of the current tenant in the negotiated
        language, falling back to the tenant default language; `404` when the tenant wrote it in
        neither. The answer holds the Markdown source and `html`, its rendering by the server:
        limited Markdown, raw HTML never passed through, sanitized by an allowlist. A client
        displays `html` as is rather than rendering the Markdown itself.
      security: []
      parameters:
        - $ref: '#/components/parameters/LegalDocumentPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Document in the negotiated language, with its sanitized HTML rendering.
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
              example:
                document: privacy-policy
                language: en
                markdown: "# Privacy policy\n\nEntity A processes the email addresses..."
                html: "<h2>Privacy policy</h2>\n<p>Entity A processes the email addresses...</p>\n"
                updatedAt: '2026-10-01T09:00:00Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Deposit sessions
  # ---------------------------------------------------------------------------
  /deposit-sessions:
    post:
      tags: [Deposit sessions]
      operationId: startDepositSession
      summary: Identify a depositor by email address
      description: |
        Starts the identification of a depositor.

        Eligibility is checked first (in this order): blocklist, then either an
        `invitationToken` (external depositor) or the internal-user rule (client IP in a tenant
        CIDR range **and** email domain in the tenant's allowed domains).

        - For an **internal** depositor whose address is already verified for this tenant **and**
          whose browser presents the recognition cookie `__Host-tt_known` naming that address
          (set after a code was confirmed on this browser), a deposit session is created
          immediately (`201`), the address' last-use date is refreshed and the recognition
          cookie is renewed.
        - Otherwise, including **every deposit through an invitation** (even for a verified
          address) and any missing, foreign or invalid recognition cookie, a 6-digit code is sent
          through the tenant SMTP server and a verification challenge is returned (`202`). The
          code is valid 15 minutes and allows 2 wrong attempts.

        Since 1.1, when the tenant allows it (`allowRemoteInternalDeposit`), an address of an
        internal domain whose client IP is **outside** the tenant ranges may still deposit
        without invitation, provided the address was already verified once from the internal
        network: a code is then required on **every** deposit (the recognition cookie is neither
        honoured nor set), and the session kind is `internal_remote`. Such deposits are flagged in
        the audit log and counted by the abuse detection. Any other address outside the ranges
        gets the same generic `403 deposit-not-allowed`.

        Rate limits: 5 codes per hour per address, 20 codes per hour per client IP.
        Refused deposits are written to the security log.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RecognitionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositSessionStart' }
            examples:
              internal:
                summary: Internal user on the corporate network
                value: { email: alice@entity-a.example.com }
              invited:
                summary: External user with an invitation
                value: { email: bob@partner.example.org, invitationToken: inv_9sK2mQ7xL0aZ4vR8tYb3nC6dE1fG5hJ }
      responses:
        '201':
          description: Internal address already verified and recognized on this browser; deposit session created.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetDepositCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositSession' }
              example:
                email: alice@entity-a.example.com
                kind: internal
                csrfToken: csrf_Jd83kLm0Qp2Zx7Vb
                expiresAt: '2026-10-19T20:00:00Z'
                limits: { maxTransferBytes: 21474836480, expiryDays: [1, 7, 30] }
                canInvite: true
        '202':
          description: A verification code has been sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationChallenge' }
              example:
                challengeId: vch_4Fq9Lm2Zx8Rt6Yb1Kd7Pw3
                email: alice@entity-a.example.com
                expiresAt: '2026-10-19T16:15:00Z'
                attemptsRemaining: 2
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/DepositForbidden' }
        '410': { $ref: '#/components/responses/InvitationGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /verification-challenges/{challengeId}/confirm:
    post:
      tags: [Deposit sessions]
      operationId: confirmVerificationChallenge
      summary: Submit the verification code
      description: |
        Validates the 6-digit code. On success the address is stored as verified for the tenant
        and a deposit session is created. For an internal depositor the recognition cookie
        `__Host-tt_known` is set (or renewed, keeping the other addresses it names) so that this
        browser may skip the code next time; an external (invited) depositor's cookie is left
        unchanged, since invitation deposits always require a code.
        After 2 wrong codes the challenge is invalidated and a new code must be requested.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
        - $ref: '#/components/parameters/RecognitionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCode' }
            example: { code: '482913' }
      responses:
        '201':
          description: Code accepted; deposit session created.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetDepositCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositSession' }
              example:
                email: bob@partner.example.org
                kind: external
                csrfToken: csrf_Pq1Lm8Zx3Vb7Kd0R
                expiresAt: '2026-10-19T20:00:00Z'
                limits: { maxTransferBytes: 21474836480, expiryDays: [1, 7, 30] }
                canInvite: false
                invitation:
                  invitedBy: alice@entity-a.example.com
                  expiresAt: '2027-10-01T08:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/DepositForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: |
            Challenge expired, already used or invalidated after too many wrong attempts
            (`verification-exhausted`), or invitation of an external depositor expired or revoked
            since the code was sent (`invitation-gone`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                verificationExhausted:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#verification-exhausted
                    title: Verification code invalidated
                    status: 410
                    code: verification-exhausted
                    detail: Too many wrong attempts. Please request a new code.
                invitationGone:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invitation-gone
                    title: Invitation no longer valid
                    status: 410
                    code: invitation-gone
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '422':
          description: Wrong code; at least one attempt remains.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#verification-code-invalid
                title: Invalid verification code
                status: 422
                code: verification-code-invalid
                attemptsRemaining: 1
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /deposit-sessions/current:
    get:
      tags: [Deposit sessions]
      operationId: getCurrentDepositSession
      summary: Current deposit session
      description: "Returns the address, depositor kind, limits and CSRF token of the current deposit session. Used by the web interface after a page reload."
      security:
        - depositSession: []
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositSession' }
              example:
                email: alice@entity-a.example.com
                kind: internal
                csrfToken: csrf_Jd83kLm0Qp2Zx7Vb
                expiresAt: '2026-10-19T20:00:00Z'
                limits: { maxTransferBytes: 21474836480, expiryDays: [1, 7, 30] }
                canInvite: true
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Deposit sessions]
      operationId: endDepositSession
      summary: End the deposit session
      description: "Revokes the deposit session server side and clears the session cookie."
      security:
        - depositSession: []
          csrfToken: []
      responses:
        '204':
          description: Session ended; cookie cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearDepositCookie' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Transfers (sender side)
  # ---------------------------------------------------------------------------
  /transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Create a transfer and its upload resources
      description: |
        Declares a transfer and its files. The server checks the per-transfer size limit, the
        tenant storage quota (reserving the declared size), the blocklist, and returns one tus
        `uploadUrl` per file. The transfer stays in `uploading` state until
        `POST /transfers/{transferId}/finalize` is called.

        With an API token, the token is authenticated first (an unknown, revoked or expired token
        always gives `401 invalid-credentials`, whatever the client IP), then the client IP must
        belong to the token's `allowedCidrs` (otherwise `403 ip-not-allowed`, written to the
        security log). `senderEmail` is then mandatory and must belong to one of the tenant's
        internal domains; no email verification is performed (the token is the proof), but the
        blocklist applies to the address and its domain (`403 deposit-not-allowed`), and
        `recipients` is mandatory. When the token has `allowedSenders`, `senderEmail` must also
        equal one of its addresses or belong exactly to one of its domains (`403
        deposit-not-allowed`, security log reason `domain`); an empty list allows any internal
        address. The internal rule of public deposits (tenant IP ranges and
        internal domain) is replaced by the token's `allowedCidrs` and the internal domain. The
        transfer belongs to the token only (see "API tokens" above); the `Idempotency-Key` is
        scoped to the token.
        With a deposit session, `senderEmail` must be omitted: the verified session address is used.
        An invited external depositor cannot choose recipients: files are addressed to the
        internal user who issued the invitation.

        The uploads of an unfinished transfer (never finalized) expire (`410`) after
        `TT_UPLOAD_TTL` (24 h by default) without activity on any file of the transfer, or
        `TT_UPLOAD_MAX_AGE` (7 days by default) after the creation of the transfer, whatever its
        activity. Its quota reservation is released when the sender cancels it, or by the
        periodic cleanup.

        A sender may have only a limited number of unfinished (uploading) transfers at once:
        `TT_MAX_OPEN_TRANSFERS` (10 by default) for an internal depositor, 3 for an invited
        external one, and `TT_MAX_OPEN_TRANSFERS` per API token; transfers whose uploads have
        expired do not count. Beyond it the creation gets `429 rate-limited` with `Retry-After`;
        finalizing or cancelling a transfer frees a slot.

        Since 1.1:
        - each recipient gets their own download link, mailed to them only and never returned
          to the sender or the token (see "Per-recipient download links"); `downloadUrl` stays
          absent. `recipientVerification` makes every recipient prove their address by code
          first;
        - `maxDownloads` (1 to 1000) caps the number of download starts of the transfer, all
          recipients together (resumed ranges are not counted); once reached, the transfer is
          deleted after the same grace period as `deleteAfterFirstDownload`, and new downloads
          get `410 max-downloads-reached`;
        - with per-recipient links, `deleteAfterFirstDownload` deletes the transfer once every
          recipient has completed at least one download (bounded by the expiry);
        - `confidentialityLevel` picks one of the tenant levels (the default level when
          omitted): its rules are enforced here (`422 confidentiality-rule-violated`, each entry
          of `errors` naming the field and the rule: `required` for a missing password or
          recipient verification, `not-allowed` with `allowed` for a duration, `internal-only`
          for a recipient outside the internal domains, `max-exceeded` for `maxDownloads`), and
          a forced `deleteAfterFirstDownload` or `maxDownloads` cap is applied. The rules applied
          are **snapshotted** on the transfer: later changes of the level never affect it, and
          its extensions are checked against the snapshot. An unknown level key is
          `400 validation-failed`;
        - the recipient domain rules of the tenant apply: a recipient in a denied domain, or
          outside a non-empty allow list, gets `403 recipient-domain-refused`, each refused
          recipient named in `errors` (`/recipients/<index>`), recorded in the audit log only
          (`transfer.recipient_refused`; a policy refusal, never written to the security log);
        - with the abuse detection set to block, a creation exceeding a per-sender daily limit
          (volume, number of transfers, recipients per transfer) or, for an external depositor or
          a reply, the external quotas gets `403 abuse-threshold-blocked`; without blocking, the
          transfer is created and the admins are alerted;
        - a file may carry a relative folder `path` (folders dropped in the browser), kept in the
          file lists and in the ZIP archive;
        - a session of kind `reply` addresses the transfer to the original sender (its
          `recipients` are ignored) and sets `replyToTransferId`; the original transfer must
          still be available, here and again at finalization (`410 transfer-gone`);
        - the expiry reminder is mailed the day before expiry to the recipients who have not
          downloaded yet, unless the remaining lifetime at availability is under 36 hours.
      security:
        - depositSession: []
          csrfToken: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreate' }
            examples:
              session:
                summary: Internal user, two files, password protected
                value:
                  recipients: [carol@customer.example.net, dave@customer.example.net]
                  message: Here are the plans discussed this morning.
                  expiryDays: 7
                  password: correct horse battery staple
                  deleteAfterFirstDownload: false
                  language: en
                  files:
                    - { name: plans-v3.pdf, size: 15728640, mediaType: application/pdf }
                    - { name: site-survey.mp4, size: 12884901888, mediaType: video/mp4 }
              apiToken:
                summary: Automated deposit with an API token
                value:
                  senderEmail: reporting@entity-a.example.com
                  recipients: [finance@entity-a.example.com]
                  expiryDays: 1
                  files:
                    - { name: export-2026-10-19.csv, size: 52428800, expectedSha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }
              confidential:
                summary: Confidential level, recipient verification, folder upload (since 1.1)
                value:
                  recipients: [carol@entity-a.example.com]
                  expiryDays: 1
                  password: correct horse battery staple
                  recipientVerification: true
                  maxDownloads: 3
                  confidentialityLevel: confidential
                  files:
                    - { name: budget-2027.xlsx, path: finance/2027, size: 1048576 }
                    - { name: notes.txt, path: finance, size: 2048 }
      responses:
        '201':
          description: Transfer created; upload the files with tus, then finalize.
          headers:
            Location:
              description: URL of the created transfer.
              schema: { type: string }
              example: /api/v1/transfers/trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderTransfer' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: uploading
                senderEmail: alice@entity-a.example.com
                recipients: [carol@customer.example.net, dave@customer.example.net]
                message: Here are the plans discussed this morning.
                expiryDays: 7
                passwordProtected: true
                deleteAfterFirstDownload: false
                totalBytes: 12900630528
                createdAt: '2026-10-19T16:00:00Z'
                uploadExpiresAt: '2026-10-20T16:00:00Z'
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    size: 15728640
                    mediaType: application/pdf
                    uploadUrl: /api/v1/uploads/upl_7Hq2Wm9Zx4Lp1Vb8Rt3Yk6Nd
                    uploadOffset: 0
                    scanStatus: pending
                  - id: fil_01JABCDA0K112M3N4P5Q6R7S8T
                    name: site-survey.mp4
                    size: 12884901888
                    mediaType: video/mp4
                    uploadUrl: /api/v1/uploads/upl_2Bc5Df8Gh1Jk4Lm7Np0Qr3St
                    uploadOffset: 0
                    scanStatus: pending
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/DepositUnauthenticated' }
        '403':
          description: |
            The depositor is not allowed to deposit (`deposit-not-allowed`: eligibility is checked
            again; with an API token, `senderEmail` outside the internal domains, blocklisted or
            not matching the token's `allowedSenders`),
            an API token is used from an IP outside its `allowedCidrs` (`ip-not-allowed`, written
            to the security log), or the CSRF check of a session request failed (`csrf-invalid`).
            Since 1.1: a recipient is refused by the recipient domain rules
            (`recipient-domain-refused`), or an abuse threshold set to block is exceeded
            (`abuse-threshold-blocked`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                recipientDomainRefused:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#recipient-domain-refused
                    title: Recipient not allowed
                    status: 403
                    code: recipient-domain-refused
                    errors:
                      - { field: /recipients/1, code: domain-denied }
                abuseThresholdBlocked:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#abuse-threshold-blocked
                    title: Sending limit reached
                    status: 403
                    code: abuse-threshold-blocked
                    detail: The daily sending limit of this service is reached. Please try again tomorrow.
                depositNotAllowed:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#deposit-not-allowed
                    title: Deposit not allowed
                    status: 403
                    code: deposit-not-allowed
                ipNotAllowed:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#ip-not-allowed
                    title: Address not allowed for this token
                    status: 403
                    code: ip-not-allowed
                csrfInvalid:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
                    title: Invalid CSRF token
                    status: 403
                    code: csrf-invalid
        '409': { $ref: '#/components/responses/StateConflict' }
        '413': { $ref: '#/components/responses/TransferTooLarge' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '422':
          description: "Since 1.1. The transfer breaks a rule of its confidentiality level; each entry of `errors` names the field and the rule."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#confidentiality-rule-violated
                title: Confidentiality rule not met
                status: 422
                code: confidentiality-rule-violated
                errors:
                  - { field: /password, code: required }
                  - { field: /expiryDays, code: not-allowed, allowed: [1, 7] }
                  - { field: /recipients/0, code: internal-only }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MaintenanceMode' }
        '507': { $ref: '#/components/responses/QuotaExceeded' }
        '500': { $ref: '#/components/responses/InternalError' }

  /transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Follow a transfer as its sender
      description: |
        Returns the state of a transfer to any deposit session of the same sender (same
        address, kind and invitation) for a transfer created with a deposit session, or to the
        API token that created it for a transfer created with a token; anyone else gets `404`
        (another token of the same tenant, or a session for a token-created transfer, included).
        Used to poll antivirus progress after finalization.
        With an API token: `401` for an invalid token, then `403 ip-not-allowed` from an IP
        outside its `allowedCidrs`.
      security:
        - depositSession: []
        - apiToken: []
      responses:
        '200':
          description: Transfer state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderTransfer' }
              examples:
                perRecipientLinks:
                  summary: Transfer created from 1.1 (per-recipient links, never returned)
                  value:
                    id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                    status: available
                    senderEmail: alice@entity-a.example.com
                    recipients: [carol@customer.example.net, dave@customer.example.net]
                    expiryDays: 7
                    expiresAt: '2026-11-02T16:20:00Z'
                    passwordProtected: true
                    deleteAfterFirstDownload: false
                    recipientVerification: true
                    maxDownloads: null
                    totalBytes: 15728640
                    createdAt: '2026-10-26T16:00:00Z'
                    finalizedAt: '2026-10-26T16:20:00Z'
                    files:
                      - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                        name: plans-v3.pdf
                        size: 15728640
                        mediaType: application/pdf
