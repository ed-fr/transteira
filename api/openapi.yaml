  # ---------------------------------------------------------------------------
  # Admin - system (super admin)
  # ---------------------------------------------------------------------------
  /admin/admins:
    get:
      tags: [Admin system]
      operationId: listAdmins
      summary: List admin accounts (super admin)
      description: "Lists every admin account with role, tenant assignments and TOTP status. Reserved to the super admin."
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Admins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminList' }
              example:
                items:
                  - id: adm_01JABCG1H2J3K415M6N7P8Q9R0
                    username: admin.entity-a
                    email: admin@entity-a.example.com
                    role: delegated_admin
                    tenantIds: [ten_01JAB00000000000000ENT1TYA]
                    totpEnabled: true
                    activated: true
                    disabled: false
                    lastLoginAt: '2026-10-19T08:30:00Z'
                    createdAt: '2026-09-01T08:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin system]
      operationId: createAdmin
      summary: Create a delegated admin (super admin)
      description: |
        The account is created with a single-use activation link, valid 72 hours, returned once
        in the response (`activationUrl`) and never sent by email: the super admin hands it to the
        new admin out of band. The admin opens it, chooses a password and enrolls TOTP when it is
        required. A super admin cannot be created directly: promote an activated delegated admin
        with TOTP enabled (`updateAdmin`).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreate' }
            example:
              username: admin.entity-b
              email: admin@entity-b.example.com
              role: delegated_admin
              tenantIds: [ten_01JAB00000000000000ENT1TYB]
              requireTotp: true
      responses:
        '201':
          description: Admin created, with its activation link (shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWithActivation' }
              example:
                id: adm_01JABC17P8Q9R0S1T2V3V4W5X6
                username: admin.entity-b
                email: admin@entity-b.example.com
                role: delegated_admin
                tenantIds: [ten_01JAB00000000000000ENT1TYB]
                totpEnabled: false
                activated: false
                requireTotp: true
                disabled: false
