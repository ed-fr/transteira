        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/unlock:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      tags: [Downloads]
      operationId: unlockDownload
      summary: Unlock a password-protected transfer
      description: |
        Two independent failure counters apply, each locking for 15 minutes after 3 wrong
        passwords (`429`, with `Retry-After`):
        - **per transfer**, all client IPs combined: the transfer is locked for everyone;
        - **per client IP**, all transfers of the tenant combined: the IP is locked on every transfer.
        Each failure is written to the security log.

        On success the grant cookie `__Host-tt_dl` (valid 1 hour, bound to this transfer and
        entity) is set; a transfer without password answers `204` without cookie. The operation
        needs no session, but it is protected from cross-site use, which could otherwise burn
        the per-IP counter of a victim: the body must be JSON (a cross-site form cannot send it
        without a CORS preflight, which is never approved), and an `Origin` header other than
        `https://<entity host>` or a `Sec-Fetch-Site` other than `same-origin` gets
        `403 csrf-invalid`.

        Since 1.1, on a per-recipient link whose transfer requires recipient verification, the
        recipient must be verified first: otherwise `401 recipient-verification-required`, and
        no password attempt is counted.
      security:
        - {}
        - recipientVerification: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferPassword' }
            example: { password: correct horse battery staple }
      responses:
        '204':
          description: Unlocked; the download grant cookie is set (no cookie for a transfer without password).
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetDownloadGrantCookie' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '401':
          description: Wrong password (`transfer-password-invalid`), or, since 1.1, recipient not verified yet (`recipient-verification-required`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                wrongPassword:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-password-invalid
                    title: Wrong password
                    status: 401
                    code: transfer-password-invalid
                    attemptsRemaining: 2
                verificationRequired:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#recipient-verification-required
                    title: Recipient verification required
                    status: 401
                    code: recipient-verification-required
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429':
          description: Too many wrong passwords; locked for 15 minutes.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-locked
                title: Too many attempts
                status: 429
                code: transfer-locked
                retryAfterSeconds: 900
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [Downloads]
      operationId: downloadFile
      summary: Download one file
      description: |
        Streams the decrypted file. Always sent as an attachment
        (`Content-Disposition: attachment` with RFC 6266 `filename*`, `X-Content-Type-Options: nosniff`,
        `Content-Type: application/octet-stream`, `Content-Security-Policy: default-src 'none'; sandbox; frame-ancestors 'none'`,
        `Cache-Control: no-store`). A single byte range is supported so that download managers
        can resume, including on transfers with `deleteAfterFirstDownload`; a request for
        several ranges at once gets the full file with `200`, and a range outside the file
        `416 range-not-satisfiable`. The strong `ETag` is the SHA-256 of the file, so that
        `If-Range` resumes only an unchanged file and `If-None-Match` is honoured.

        Downloads are cut when the client stops reading for `TT_DOWNLOAD_IDLE_TIMEOUT` (60 s by
        default), and simultaneous streams are capped: 2 per client per transfer, 4 per transfer
        across all clients and 8 per client across all transfers of the tenant, where a client is
        an IP address (an IPv6 address counts as its /64). Above a cap the answer is `429` with
        `Retry-After`.

        The transfer counts as downloaded once every byte of every file has been served at least
        once (the union of served ranges is tracked on disk, never per chunk in the database), or
        once the archive has been streamed to its end. This triggers the acknowledgement email to
        the sender. Since 1.1, with per-recipient links, this is tracked per recipient: the
        acknowledgement names the recipient, and `deleteAfterFirstDownload` deletes the transfer
        once every recipient has completed at least one download. With `deleteAfterFirstDownload`, the transfer is then deleted (with crypto-erase)
        after a grace period (`TT_DELETE_AFTER_DOWNLOAD_GRACE`, 15 minutes by default) so that an
        interrupted final range can still be resumed.

        Since 1.1: on a per-recipient link the download is recorded for that recipient (per-file
        tracking, first-download receipt naming the recipient); a transfer requiring recipient
        verification answers `401 recipient-verification-required` until the recipient is
        verified on this browser; once `maxDownloads` download starts are reached, a new start
        gets `410 max-downloads-reached` while a resumed range of a download already started is
        still served during the grace period.
      security:
        - {}
        - downloadGrant: []
        - recipientVerification: []
        - downloadGrant: []
          recipientVerification: []
      parameters:
        - name: Range
          in: header
          description: "Optional single byte range (RFC 9110) to resume a download. Several ranges are not supported: the full file is then served with `200`."
          required: false
          schema: { type: string }
          example: bytes=1048576-
      responses:
        '200':
          description: Full file content.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDispositionAttachment' }
            Content-Length: { $ref: '#/components/headers/ContentLength' }
            Accept-Ranges: { $ref: '#/components/headers/AcceptRangesBytes' }
            ETag: { $ref: '#/components/headers/FileETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Content-Security-Policy: { $ref: '#/components/headers/SandboxCSP' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
              example: "<binary data>"
        '206':
          description: Partial content.
          headers:
            Content-Range:
              schema: { type: string }
              example: bytes 1048576-15728639/15728640
            Content-Length: { $ref: '#/components/headers/ContentLength' }
            Content-Disposition: { $ref: '#/components/headers/ContentDispositionAttachment' }
            Accept-Ranges: { $ref: '#/components/headers/AcceptRangesBytes' }
            ETag: { $ref: '#/components/headers/FileETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Content-Security-Policy: { $ref: '#/components/headers/SandboxCSP' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
              example: "<binary data>"
        '401': { $ref: '#/components/responses/DownloadLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/DownloadGone' }
        '416':
          description: The requested range is outside the file; `Content-Range` gives its size.
          headers:
            Content-Range:
              schema: { type: string }
              example: bytes */15728640
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#range-not-satisfiable
                title: Range not satisfiable
                status: 416
                code: range-not-satisfiable
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/TooManyStreams' }
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/archive:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    get:
      tags: [Downloads]
      operationId: downloadArchive
      summary: Download all files as a ZIP archive
      description: |
        Generates a ZIP64 archive on the fly in store mode (no compression, no temporary copy
        on disk). The `Content-Length` is computed in advance. File names inside the archive are
        sanitised (no absolute paths, no `..`, no control or bidirectional characters).
        Range requests are not supported on the archive. Sent as an attachment
        (`Content-Disposition: attachment; filename="transfer.zip"`, `Content-Type:
        application/zip`, `X-Content-Type-Options: nosniff`, `Content-Security-Policy: default-src 'none'; sandbox; frame-ancestors 'none'`,
        `Cache-Control: no-store`). An archive streamed to its end counts as a complete download.
        The stream is cut when the client stops reading for `TT_DOWNLOAD_IDLE_TIMEOUT`, and
        simultaneous streams are capped as for `downloadFile` (2 per client per transfer, 4 per
        transfer, 8 per client per tenant; `429` with `Retry-After`). Since 1.1, files keep their
        folder `path` inside the archive (duplicate names resolved per folder), and the
        per-recipient tracking, recipient verification and `maxDownloads` rules of
        `downloadFile` apply (the archive counts as one download start).
      security:
        - {}
        - downloadGrant: []
        - recipientVerification: []
        - downloadGrant: []
          recipientVerification: []
      responses:
        '200':
          description: ZIP stream.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDispositionAttachment' }
            Content-Length: { $ref: '#/components/headers/ContentLength' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Content-Security-Policy: { $ref: '#/components/headers/SandboxCSP' }
          content:
            application/zip:
              schema: { type: string, format: binary }
              example: "<binary data>"
        '401': { $ref: '#/components/responses/DownloadLocked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/DownloadGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/TooManyStreams' }
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/verification:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      tags: [Downloads]
      operationId: startRecipientVerification
      summary: Send a verification code to the recipient of a link
      description: |
        Since 1.1. For a per-recipient link whose transfer requires recipient verification (and
        before any reply, see `startTransferReply`), sends a 6-digit code to the address the
        link was issued for, through the tenant SMTP server (template
        `recipient-verification-code`). The address is never taken from the request and never
        revealed: the answer only carries a masked form (`c***@customer.example.net`).

        Same rules as the sender codes: valid 15 minutes, 2 wrong attempts, then a new code must
        be requested. Recipient codes have their own budget, separate from the deposit codes: at
        most 5 codes per hour per recipient address and link; the budget of 20 codes per hour per
        client IP is shared with every other code (`429 rate-limited`, written to the security
        log). Requesting a new code
        invalidates the previous one. A link whose recipient is already verified on this browser
        (valid `__Host-tt_rv` cookie) answers `204` without sending anything. A link that does
        not need any verification (a link created before 1.1, or a transfer without the option
        when no reply is wanted) gets `409 state-conflict`.

        The operation needs no session but is protected from cross-site use, like
        `unlockDownload`: the body must be JSON, and an `Origin` other than
        `https://<entity host>` or a `Sec-Fetch-Site` other than `same-origin` gets
        `403 csrf-invalid`.
      security:
        - {}
        - recipientVerification: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipientVerificationStart' }
            examples:
              download:
                summary: Verification before downloading
                value: { purpose: download }
              reply:
                summary: Verification before replying to the transfer
                value: { purpose: reply, language: en }
      responses:
        '202':
          description: A code has been sent to the recipient address of the link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipientVerificationChallenge' }
              example:
                emailMasked: c***@customer.example.net
                expiresAt: '2026-10-27T09:15:00Z'
                attemptsRemaining: 2
        '204':
          description: The recipient is already verified on this browser; no code was sent.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: The code cannot be sent (no SMTP server configured for the tenant, mail queue shut down).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#mail-unavailable
                title: Email cannot be sent
                status: 503
                code: mail-unavailable
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/verification/confirm:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      tags: [Downloads]
      operationId: confirmRecipientVerification
      summary: Submit the recipient verification code
      description: |
        Since 1.1. Validates the code sent by `startRecipientVerification`. On success the
        recipient link is marked verified (`recipient.verified` in the audit log) and the
        technical cookie `__Host-tt_rv` is set (or extended with this link). The cookie is
        stateless and MAC-signed with a key derived from the master key, like `__Host-tt_dl`:
        each entry binds the link identifier, the tenant identifier and an expiry 1 hour ahead,
        so no server-side record is needed. It opens the download page, the files, the archive and the reply of this
        link on this browser only. A link forwarded to someone else therefore stays useless
        without access to the recipient mailbox.

        After 2 wrong codes the code is invalidated (`410 verification-exhausted`) and a new one
        must be requested. Every wrong code is written to the security log
        (`verification_code_invalid`, purpose `recipient`). Protected from cross-site use like
        `startRecipientVerification` (`403 csrf-invalid`).
      security:
        - {}
        - recipientVerification: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCode' }
            example: { code: '482913' }
      responses:
        '204':
          description: Code accepted; the recipient verification cookie is set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRecipientVerificationCookie' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No code is pending for this link (never requested, already used or expired); request one first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                title: Operation not allowed in the current state
                status: 409
                code: state-conflict
        '410':
          description: |
            Code invalidated after too many wrong attempts (`verification-exhausted`), or transfer
            no longer available (`transfer-gone`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                verificationExhausted:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#verification-exhausted
                    title: Verification code invalidated
                    status: 410
                    code: verification-exhausted
                transferGone:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-gone
                    title: Transfer no longer available
                    status: 410
                    code: transfer-gone
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '422':
          description: Wrong code; at least one attempt remains.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#verification-code-invalid
                title: Invalid verification code
                status: 422
                code: verification-code-invalid
                attemptsRemaining: 1
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/abuse-reports:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      tags: [Downloads]
      operationId: reportAbuse
      summary: Report an abuse on a received transfer
      description: |
        Since 1.1. The "Report an abuse" button of the download page. Records a report for the
        delegated admins of the tenant (`abuse.reported` in the audit log), who are alerted by
        mail (template `abuse-report`) and by the tenant webhooks (event `abuse.reported`). The
        report names the transfer; the sender is never told. The reporter address is recorded
        only when a valid `__Host-tt_rv` entry for this link proves it (`reporterVerified`);
        otherwise the report only says it came through the link of recipient number n
        (`recipientIndex`), unverified. `message` is plain text (at most 1000 characters):
        control, invisible and bidirectional characters are removed and it is never interpreted
        as HTML.

        Works on any known link of an available transfer, password protected or not, without
        unlocking or verification. Rate limited: 3 reports per link per day (keyed on the link)
        and 5 per client IP per hour (`429 rate-limited`, written to the security log).
        Protected from cross-site use like `unlockDownload` (JSON body, `Origin` and
        `Sec-Fetch-Site` checks, `403 csrf-invalid`).
      security:
        - {}
        - recipientVerification: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbuseReportCreate' }
            example: { category: phishing, message: The archive contains a fake login page. }
      responses:
        '202':
          description: Report recorded; the administrators of the entity are alerted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /downloads/{linkToken}/reply:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      tags: [Downloads]
      operationId: startTransferReply
      summary: Reply to a transfer by sending files back to its sender
      description: |
        Since 1.1. Opens a deposit session of kind `reply` for the recipient of a per-recipient
        link, whose single recipient is the original sender: the recipient then creates a
        transfer with `POST /transfers` (its `recipients` are ignored) and uploads with tus as any
        depositor. Requirements, checked in this order:

        1. the tenant allows replies (`allowTransferReply`), otherwise `403 reply-not-allowed`;
           a link created before 1.1 (shared by every recipient) cannot be replied to, and a
           reply transfer is never replied to (no reply to a reply);
        2. the recipient proved their address on this browser (`__Host-tt_rv`, see
           `startRecipientVerification` with purpose `reply`), whatever the transfer options:
           otherwise `401 recipient-verification-required`;
        3. the recipient address and its domain are not blocklisted
           (`403 deposit-not-allowed`, reason in the security log);
        4. the original transfer is still available (`410 transfer-gone`).

        The session lives at most as long as the original transfer, and the reply transfer is
        subject to the external depositor rules: the external quotas and the abuse thresholds of
        the tenant, the per-transfer limit, the storage quota, the blocklist and the antivirus.
        Its `replyToTransferId` names the original transfer, whose availability is checked again
        when the reply transfer is created and when it is finalized (`410 transfer-gone`); it is
        audited as `transfer.reply_created` when created. Protected from cross-site use like
        `unlockDownload` (`403 csrf-invalid`). Refused during maintenance (`503 maintenance`).
      security:
        - recipientVerification: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferReplyStart' }
            example: {}
      responses:
        '201':
          description: Reply deposit session created.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetDepositCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositSession' }
              example:
                email: carol@customer.example.net
                kind: reply
                csrfToken: csrf_Rp4Lm8Zx1Vb6Kd3Q
                expiresAt: '2026-10-27T13:00:00Z'
                limits: { maxTransferBytes: 21474836480, expiryDays: [1, 7] }
                canInvite: false
                reply:
                  recipient: alice@entity-a.example.com
                  transferExpiresAt: '2026-11-02T16:20:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: The recipient has not proved their address on this browser.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#recipient-verification-required
                title: Recipient verification required
                status: 401
                code: recipient-verification-required
        '403':
          description: |
            Replies are disabled for this entity or impossible on this link (`reply-not-allowed`),
            the recipient address is blocklisted (`deposit-not-allowed`), or the request is
            cross-site (`csrf-invalid`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                replyNotAllowed:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#reply-not-allowed
                    title: Reply not allowed
                    status: 403
                    code: reply-not-allowed
                depositNotAllowed:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#deposit-not-allowed
                    title: Deposit not allowed
                    status: 403
                    code: deposit-not-allowed
                csrfInvalid:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
                    title: Invalid CSRF token
                    status: 403
                    code: csrf-invalid
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TransferGone' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/MaintenanceMode' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # My transfers (since 1.1)
  # ---------------------------------------------------------------------------
  /me/access-links:
    post:
      tags: [My transfers]
      operationId: requestMyTransfersLink
      summary: Ask for a "My transfers" access link by mail
      description: |
        Since 1.1. Always answers `202`, whatever the address, so that neither the answer nor its
        timing tells whether an address is known (no enumeration): the request path does the same
        work for every address (validation, rate limits, enqueueing) and answers; the lookup of
        the address, the creation of the link, the audit and the mail are done afterwards by an
        asynchronous worker. Only when the address is verified for this tenant (it entered a code
        at least once and was used within 12 months) and not blocklisted, the worker mails a
        one-time access link (template `my-transfers-link`): `https://<entity host>/me#mta_...`,
        the token in the fragment so that it never reaches a server log. The token is valid 15
        minutes, single use, and stored hashed; requesting a new link does not revoke the
        previous one before its expiry. Audited as `my_transfers.link_requested` only when a
        link is sent.

        Rate limits, applied identically whether the address is known or not: 5 requests per hour
        per address (keyed by an HMAC of the normalised address; beyond, requests are silently
        dropped, still `202`) and 20 per hour per client IP (`429 rate-limited`, written to the
        security log). Protected from cross-site use like `unlockDownload` (JSON body, `Origin`
        and `Sec-Fetch-Site` checks, `403 csrf-invalid`).
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyTransfersLinkRequest' }
            example: { email: alice@entity-a.example.com, language: en }
      responses:
        '202':
          description: Request accepted. A link is mailed only if the address is verified for this entity; the answer is the same in every case.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Mail cannot be sent for this entity at all (no SMTP server configured, mail queue shut down); the answer does not depend on the address.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#mail-unavailable
                title: Email cannot be sent
                status: 503
                code: mail-unavailable
        '500': { $ref: '#/components/responses/InternalError' }

  /me/sessions:
    post:
      tags: [My transfers]
      operationId: startMyTransfersSession
      summary: Open a "My transfers" session from an access link
      description: |
        Since 1.1. Exchanges the token of a mailed access link for a "My transfers" session:
        cookie `__Host-tt_me`, valid 1 hour (absolute), bound to the tenant and the address, with
        its CSRF token. The token is consumed. An unknown, expired or already used token, or one
        of another tenant, gets the same `410 access-link-invalid`, written to the security log
        (`access_link_invalid`); repeated failures from one IP get `429 rate-limited`. Audited as
        `my_transfers.signed_in`. Protected from cross-site use (`Origin` and `Sec-Fetch-Site`
        checks, `403 csrf-invalid`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyTransfersSessionStart' }
            example: { token: mta_Hq7Lm2Zx9Vb4Kd1RTp6Yw3Nc8 }
      responses:
        '201':
          description: Session opened.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetMyTransfersCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTransfersSession' }
              example:
                email: alice@entity-a.example.com
                csrfToken: csrf_Me5Lm8Zx2Vb7Kd0Q
                expiresAt: '2026-10-27T10:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '410':
          description: The access link is unknown, expired or already used.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#access-link-invalid
                title: Access link no longer valid
                status: 410
                code: access-link-invalid
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/sessions/current:
    get:
      tags: [My transfers]
      operationId: getCurrentMyTransfersSession
      summary: Current "My transfers" session
      description: "Since 1.1. Returns the address, expiry and CSRF token of the current \"My transfers\" session; used by the web interface after a page reload."
      security:
        - myTransfersSession: []
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTransfersSession' }
              example:
                email: alice@entity-a.example.com
                csrfToken: csrf_Me5Lm8Zx2Vb7Kd0Q
                expiresAt: '2026-10-27T10:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [My transfers]
      operationId: endMyTransfersSession
      summary: End the "My transfers" session
      description: "Since 1.1. Revokes the \"My transfers\" session server side and clears its cookie."
      security:
        - myTransfersSession: []
          csrfToken: []
      responses:
        '204':
          description: Session ended; cookie cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearMyTransfersCookie' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/transfers:
    get:
      tags: [My transfers]
      operationId: listMyTransfers
      summary: List my transfers in progress
      description: |
        Since 1.1. Lists, most recent first, the transfers of this tenant sent by the session
        address with a deposit session (internal, from outside, through an invitation or as a
        reply) that are still in progress: `scanning` or `available`. Transfers created with an
        API token belong to the token and are never listed. A malformed `cursor` is
        `400 validation-failed`.
      security:
        - myTransfersSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Transfers in progress (most recent first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTransferList' }
              example:
                items:
                  - id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                    status: available
                    recipients: [carol@customer.example.net, dave@customer.example.net]
                    fileCount: 2
                    totalBytes: 12900630528
                    expiryDays: 7
                    createdAt: '2026-10-26T16:00:00Z'
                    expiresAt: '2026-11-02T16:20:00Z'
                    passwordProtected: true
                    recipientVerification: true
                    confidentialityLevel: { key: confidential, label: Confidential }
                    downloadedBy: 1
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    get:
      tags: [My transfers]
      operationId: getMyTransfer
      summary: Details of one of my transfers, with per-recipient tracking
      description: |
        Since 1.1. Returns a transfer of the session address (same scope as `listMyTransfers`,
        `404` for any other, including a transfer of the same address in another tenant), with
        its files and, for a transfer with per-recipient links, which files each recipient
        downloaded and when. Download links are never returned.
      security:
        - myTransfersSession: []
      responses:
        '200':
          description: Transfer details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTransferDetail' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: available
                recipients: [carol@customer.example.net, dave@customer.example.net]
                fileCount: 2
                totalBytes: 12900630528
                expiryDays: 7
                createdAt: '2026-10-26T16:00:00Z'
                expiresAt: '2026-11-02T16:20:00Z'
                passwordProtected: true
                recipientVerification: true
                confidentialityLevel: { key: confidential, label: Confidential }
                downloadedBy: 1
                message: Here are the plans discussed this morning.
                deleteAfterFirstDownload: false
                maxDownloads: null
                downloadCount: 2
                extendableTo: '2026-11-26T09:00:00Z'
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    path: plans
                    size: 15728640
                    sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                    scanStatus: clean
                  - id: fil_01JABCDA0K112M3N4P5Q6R7S8T
                    name: site-survey.mp4
                    size: 12884901888
                    sha256: b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
                    scanStatus: not_scanned_too_large
                recipientTracking:
                  - email: carol@customer.example.net
                    verifiedAt: '2026-10-26T17:01:00Z'
                    firstDownloadedAt: '2026-10-26T17:02:00Z'
                    lastDownloadedAt: '2026-10-26T17:30:00Z'
                    downloads:
                      - { fileId: fil_01JABCD9F1A2B3C4D5E6F7G8H9, firstAt: '2026-10-26T17:02:00Z', lastAt: '2026-10-26T17:30:00Z', count: 2 }
                  - email: dave@customer.example.net
                    verifiedAt: null
                    firstDownloadedAt: null
                    lastDownloadedAt: null
                    downloads: []
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [My transfers]
      operationId: deleteMyTransfer
      summary: Delete one of my transfers before expiry
      description: |
        Since 1.1. Deletes a transfer of the session address with crypto-erase (file keys
        destroyed, then the files), exactly like an admin deletion: its links answer
        `410 transfer-gone`, the space is freed from the quota, a transfer still being scanned is
        withdrawn and never made available. Audited as `transfer.deleted` with the sender as
        actor. A transfer already ended is a no-op answered `204`.
      security:
        - myTransfersSession: []
          csrfToken: []
      responses:
        '204': { description: "Transfer deleted, or already ended (no-op)." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me/transfers/{transferId}/extension:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [My transfers]
      operationId: extendMyTransfer
      summary: Extend the validity of one of my transfers
      description: |
        Since 1.1. Sets the expiry of an `available` transfer of the session address to now plus
        `expiryDays` (`409 state-conflict` in any other state). `expiryDays` must be one of the
        durations allowed for the transfer: the tenant durations restricted by the rules of the
        confidentiality level **snapshotted** on the transfer at its creation
        (`400 validation-failed`, field code `not-allowed`, with `allowed`). The new expiry can
        only move forward: a value that would shorten the current expiry is refused the same way.
        A transfer may be extended any number of times, but its total lifetime never exceeds 90
        days from its creation: an extension beyond gets `409 extension-limit-reached`
        (`extendableTo` tells the latest expiry possible). A transfer whose maximum number of
        downloads is reached, or that is due for deletion after its downloads, cannot be extended
        (`409 state-conflict`). An extension re-arms the expiry reminder: one reminder per expiry
        date, the day before the new expiry, to the recipients who have not downloaded yet (same
        36-hour rule). Audited as `transfer.extended` with the old and new expiry and the number
        of extensions.
      security:
        - myTransfersSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferExtension' }
            example: { expiryDays: 30 }
      responses:
        '200':
          description: Transfer with its new expiry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTransferDetail' }
              example:
                id: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
                status: available
                recipients: [carol@customer.example.net]
                fileCount: 1
                totalBytes: 15728640
                expiryDays: 7
                createdAt: '2026-10-26T16:00:00Z'
                expiresAt: '2026-11-26T09:00:00Z'
                passwordProtected: false
                recipientVerification: false
                downloadedBy: 0
                deleteAfterFirstDownload: false
                maxDownloads: null
                downloadCount: 0
                extendableTo: '2026-11-26T09:00:00Z'
                files:
                  - id: fil_01JABCD9F1A2B3C4D5E6F7G8H9
                    name: plans-v3.pdf
                    size: 15728640
                    sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                    scanStatus: clean
                recipientTracking:
                  - email: carol@customer.example.net
                    verifiedAt: null
                    firstDownloadedAt: null
                    lastDownloadedAt: null
                    downloads: []
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "The transfer is not `available` or can no longer be extended (`state-conflict`), or the extension would take its total lifetime beyond 90 days from its creation (`extension-limit-reached`)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                stateConflict:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                    title: Operation not allowed in the current state
                    status: 409
                    code: state-conflict
                extensionLimitReached:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#extension-limit-reached
                    title: Extension limit reached
                    status: 409
                    code: extension-limit-reached
                    detail: A transfer cannot stay available more than 90 days after its creation.
        '421': { $ref: '#/components/responses/UnknownTenant' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Admin auth
  # ---------------------------------------------------------------------------
  /admin/setup:
    get:
      tags: [Admin auth]
      operationId: getSetupStatus
      summary: Is first-run setup required?
      description: "Tells the web interface whether the first-run setup (creation of the super admin) still has to be done."
      security: []
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
              example: { setupRequired: true }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin auth]
      operationId: createSuperAdmin
      summary: First-run setup - create the super admin
      description: |
        Only available while no admin exists. The setup token is always required (it protects the
        window between deployment and setup): `TT_SETUP_TOKEN` when configured, otherwise a random
        token generated at each start while no admin exists and written once to the application
        log. Returns a pre-auth session in `totp_enrollment_required` state: no other admin
        endpoint is usable until TOTP is confirmed. Refused cross-site (`Origin` and
        `Sec-Fetch-Site` checks, `403 csrf-invalid`) and rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
            example:
              username: superadmin
              email: it-admin@example.com
              password: a-long-passphrase-of-at-least-12-characters
              setupToken: stp_Kd82Lq0Zm4Xv7Bn1
      responses:
        '201':
          description: Super admin created; TOTP enrollment must follow.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/TransTeira:superadmin?secret=JBSWY3DPEHPK3PXP&issuer=TransTeira
                qrCodePng: iVBORw0KGgoAAAANSUhEUgAA...
                csrfToken: csrf_Ab12Cd34Ef56Gh78
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: Invalid setup token (`setup-token-invalid`), or a cross-site request (`csrf-invalid`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                setupTokenInvalid:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#setup-token-invalid
                    title: Invalid setup token
                    status: 403
                    code: setup-token-invalid
                csrfInvalid:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
                    title: Invalid CSRF token
                    status: 403
                    code: csrf-invalid
        '409':
          description: Setup already completed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#setup-already-done
                title: Setup already completed
                status: 409
                code: setup-already-done
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/auth/login:
    post:
      tags: [Admin auth]
      operationId: adminLogin
      summary: First factor - username and password
      description: |
        On success, sets a pre-auth session cookie whose `status` tells the next step. A full
        session is never granted on password alone. Failures are rate limited and written to the
        security log; the response does not reveal whether the username exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: admin.entity-a, password: a-long-passphrase-of-at-least-12-characters }
      responses:
        '200':
          description: Password accepted; second factor or enrollment required.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginState' }
              example: { status: totp_required, csrfToken: csrf_Ab12Cd34Ef56Gh78 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/auth/totp:
    post:
      tags: [Admin auth]
      operationId: adminVerifyTotp
      summary: Second factor - TOTP code or recovery code
      description: "Validates the second factor (6-digit TOTP code, or a single-use recovery code) of a pre-authenticated admin session and turns it into a full session. Failures are rate limited and written to the security log."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
            examples:
              totp: { value: { code: '204816' } }
              recovery: { value: { recoveryCode: rc-7KQ2-9XLM-4PZD } }
      responses:
        '200':
          description: Authenticated; the session cookie is rotated.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginState' }
              example: { status: authenticated, csrfToken: csrf_Zx98Yw76Vu54Ts32 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/auth/logout:
    post:
      tags: [Admin auth]
      operationId: adminLogout
      summary: Log out
      description: "Revokes the admin session server side and clears the session cookie."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204':
          description: Session revoked server side and cookie cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearAdminCookie' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me:
    get:
      tags: [Admin auth]
      operationId: getAdminMe
      summary: Current admin profile
      description: "Returns the profile of the authenticated admin, their role, the tenants they may manage (every tenant for a super admin) and the CSRF token for subsequent requests."
      security:
        - adminSession: []
      responses:
        '200':
          description: Profile, role and assigned tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMe' }
              example:
                id: adm_01JABCG1H2J3K415M6N7P8Q9R0
                username: admin.entity-a
                email: admin@entity-a.example.com
                role: delegated_admin
                totpEnabled: true
                tenants:
                  - { id: ten_01JAB00000000000000ENT1TYA, name: Entity A, fqdn: transfer.entity-a.example.com }
                csrfToken: csrf_Zx98Yw76Vu54Ts32
                language: en
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me/password:
    put:
      tags: [Admin auth]
      operationId: changeAdminPassword
      summary: Change own password
      description: Other sessions of the admin are revoked.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
            example:
              currentPassword: a-long-passphrase-of-at-least-12-characters
              newPassword: another-even-longer-passphrase-2026
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me/totp:
    post:
      tags: [Admin auth]
      operationId: startTotpEnrollment
      summary: Start (or restart) TOTP enrollment
      description: |
        Generates a new TOTP secret for the admin. The secret only becomes active once confirmed
        with a valid code; the TOTP in use, if any, stays active until then.

        From an authenticated session, enrolling (first enrollment or replacement of the TOTP in
        use) requires the current password in the body (`400 validation-failed` when it is
        missing, `401 invalid-credentials` when it is wrong), counted on the login limits like a
        login (`429 rate-limited`), so that a stolen session alone cannot bind or swap the
        second factor. Only the mandatory enrollment of a pre-auth session in state
        `totp_enrollment_required`, whose password was just proven, needs no request body. The
        new secret must be confirmed within 15 minutes. Confirming a re-enrollment revokes the
        admin's other sessions.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpReenrollment' }
            example: { currentPassword: a-long-passphrase-of-at-least-12-characters }
      responses:
        '200':
          description: New TOTP secret to confirm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/TransTeira:admin.entity-a?secret=JBSWY3DPEHPK3PXP&issuer=TransTeira
                qrCodePng: iVBORw0KGgoAAAANSUhEUgAA...
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            `unauthenticated`: no session, or a session whose state does not open the enrollment.
            `invalid-credentials`: wrong current password from an authenticated session
            (written to the security log).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                unauthenticated:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unauthenticated
                    title: Authentication required
                    status: 401
                    code: unauthenticated
                invalidCredentials:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invalid-credentials
                    title: Invalid credentials
                    status: 401
                    code: invalid-credentials
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin auth]
      operationId: disableTotp
      summary: Disable TOTP (delegated admins only)
      description: Refused for the super admin, for whom TOTP is mandatory, and when TOTP is required for the admin. Requires the current password. Revokes the admin's other sessions.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
            example: { currentPassword: a-long-passphrase-of-at-least-12-characters }
      responses:
        '204': { description: TOTP disabled. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/me/totp/confirm:
    post:
      tags: [Admin auth]
      operationId: confirmTotpEnrollment
      summary: Confirm TOTP enrollment
      description: |
        Confirms the pending secret with a valid code. Returns single-use recovery codes, shown
        once; they replace the previous ones. When called from a pre-auth session (first-run
        setup or mandatory enrollment), the session becomes fully authenticated (new cookie and
        CSRF token). When TOTP was already enabled (re-enrollment), the admin's other sessions are
        revoked.

        The pending secret expires 15 minutes after the enrollment started (`409
        state-conflict`, like a confirmation without an enrollment started: restart it). Every
        attempt is counted on the second factor limits, like a login: 5 wrong codes for an admin
        within 15 minutes, from any IP, lock their second factor for 15 minutes, and the IP
        limits of the login apply too (`429 rate-limited`). Every wrong code is written to the
        security log (`admin_login_failed reason="totp"`).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
            example: { code: '204816' }
      responses:
        '200':
          description: TOTP enabled.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAdminCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpConfirmed' }
              example:
                recoveryCodes: [rc-7KQ2-9XLM-4PZD, rc-2HDF-8WQA-1MNB, rc-5TRE-3ZXC-0LKJ, rc-8YUI-6OPA-2SDF, rc-4GHJ-1KLZ-7XCV, rc-9BNM-5QWE-3RTY, rc-0UIO-2PAS-8DFG, rc-6HJK-4LZX-1CVB]
                csrfToken: csrf_Zx98Yw76Vu54Ts32
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Admin - tenants
  # ---------------------------------------------------------------------------
  /admin/tenants:
    get:
      tags: [Admin tenants]
      operationId: listTenants
      summary: List tenants visible to the admin
      description: |
        The super admin sees every tenant, page by page, including those being deleted
        (`status: deleting`); a delegated admin sees the active tenants it is assigned to, in one
        page. A malformed `cursor` is refused with `400 validation-failed`.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantList' }
              example:
                items:
                  - id: ten_01JAB00000000000000ENT1TYA
                    name: Entity A
                    fqdn: transfer.entity-a.example.com
                    defaultLanguage: fr
                    maxTransferBytes: 21474836480
                    maxTransferCeiling: 21474836480
                    status: active
                    storageQuotaBytes: 1099511627776
                    storageUsedBytes: 274877906944
                    createdAt: '2026-09-01T08:00:00Z'
                    updatedAt: '2026-10-01T08:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin tenants]
      operationId: createTenant
      summary: Create a tenant (super admin)
      description: |
        Creates a tenant with its FQDN, default language, storage quota and per-transfer limit
        (reserved to the super admin). The tenant starts with the default branding; until
        customised, its email templates are the built-in ones and it has no legal texts. The FQDN
        must be unique and can never be an admin host (`TT_ADMIN_HOSTS`): such an FQDN is refused
        with `400 validation-failed` on `/fqdn`, an FQDN already used with `409 already-exists`.
        The limit and its ceiling are set in one step: `maxTransferCeiling` defaults to
        `maxTransferBytes`, and `maxTransferBytes` to `maxTransferCeiling` when it is given, else
        20 GiB. A `maxTransferBytes` above `maxTransferCeiling` is refused with
        `400 validation-failed` on `/maxTransferBytes`.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
            example:
              name: Entity B
              fqdn: transfer.entity-b.example.com
              defaultLanguage: en
              storageQuotaBytes: 549755813888
              maxTransferBytes: 10737418240
              maxTransferCeiling: 10737418240
      responses:
        '201':
          description: Tenant created (default branding; built-in templates; no legal texts).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
              example:
                id: ten_01JAB00000000000000ENT1TYB
                name: Entity B
                fqdn: transfer.entity-b.example.com
                defaultLanguage: en
                maxTransferBytes: 10737418240
                maxTransferCeiling: 10737418240
                status: active
                storageQuotaBytes: 549755813888
                storageUsedBytes: 0
                createdAt: '2026-10-19T16:00:00Z'
                updatedAt: '2026-10-19T16:00:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getTenant
      summary: Tenant general settings
      description: |
        Returns the general settings of a tenant within the admin scope, including quota usage.
        A tenant outside the scope of a delegated admin answers `404`, exactly like an unknown
        one. Only the super admin reaches a tenant being deleted (`status: deleting`).
      security:
        - adminSession: []
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
              example:
                id: ten_01JAB00000000000000ENT1TYA
                name: Entity A
                fqdn: transfer.entity-a.example.com
                defaultLanguage: fr
                maxTransferBytes: 21474836480
                maxTransferCeiling: 21474836480
                status: active
                storageQuotaBytes: 1099511627776
                storageUsedBytes: 274877906944
                createdAt: '2026-09-01T08:00:00Z'
                updatedAt: '2026-10-01T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin tenants]
      operationId: updateTenant
      summary: Update tenant general settings
      description: |
        JSON Merge Patch semantics (RFC 7396): an absent field is left unchanged. No field of
        this resource can be removed: `null` on any of them is refused with
        `400 validation-failed` naming the field (for example `/name`), and changes nothing.

        The super admin may change every field. The FQDN must stay unique (`409 already-exists`)
        and can never be an admin host (`TT_ADMIN_HOSTS`, `400 validation-failed` on `/fqdn`).
        Raising `maxTransferBytes` above the ceiling without a new `maxTransferCeiling` raises the
        ceiling with it; lowering `maxTransferCeiling` below `maxTransferBytes` lowers the limit
        too; giving both with `maxTransferBytes` above `maxTransferCeiling` is `400`.

        A delegated admin may only change `defaultLanguage`, set `maxTransferBytes` at most to
        `maxTransferCeiling` (the ceiling set by the super admin) and, since 1.1, switch
        `allowRemoteInternalDeposit`, `allowTransferReply` and `webhookIncludeAddresses`. Changing `name`, `fqdn`,
        `storageQuotaBytes`, `maxTransferCeiling` or `antivirusEnabled`, or setting
        `maxTransferBytes` above the ceiling, is refused with `403 forbidden` and changes nothing.

        Since 1.1, `antivirusEnabled` (super admin only) turns the antivirus analysis of the
        tenant off or on again; it applies to files finalized afterwards (files already waiting
        for the engine keep waiting, and re-enabling never rescans past files), and is audited
        as `tenant.antivirus_disabled` or `tenant.antivirus_enabled`. `antivirusEffective` (read
        only) tells whether files of the tenant are really analysed: false when the tenant flag
        is off or the instance runs with `TT_ANTIVIRUS_ENGINE=none`.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TenantUpdate' }
            examples:
              delegated:
                summary: Changes allowed to a delegated admin
                value: { defaultLanguage: en, maxTransferBytes: 5368709120, allowTransferReply: true }
              antivirus:
                summary: Super admin disabling the antivirus of a tenant (since 1.1)
                value: { antivirusEnabled: false }
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
              example:
                id: ten_01JAB00000000000000ENT1TYA
                name: Entity A
                fqdn: transfer.entity-a.example.com
                defaultLanguage: en
                maxTransferBytes: 5368709120
                maxTransferCeiling: 21474836480
                status: active
                storageQuotaBytes: 1099511627776
                storageUsedBytes: 274877906944
                createdAt: '2026-09-01T08:00:00Z'
                updatedAt: '2026-10-19T16:05:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyExists' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin tenants]
      operationId: deleteTenant
      summary: Delete a tenant and all its data (super admin)
      description: |
        Irreversible (reserved to the super admin). The tenant name must be repeated as
        confirmation (`400 validation-failed` on `confirm` otherwise). The tenant first moves to
        the `deleting` status: its FQDN stops being served and no further change is accepted. Then
        every transfer is crypto-erased (file keys destroyed, then the files), the remaining keys
        (SMTP password, tokens) are destroyed, the tenant row is deleted with every verified
        address, invitation, token, template and setting, and the tenant directory (files,
        branding images) is removed. Audit and security log entries are kept until their 12-month
        retention expires.

        The request answers `204` once everything is erased. The deletion is resumable: when it
        fails midway (`500 internal-error`), the tenant stays `deleting` (visible to the super
        admin only) and the periodic cleanup task completes it; repeating the request resumes it
        at once, from where it stopped.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - name: confirm
          in: query
          required: true
          description: Exact tenant name.
          schema: { type: string }
          example: Entity B
      responses:
        '204': { description: Tenant and all its data deleted. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/branding:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getBranding
      summary: Branding (colours, images)
      description: "Returns the colours of the tenant, whether custom images are configured, and the RGAA contrast diagnostics of the colours."
      security:
        - adminSession: []
      responses:
        '200':
          description: Branding with RGAA contrast diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branding' }
              example:
                primaryColor: '#0B5FFF'
                accentColor: '#00875A'
                hasLogo: true
                hasBackground: false
                contrast:
                  - { pair: primary-on-light, ratio: 5.1, level: AA }
                  - { pair: accent-on-light, ratio: 4.6, level: AA }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateBranding
      summary: Update colours
      description: |
        Colours are always saved; the response contains contrast diagnostics (`level: fail` when
        below RGAA/WCAG AA 4.5:1) so that the UI can warn the admin. The `contrast` array is
        designed to also cover the V1.1 dark theme (pairs `*-on-dark`).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandingUpdate' }
            example: { primaryColor: '#7FB3FF', accentColor: '#00875A' }
      responses:
        '200':
          description: Saved, with diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branding' }
              example:
                primaryColor: '#7FB3FF'
                accentColor: '#00875A'
                hasLogo: true
                hasBackground: false
                contrast:
                  - { pair: primary-on-light, ratio: 2.2, level: fail }
                  - { pair: accent-on-light, ratio: 4.6, level: AA }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/branding/{asset}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: asset
        in: path
        description: "Which image: `logo` or `background`."
        required: true
        schema: { type: string, enum: [logo, background] }
        example: background
    get:
      tags: [Admin tenants]
      operationId: getBrandingAsset
      summary: Get the custom logo or background image
      description: |
        Returns the custom image stored for the tenant, as re-encoded by the server (PNG for the
        logo, JPEG for the background), never the uploaded bytes, so that the administration can
        preview it. Unlike the public `getTenantAsset`, the built-in default background is never
        returned: without a custom image the answer is `404`. The response is never cached
        (`Cache-Control: no-store`) and carries a strong `ETag` (quoted SHA-256 of the image).
      security:
        - adminSession: []
      responses:
        '200':
          description: "Image content, with its exact media type (`image/png` for the logo, `image/jpeg` for the background), `X-Content-Type-Options: nosniff` and `Cache-Control: no-store`."
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            image/png: { schema: { type: string, format: binary }, example: "<binary data>" }
            image/jpeg: { schema: { type: string, format: binary }, example: "<binary data>" }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: uploadBrandingAsset
      summary: Upload logo or background image
      description: |
        PNG, JPEG or WebP only, detected from the content (`415` otherwise, SVG included); the
        declared `Content-Type` must be an `image/*` type but is never trusted. 5 MiB max for a
        logo and 10 MiB for a background, and bounded dimensions checked before decoding (`413`
        above). Images are decoded and re-encoded server side (PNG for the logo, JPEG for the
        background) to strip metadata and active content; a corrupt image is `400`.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary, description: "PNG, JPEG or WebP; the format is detected from the content." }
            example: "<binary data>"
      responses:
        '204': { description: Image stored. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin tenants]
      operationId: deleteBrandingAsset
      summary: Revert to the default image
      description: "Removes the custom logo or background image; the default image is served again."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Image removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/network:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getNetworkRules
      summary: Internal IP ranges and email domains
      description: "Returns the internal IP ranges and internal email domains that define an internal user of the tenant."
      security:
        - adminSession: []
      responses:
        '200':
          description: Rules defining internal users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkRules' }
              example:
                internalCidrs: [10.10.0.0/16, 192.0.2.0/24, '2001:db8:10::/48']
                internalDomains: [entity-a.example.com, corp.entity-a.example.com]
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateNetworkRules
      summary: Replace internal IP ranges and email domains
      description: "Replaces the internal IP ranges (IPv4 or IPv6 CIDR) and internal email domains of the tenant. Values are validated and normalised; the change is audited."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkRules' }
            example:
              internalCidrs: [10.10.0.0/16]
              internalDomains: [entity-a.example.com]
      responses:
        '200':
          description: Saved rules (normalised).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkRules' }
              example:
                internalCidrs: [10.10.0.0/16]
                internalDomains: [entity-a.example.com]
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/smtp:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: getSmtpSettings
      summary: SMTP settings
      description: The password is never returned; `passwordSet` tells whether one is stored.
      security:
        - adminSession: []
      responses:
        '200':
          description: SMTP settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmtpSettings' }
              example:
                host: smtp-relay
                port: 25
                security: none
                username: null
                passwordSet: false
                fromAddress: no-reply@entity-a.example.com
                fromName: Entity A Transfer
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin tenants]
      operationId: updateSmtpSettings
      summary: Replace SMTP settings
      description: |
        Authentication is optional (unauthenticated relay on the internal Docker network is
        supported). Omit `password` to keep the stored one; set `removePassword` to remove it. The
        password is encrypted at rest with the master key.

        To prevent a stored password from being sent to another server, `password` (or
        `removePassword`) is mandatory whenever `host`, `port` or `username` differs from the stored
        settings; otherwise the request is refused with `400 validation-failed`. Sending both
        `password` and `removePassword` is also refused.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmtpSettingsUpdate' }
            examples:
              relay:
                summary: Unauthenticated internal relay
                value: { host: smtp-relay, port: 25, security: none, fromAddress: no-reply@entity-a.example.com, fromName: Entity A Transfer }
              submission:
                summary: Authenticated submission with STARTTLS
                value: { host: smtp.example.com, port: 587, security: starttls, username: transfer@entity-a.example.com, password: s3cr3t-app-password, fromAddress: transfer@entity-a.example.com }
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmtpSettings' }
              example:
                host: smtp.example.com
                port: 587
                security: starttls
                username: transfer@entity-a.example.com
                passwordSet: true
                fromAddress: transfer@entity-a.example.com
                fromName: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/smtp/test:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Admin tenants]
      operationId: testSmtp
      summary: Send a test email
      description: |
        Sends a fixed test email through the tenant SMTP settings and reports the result of the
        SMTP dialogue: `stage` tells how far it went, `error` is the server answer, sanitized
        (credentials redacted, control characters removed, truncated). A server whose address is
        in a denied network (`TT_SMTP_DENY_NETWORKS`), resolved at connection time, is never
        contacted (`stage: connect`). Limited per administrator and tenant (`429`); audited.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmtpTest' }
            example: { to: admin@entity-a.example.com }
      responses:
        '200':
          description: Result of the SMTP dialogue (the email may still be filtered downstream).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmtpTestResult' }
              examples:
                ok: { value: { success: true, durationMs: 412, stage: done } }
                ko: { value: { success: false, durationMs: 5003, stage: connect, error: 'mail: smtp: connect: dial tcp 192.0.2.25:25: i/o timeout' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfInvalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/smtp/dns-check:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: checkMailDns
      summary: Indicative SPF, DKIM and DMARC check of the sender domain
      description: |
        Informational only; DKIM selectors to probe can be given since they cannot be discovered.
        More than 5 selectors, or a selector that is not made of DNS labels, is refused with
        `400 validation-failed` on `dkimSelector`.
      security:
        - adminSession: []
      parameters:
        - name: dkimSelector
          in: query
          description: "DKIM selectors to probe (they cannot be discovered from DNS): DNS labels of letters, digits and inner hyphens, separated by dots."
          required: false
          schema:
            type: array
            maxItems: 5
            items:
              type: string
              maxLength: 63
              pattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$'
          example: [selector1, selector2]
      responses:
        '200':
          description: DNS diagnostics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailDnsCheck' }
              example:
                domain: entity-a.example.com
                spf: { status: ok, record: 'v=spf1 include:spf.protection.example.net -all' }
                dkim: { status: ok, selectors: [{ selector: selector1, found: true }] }
                dmarc: { status: warning, record: 'v=DMARC1; p=none', message: Policy is p=none. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/tenants/{tenantId}/email-templates:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Admin tenants]
      operationId: listEmailTemplates
      summary: List email templates and whether they are customised
      description: "Lists every email template key and language, and whether the tenant customised it."
      security:
        - adminSession: []
