  /admin/system/settings:
    get:
      tags: [Admin system]
      operationId: getSystemSettings
      summary: Instance settings editable at runtime (super admin)
      description: "Returns the instance settings that can be changed at runtime: the disk alert threshold and the optional address that receives the disk alert in addition to the super admins (`null` when none). Since 1.1 it also reports, read only, the antivirus engine selected by `TT_ANTIVIRUS_ENGINE` (`antivirusEngine`): the engine is configured by environment variables only and cannot be changed through the API. Reserved to the super admin."
      security:
        - adminSession: []
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
              example: { diskAlertThreshold: 0.85, alertEmail: it-admin@example.com, antivirusEngine: clamd }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin system]
      operationId: updateSystemSettings
      summary: Update instance settings (super admin)
      description: |
        Updates the instance settings that can be changed at runtime. JSON Merge Patch semantics
        (RFC 7396): an absent field is left unchanged; `alertEmail: null` removes the alert
        address, `diskAlertThreshold: null` is refused. An unknown member is refused
        (`400 validation-failed`). The alert address receives the disk alert in the language of
        the admin who set it. A threshold change re-evaluates the disk alert immediately.
        Audited (`config.updated`, with the names of the changed fields only, never the address).
        Reserved to the super admin: the role is checked before the body, so another admin gets
        `403` whatever it sends.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SystemSettingsUpdate' }
            example: { diskAlertThreshold: 0.9, alertEmail: null }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
              example: { diskAlertThreshold: 0.9, alertEmail: null, antivirusEngine: clamd }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/maintenance:
    get:
      tags: [Admin system]
      operationId: getMaintenance
      summary: Maintenance mode state
      description: |
        Returns whether maintenance mode is enabled, by whom (environment or admin), the choice
        stored by the super admin (`adminEnabled`, shown even while `TT_MAINTENANCE` forces the
        mode) and the displayed messages. Readable by every admin; it holds no tenant data.
      security:
        - adminSession: []
      responses:
        '200':
          description: Maintenance state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
              example: { enabled: false, source: none, adminEnabled: false }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin system]
      operationId: setMaintenance
      summary: Enable or disable maintenance mode (super admin)
      description: |
        When enabled, new deposits, invitations and uploads are refused with `503` (code
        `maintenance`, whose `detail` carries the message in the negotiated language; tus requests
        stay bodyless); downloads, the health check and the admin space remain available. The
        choice is stored and survives a restart. Audited (`maintenance.enabled` or
        `maintenance.disabled`, with the list of message languages only). The super admin role is
        checked before the body: another admin gets `403` whatever it sends.

        `message` replaces the stored messages entirely (absent: no message). Its keys are
        supported languages; each value is plain text of 1 to 500 characters, without control
        characters other than line feed (`\n`), without Unicode line or paragraph separators
        (U+2028, U+2029) and without bidirectional control characters (U+061C, U+200E, U+200F,
        U+202A to U+202E, U+2066 to U+2069). Any other key or value is refused with
        `400 validation-failed` naming the member (for example `/message/fr`). `enabled` is
        required: missing, null or not a boolean, it is `400 validation-failed` on `/enabled`; an
        unknown member is refused the same way, naming it.

        While `TT_MAINTENANCE=true` forces the mode (`source: environment`), `enabled: false` is
        refused with `409 state-conflict`; `enabled: true` is accepted (the message is stored and
        the source stays `environment`).
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceUpdate' }
            example: { enabled: true, message: { fr: "Mise à jour en cours, retour vers 20 h.", en: "Upgrade in progress, back around 8 pm." } }
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
              example: { enabled: true, source: admin, adminEnabled: true, since: '2026-10-19T18:00:00Z', message: { fr: "Mise à jour en cours, retour vers 20 h.", en: "Upgrade in progress, back around 8 pm." } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`enabled: false` while `TT_MAINTENANCE=true` forces maintenance mode."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                title: Operation not allowed in the current state
                status: 409
                code: state-conflict
                detail: Maintenance mode is forced by the environment.
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/master-key:
    get:
      tags: [Admin system]
      operationId: getMasterKeyStatus
      summary: Master key status (super admin)
      description: |
        Returns the identifier of the active master key, the identifier of the new master key
        when one is configured (`TT_MASTER_KEY_NEW_FILE`), whether a restart with the switched
        configuration is required, and the latest rotation (running, completed or failed), so
        that a client can find a running rotation again after reloading. Key identifiers are
        derived from the keys and are not secret. Reserved to the super admin.
      security:
        - adminSession: []
      responses:
        '200':
          description: Master key status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterKeyStatus' }
              example:
                activeKeyId: mk_3f9a0c41d27be865
                newKeyId: mk_b81e2d07c4a95f13
                restartRequired: false
                latestRotation:
                  id: rot_01JABCM8Q9R0S1T2V3V4W5X6Y7
                  status: running
                  fromKeyId: mk_3f9a0c41d27be865
                  toKeyId: mk_b81e2d07c4a95f13
                  totalKeys: 18342
                  rewrappedKeys: 9120
                  startedAt: '2026-10-19T16:30:00Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/master-key/rotations:
    post:
      tags: [Admin system]
      operationId: startMasterKeyRotation
      summary: Start a master key rotation (super admin)
      description: |
        Re-wraps every per-file key (and every encrypted secret such as SMTP passwords) with the
        new master key provided through `TT_MASTER_KEY_NEW_FILE`. File contents are neither read
        nor rewritten. The operation runs in the background (follow it with
        `getMasterKeyRotation` or `getMasterKeyStatus`), is resumable after an interruption and
        audited (`master_key.rotation_started`, then `master_key.rotation_completed` or
        `master_key.rotation_failed`). Equivalent to the `transteira rotate-master-key` command.
        Once completed, restart the instance with the switched configuration (the new key as
        `TT_MASTER_KEY_FILE`).

        Checks, in this order:
        1. super admin only (`403 forbidden`);
        2. a new master key must be configured (`409 new-master-key-missing`);
        3. `409 state-conflict`, with a `detail` naming the case: a rotation already running in
           this instance; an interrupted rotation between other keys (finish or abandon it with
           the command line); or the rotation to the configured new key already completed
           (restart with the new key as `TT_MASTER_KEY_FILE` before starting another). An
           interrupted rotation between the same keys is resumed: `202` with the same rotation
           identifier;
        4. TOTP re-confirmation: `code` is a current TOTP code (a code already used, for example
           at login, cannot be reused within the same 30-second step: wait for the next one) or
           a recovery code (consumed and audited). A wrong code is `401 invalid-credentials` and
           counts towards the same lockout as the login (`429 rate-limited`); the session is not
           rotated, but, as at the login, the 5th wrong code of the session ends it: that
           request still answers `401 invalid-credentials` (or `429 rate-limited` when it also
           sets the lockout) and the next one `401 unauthenticated`.

        Checks 2 and 3 come before the TOTP code, so that a refused start consumes no attempt:
        neither a TOTP time step nor a recovery code is burnt. Check 3 is made again after the
        confirmation, which also answers `409 state-conflict` for a rotation started meanwhile by
        another process.

        A body that is not a `TotpCode` object (an unknown member, a member of the wrong type) is
        `400 validation-failed` naming the member; it is reported after checks 1 and 2, so that
        it reveals nothing to another administrator, and consumes no TOTP attempt.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/TotpCode' }]
              # Decoded by the handler itself, which refuses unknown members.
              x-go-type: json.RawMessage
            example: { code: '204816' }
      responses:
        '202':
          description: Rotation started, or interrupted rotation between the same keys resumed (same identifier).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotation' }
              example:
                id: rot_01JABCM8Q9R0S1T2V3V4W5X6Y7
                status: running
                fromKeyId: mk_3f9a0c41d27be865
                toKeyId: mk_b81e2d07c4a95f13
                totalKeys: 18342
                rewrappedKeys: 0
                startedAt: '2026-10-19T16:30:00Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: |
            `invalid-credentials`: the TOTP or recovery code is wrong (written to the security
            log). `unauthenticated`: no admin session.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                invalidCredentials:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invalid-credentials
                    title: Invalid credentials
                    status: 401
                    code: invalid-credentials
                unauthenticated:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unauthenticated
                    title: Authentication required
                    status: 401
                    code: unauthenticated
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `new-master-key-missing`: no new master key is configured (`TT_MASTER_KEY_NEW_FILE`).
            `state-conflict`: a rotation is already running in this instance, an interrupted
            rotation exists between other keys, or the rotation to the configured new key is
            complete and the instance must be restarted with it; `detail` names the case.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                newMasterKeyMissing:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#new-master-key-missing
                    title: New master key not configured
                    status: 409
                    code: new-master-key-missing
                stateConflict:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                    title: Operation not allowed in the current state
                    status: 409
                    code: state-conflict
                    detail: A master key rotation is already running.
                rotationMismatch:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                    title: Operation not allowed in the current state
                    status: 409
                    code: state-conflict
                    detail: A rotation between other keys is unfinished; finish or abandon it with the command line.
                restartRequired:
                  value:
                    type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
                    title: Operation not allowed in the current state
                    status: 409
                    code: state-conflict
                    detail: The last rotation is complete; restart with the new key as TT_MASTER_KEY_FILE before starting another.
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/master-key/rotations/{rotationId}:
    get:
      tags: [Admin system]
      operationId: getMasterKeyRotation
      summary: Progress of a master key rotation
      description: "Returns the progress of a master key rotation. Reserved to the super admin."
      security:
        - adminSession: []
      parameters:
        - name: rotationId
          in: path
          description: "Master key rotation identifier."
          required: true
          schema: { type: string, pattern: '^rot_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
          example: rot_01JABCM8Q9R0S1T2V3V4W5X6Y7
      responses:
        '200':
          description: Rotation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotation' }
              example:
                id: rot_01JABCM8Q9R0S1T2V3V4W5X6Y7
                status: completed
                fromKeyId: mk_3f9a0c41d27be865
                toKeyId: mk_b81e2d07c4a95f13
                totalKeys: 18342
                rewrappedKeys: 18342
                startedAt: '2026-10-19T16:30:00Z'
                completedAt: '2026-10-19T16:31:12Z'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/audit-events:
    get:
      tags: [Admin system]
      operationId: listGlobalAuditEvents
      summary: Instance-wide audit log (super admin)
      description: |
        Returns the audit log of the whole instance, most recent first. Without `tenantId`, it
        includes the events of every tenant plus the events without tenant (`tenantId` absent:
        setup, admin management, maintenance, key rotation); with `tenantId`, only the events of
        that tenant. Reserved to the super admin: `403 forbidden` for any other admin.
      security:
        - adminSession: []
      parameters:
        - name: tenantId
          in: query
          description: "Filter by tenant; events without tenant are then excluded."
          schema: { type: string, pattern: '^ten_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
          example: ten_01JAB00000000000000ENT1TYA
        - name: action
          in: query
          description: "Filter by audit action. The list of actions is extensible: any value of the `AuditAction` form is accepted, and an unknown action simply matches no event."
          schema: { $ref: '#/components/schemas/AuditAction' }
          example: maintenance.enabled
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventList' }
              example:
                items:
                  - id: aud_01JABCN9R0S1T2V3V4W5X6Y7Z8
                    occurredAt: '2026-10-19T18:00:00Z'
                    actor: { kind: admin, id: superadmin }
                    ip: 10.10.1.5
                    action: maintenance.enabled
                    object: { kind: system, id: maintenance }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/webhooks:
    get:
      tags: [Admin system]
      operationId: listSystemWebhooks
      summary: List the instance-wide webhooks (super admin)
      description: "Since 1.1. Lists the instance-wide webhooks, which receive the system events only (disk alerts, antivirus outage, maintenance, master key rotation), never the events of a tenant. Same representation as the tenant webhooks. Reserved to the super admin: `403 forbidden` for any other admin."
      security:
        - adminSession: []
      responses:
        '200':
          description: Instance-wide webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
              example:
                - id: whk_01JABCS4T5V6W7X8Y9Z0A1B2C3
                  name: Operations channel
                  kind: slack
                  urlHint: https://hooks.example.com
                  events: [disk.alert_raised, disk.alert_cleared, antivirus.alert_raised, antivirus.alert_cleared]
                  enabled: true
                  hasSecret: false
                  createdBy: superadmin
                  createdAt: '2026-10-20T08:00:00Z'
                  updatedAt: '2026-10-20T08:00:00Z'
                  lastDelivery: null
                  circuitOpenUntil: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin system]
      operationId: createSystemWebhook
      summary: Create an instance-wide webhook (super admin)
      description: "Since 1.1. Same rules as `createTenantWebhook` (network guard, `url-not-allowed` for a host that does not resolve or resolves to a denied address, limit of 30 creations and URL changes per hour per administrator with `429`, sealed URL, generic secret shown once), with the system event types only (a tenant event is refused with `400 validation-failed` on `/events/<index>`); at most 20 instance-wide webhooks. Reserved to the super admin (another admin gets `403`; a body that is not valid JSON is refused with `400` first). Audited as `webhook.created`, without tenant."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
            example: { name: Operations channel, kind: slack, url: 'https://hooks.example.com/services/EXAMPLE', events: [disk.alert_raised, disk.alert_cleared, antivirus.alert_raised, antivirus.alert_cleared] }
      responses:
        '201':
          description: Webhook created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookWithSecret' }
              example:
                id: whk_01JABCS4T5V6W7X8Y9Z0A1B2C3
                name: Operations channel
                kind: slack
                urlHint: https://hooks.example.com
                events: [disk.alert_raised, disk.alert_cleared, antivirus.alert_raised, antivirus.alert_cleared]
                enabled: true
                hasSecret: false
                createdBy: superadmin
                createdAt: '2026-10-27T09:00:00Z'
                updatedAt: '2026-10-27T09:00:00Z'
                lastDelivery: null
                circuitOpenUntil: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/webhooks/{webhookId}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Admin system]
      operationId: getSystemWebhook
      summary: Get an instance-wide webhook (super admin)
      description: "Since 1.1. Returns one instance-wide webhook; a tenant webhook identifier answers `404`. Reserved to the super admin."
      security:
        - adminSession: []
      responses:
        '200':
          description: Webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
              example:
                id: whk_01JABCS4T5V6W7X8Y9Z0A1B2C3
                name: Operations channel
                kind: slack
                urlHint: https://hooks.example.com
                events: [disk.alert_raised, disk.alert_cleared, antivirus.alert_raised, antivirus.alert_cleared]
                enabled: true
                hasSecret: false
                createdBy: superadmin
                createdAt: '2026-10-20T08:00:00Z'
                updatedAt: '2026-10-20T08:00:00Z'
                lastDelivery: null
                circuitOpenUntil: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Admin system]
      operationId: updateSystemWebhook
      summary: Update an instance-wide webhook (super admin)
      description: "Since 1.1. Same semantics as `updateTenantWebhook`, a new `url` counting against the limit of 30 creations and URL changes per hour per administrator (`429`). Reserved to the super admin, checked before the patch is read. Audited as `webhook.updated`, without tenant."
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/WebhookUpdate' }
            example: { events: [disk.alert_raised, antivirus.alert_raised] }
      responses:
        '200':
          description: Updated webhook; `secret` only after a rotation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookWithSecret' }
              example:
                id: whk_01JABCS4T5V6W7X8Y9Z0A1B2C3
                name: Operations channel
                kind: slack
                urlHint: https://hooks.example.com
                events: [disk.alert_raised, antivirus.alert_raised]
                enabled: true
                hasSecret: false
                createdBy: superadmin
                createdAt: '2026-10-20T08:00:00Z'
                updatedAt: '2026-10-27T09:05:00Z'
                lastDelivery: null
                circuitOpenUntil: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Admin system]
      operationId: deleteSystemWebhook
      summary: Delete an instance-wide webhook (super admin)
      description: "Since 1.1. Deletes an instance-wide webhook, destroying the key material of its sealed URL and secret first. Reserved to the super admin. Audited as `webhook.deleted`, without tenant."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '204': { description: Webhook deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/system/webhooks/{webhookId}/test:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Admin system]
      operationId: testSystemWebhook
      summary: Send a test event to an instance-wide webhook (super admin)
      description: "Since 1.1. Same as `testTenantWebhook` for an instance-wide webhook (10 tests per hour per administrator, `429`). Reserved to the super admin. Audited as `webhook.tested`, without tenant."
      security:
        - adminSession: []
          csrfToken: []
      responses:
        '200':
          description: Outcome of the test delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookTestResult' }
              example: { success: true, httpStatus: 200, durationMs: 240 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

webhooks:
  transteiraEvent:
    post:
      tags: [Webhooks]
      operationId: receiveWebhookEvent
      summary: Event delivered to a generic webhook
      description: |
        Since 1.1. Request TransTeira sends to the URL of a `generic` webhook (tenant or
        instance-wide) for each subscribed event; `teams` and `slack` webhooks receive a formatted
        message instead. The receiver answers any `2xx` status within 10 seconds to acknowledge;
        any other answer, or none, is a failure, and the delivery makes up to 5 attempts in all with exponential back-off. See
        `WebhookEvent` for the headers and the signature.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
            examples:
              minimal:
                summary: Default payload, without any address
                value:
                  id: evt_01JABCU7W8X9Y0Z1A2B3C4D5E6
                  type: virus.detected
                  severity: critical
                  occurredAt: '2026-10-27T09:00:00Z'
                  tenant: { id: ten_01JAB00000000000000ENT1TYA, name: Entity A }
                  counts: { files: 1 }
                  adminUrl: https://admin.transfer.example.com/admin/tenants/ten_01JAB00000000000000ENT1TYA/audit
              withAddresses:
                summary: Tenant with webhookIncludeAddresses enabled
                value:
                  id: evt_01JABCU8X9Y0Z1A2B3C4D5E6F7
                  type: abuse.threshold_exceeded
                  severity: warning
                  occurredAt: '2026-10-27T09:00:00Z'
                  tenant: { id: ten_01JAB00000000000000ENT1TYA, name: Entity A }
                  counts: { value: 118111600640, threshold: 107374182400 }
                  adminUrl: https://admin.transfer.example.com/admin/tenants/ten_01JAB00000000000000ENT1TYA/audit
                  addresses: { sender: alice@entity-a.example.com }
      responses:
        '204':
          description: Event acknowledged (any 2xx status is accepted).
        '400':
          description: Event refused by the receiver (for example a bad signature); the delivery counts as failed and is retried.

components:
  securitySchemes:
    depositSession:
      type: apiKey
      in: cookie
      name: __Host-tt_deposit
      description: Opaque session identifier set after email verification. Bound to one tenant and one address. Lifetime `TT_DEPOSIT_SESSION_TTL` (4 h by default).
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-tt_admin
      description: Opaque admin session identifier (server-side session, only its SHA-256 is stored), set on the admin host only. Rotated after each authentication step. Idle timeout `TT_ADMIN_SESSION_IDLE_TIMEOUT` (30 min by default), absolute timeout `TT_ADMIN_SESSION_MAX_AGE` (12 h by default); an intermediate login state (TOTP or enrollment awaited) lasts 5 min and only opens the next step.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token returned in the session payloads (`csrfToken`). Mandatory with cookie authentication on unsafe methods. The admin token is derived from the session token with a key of the current master key; after a master key rotation, the tokens of open admin sessions no longer verify and their unsafe requests get `403 csrf-invalid`. On `csrf-invalid`, the admin client must fetch `GET /admin/me` again to get the current token, then retry.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: tt_<random>
      description: Per-tenant API token created by an admin. Only valid on the host of its tenant.
    downloadGrant:
      type: apiKey
      in: cookie
      name: __Host-tt_dl
      description: Set after unlocking a password-protected transfer; lists the unlocked links for this browser. Lifetime 1 h.
    recipientVerification:
      type: apiKey
      in: cookie
      name: __Host-tt_rv
      description: Since 1.1. Set by `confirmRecipientVerification` after the recipient of a per-recipient link proved their address with a code. Stateless and MAC-signed (key derived from the master key, like `__Host-tt_dl`); each entry binds a link identifier, its tenant identifier and an expiry 1 h ahead.
    myTransfersSession:
      type: apiKey
      in: cookie
      name: __Host-tt_me
      description: Since 1.1. Opaque "My transfers" session identifier set by `startMyTransfersSession` from a mailed access link. Bound to one tenant and one address; only its SHA-256 is stored. Absolute lifetime 1 h.
    metricsToken:
      type: http
      scheme: bearer
      description: Since 1.1. The monitoring token of the instance (`TT_METRICS_TOKEN`, at least 32 characters), for `/metrics` and `/status` only. Unrelated to the API tokens of the tenants, never valid elsewhere.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: "Preferred languages of the client (RFC 9110); falls back to the tenant default language."
      required: false
      schema: { type: string }
      example: fr-FR,fr;q=0.9,en;q=0.8
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional key making retries of transfer creation safe (24 h retention): a request with a
        key the same sender already used returns the transfer created then, provided the body is
        the same. A replay of the key with a different body gets `409 state-conflict`.
      schema: { type: string, maxLength: 64 }
      example: 5f0c6c1e-8b7a-4a8e-9f0d-2c3b4a5d6e7f
    TusResumableHeader:
      name: Tus-Resumable
      in: header
      description: "tus protocol version used by the client."
      required: true
      schema: { type: string, enum: ['1.0.0'] }
      example: 1.0.0
    ChallengeId:
      name: challengeId
      in: path
      description: "Verification challenge identifier returned by `startDepositSession`."
      required: true
      schema: { type: string, pattern: '^vch_[A-Za-z0-9]{22,43}$' }
      example: vch_4Fq9Lm2Zx8Rt6Yb1Kd7Pw3
    TransferId:
      name: transferId
      in: path
      description: "Transfer identifier."
      required: true
      schema: { type: string, pattern: '^trf_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: trf_01JABCD8E3W5Q2Z7K9M4N6P0RS
    FileId:
      name: fileId
      in: path
      description: "File identifier within the transfer."
      required: true
      schema: { type: string, pattern: '^fil_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: fil_01JABCD9F1A2B3C4D5E6F7G8H9
    UploadId:
      name: uploadId
      in: path
      description: "tus upload identifier, part of the `uploadUrl` returned at transfer creation."
      required: true
      schema: { type: string, pattern: '^upl_[A-Za-z0-9]{22,43}$' }
      example: upl_7Hq2Wm9Zx4Lp1Vb8Rt3Yk6Nd
    LinkToken:
      name: linkToken
      in: path
      required: true
      description: Unguessable download token (at least 128 bits of entropy). Unknown and foreign-tenant tokens give the same `404`.
      schema: { type: string, pattern: '^dl_[A-Za-z0-9]{22,43}$' }
      example: dl_Xk4Lm9Qp2Zr7Vb1Nt6Yc3Hd8Jf
    RecognitionCookie:
      name: __Host-tt_known
      in: cookie
      required: false
      description: |
        Technical recognition cookie set by `confirmVerificationChallenge` (and renewed by a
        `201` of `startDepositSession`) for internal depositors. It holds up to 5 dot-separated
        opaque entries keyed by the master key, never an address. Invalid, expired, foreign or
        oversized values are ignored.
      schema: { type: string, maxLength: 1024 }
      example: Xq3Lm8Zx2Vb7Kd0RPq1Lm8Zx3Vb7Kd0RJd83kLm0Qp2
    InvitationToken:
      name: invitationToken
      in: path
      description: "Unguessable invitation token from the invitation link."
      required: true
      schema: { type: string, pattern: '^inv_[A-Za-z0-9]{22,43}$' }
      example: inv_9sK2mQ7xL0aZ4vR8tYb3nC6dE1fG5hJ
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Tenant identifier. A tenant outside the admin's scope gives `404` (never `403`) to avoid disclosing its existence.
      schema: { type: string, pattern: '^ten_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: ten_01JAB00000000000000ENT1TYA
    AdminId:
      name: adminId
      in: path
      description: "Admin account identifier."
      required: true
      schema: { type: string, pattern: '^adm_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: adm_01JABCG1H2J3K415M6N7P8Q9R0
    TemplateKey:
      name: templateKey
      in: path
      description: "Email template key."
      required: true
      schema: { $ref: '#/components/schemas/EmailTemplateKey' }
      example: transfer-notification
    LanguagePath:
      name: language
      in: path
      description: "Language of the template or text."
      required: true
      schema: { $ref: '#/components/schemas/Language' }
      example: fr
    LegalDocumentPath:
      name: document
      in: path
      description: "Legal document: legal notice or privacy policy."
      required: true
      schema: { type: string, enum: [legal-notice, privacy-policy] }
      example: privacy-policy
    Limit:
      name: limit
      in: query
      description: "Maximum number of items per page."
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      example: 50
    Cursor:
      name: cursor
      in: query
      description: "Opaque cursor returned as `nextCursor` by the previous page."
      required: false
      schema: { type: string, maxLength: 512 }
      example: eyJjIjoiMjAyNi0xMC0xOVQxNjowMDowMFoiLCJpIjoidHJmXzAxIn0
    WebhookId:
      name: webhookId
      in: path
      description: "Since 1.1. Webhook identifier. A webhook of another tenant, or an instance-wide webhook under a tenant path (and the reverse), answers `404`."
      required: true
      schema: { type: string, pattern: '^whk_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: whk_01JABCQ1R2S3T4V5W6X7Y8Z9A0
    AbuseReportId:
      name: reportId
      in: path
      description: "Since 1.1. Abuse report identifier."
      required: true
      schema: { type: string, pattern: '^abr_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
      example: abr_01JABCR3S4T5V6W7X8Y9Z0A1B2

  headers:
    ContentLanguage:
      schema: { type: string }
      example: fr
    ETag:
      schema: { type: string }
      example: '"a1b2c3d4"'
    RetryAfter:
      description: Seconds before retrying.
      schema: { type: integer }
      example: 900
    TusResumable:
      schema: { type: string }
      example: 1.0.0
    UploadOffset:
      schema: { type: integer, format: int64, minimum: 0 }
      example: 1048576
    UploadExpires:
      description: |
        RFC 9110 date after which the unfinished upload expires (`410`): `TT_UPLOAD_TTL` after the
        latest activity on any file of the transfer, but never later than `TT_UPLOAD_MAX_AGE`
        after the creation of the transfer.
      schema: { type: string }
      example: Tue, 20 Oct 2026 16:00:00 GMT
    ContentLength:
      schema: { type: integer }
      example: 15728640
    NoSniff:
      schema: { type: string, enum: [nosniff] }
      example: nosniff
    AcceptRangesBytes:
      schema: { type: string, enum: [bytes] }
      example: bytes
    NoStore:
      schema: { type: string, enum: [no-store] }
      example: no-store
    AssetCacheControl:
      description: Short public cache lifetime of a branding image, revalidated with its ETag.
      schema: { type: string }
      example: public, max-age=300
    FileETag:
      description: Strong entity tag, the quoted SHA-256 of the file (for `If-Range` and `If-None-Match`).
      schema: { type: string }
      example: '"3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b"'
    SandboxCSP:
      description: Should a browser ever render downloaded content, it loads nothing, runs in a sandbox and cannot be framed.
      schema: { type: string, enum: ["default-src 'none'; sandbox; frame-ancestors 'none'"] }
      example: "default-src 'none'; sandbox; frame-ancestors 'none'"
    ContentDispositionAttachment:
      description: |
        Always `attachment`: an ASCII `filename` fallback (non-ASCII characters, quotes,
        backslashes and control characters replaced) and the exact name as RFC 5987 `filename*`.
      schema: { type: string }
      example: attachment; filename="plans-v3.pdf"; filename*=UTF-8''plans-v3.pdf
    SetDepositCookies:
      description: |
        One `Set-Cookie` header per cookie (RFC 6265 forbids folding them): always the session
        cookie `__Host-tt_deposit` (Max-Age = remaining session lifetime), and for an internal
        depositor the recognition cookie `__Host-tt_known` (Max-Age 31536000, one year). Both
        are `Path=/; Secure; HttpOnly; SameSite=Strict`, without `Domain`.
      schema: { type: string }
      example: __Host-tt_deposit=ds_Qm2Zx8...; Path=/; Max-Age=14400; HttpOnly; Secure; SameSite=Strict
    ClearDepositCookie:
      description: Expires the deposit session cookie.
      schema: { type: string }
      example: __Host-tt_deposit=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict
    SetAdminCookie:
      description: |
        Sets the admin session cookie, on the admin host only. Its `Max-Age` is the life left to
        the session, at most 5 minutes while a login step (TOTP or enrollment) is awaited.
      schema: { type: string }
      example: __Host-tt_admin=as_Hx7Lp1...; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Strict
    ClearAdminCookie:
      description: Expires the admin session cookie.
      schema: { type: string }
      example: __Host-tt_admin=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict
    SetDownloadGrantCookie:
      schema: { type: string }
      example: __Host-tt_dl=dg_Vb4Nt9...; Path=/; Max-Age=3600; HttpOnly; Secure; SameSite=Strict
    SetRecipientVerificationCookie:
      description: Since 1.1. Sets (or extends with this link) the recipient verification cookie.
      schema: { type: string }
      example: __Host-tt_rv=rv_Kd2Lm7...; Path=/; Max-Age=3600; HttpOnly; Secure; SameSite=Strict
    SetMyTransfersCookie:
      description: Since 1.1. Sets the "My transfers" session cookie (Max-Age = remaining session lifetime).
      schema: { type: string }
      example: __Host-tt_me=ms_Wq8Zx3...; Path=/; Max-Age=3600; HttpOnly; Secure; SameSite=Strict
    ClearMyTransfersCookie:
      description: Since 1.1. Expires the "My transfers" session cookie.
      schema: { type: string }
      example: __Host-tt_me=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict

  responses:
    ValidationFailed:
      description: |
        The request is malformed or a field is invalid. Each entry of `errors` names the field by
        its JSON pointer (RFC 6901) in the request body, such as `/recipients/0` or
        `/files/2/name`, or by the header name for a header (`Idempotency-Key`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#validation-failed
            title: Invalid request
            status: 400
            code: validation-failed
            errors:
              - { field: /recipients/0, code: invalid-email }
              - { field: /expiryDays, code: not-allowed }
    Unauthenticated:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unauthenticated
            title: Authentication required
            status: 401
            code: unauthenticated
    InvalidCredentials:
      description: Wrong username/password, TOTP code, or API token. Written to the security log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invalid-credentials
            title: Invalid credentials
            status: 401
            code: invalid-credentials
    DepositUnauthenticated:
      description: |
        No usable credential on an operation that accepts a deposit session or an API token.
        `unauthenticated`: no deposit session cookie (or an expired one) and no `Authorization`
        header. `invalid-credentials`: the `Authorization: Bearer` token is malformed, unknown
        (including a token of another tenant), revoked or expired; it is answered whatever the
        client IP and written to the security log (`api_token_invalid`). When a bearer token is
        present, a deposit session cookie sent along is ignored.
      headers:
        WWW-Authenticate:
          description: "`Bearer` (RFC 6750): the challenge of the API token scheme."
          schema: { type: string }
          example: Bearer
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthenticated:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unauthenticated
                title: Authentication required
                status: 401
                code: unauthenticated
            invalidCredentials:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invalid-credentials
                title: Invalid credentials
                status: 401
                code: invalid-credentials
    TokenIpNotAllowed:
      description: |
        The API token is valid but the client IP is outside its `allowedCidrs`
        (`ip-not-allowed`). Checked after the token is authenticated; written to the security log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#ip-not-allowed
            title: Address not allowed for this token
            status: 403
            code: ip-not-allowed
    DepositCredentialForbidden:
      description: |
        The CSRF check of a deposit session request failed (`csrf-invalid`), or a valid API token
        is used from an IP outside its `allowedCidrs` (`ip-not-allowed`, written to the security
        log). Requests made with an API token are not subject to the CSRF check.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            csrfInvalid:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
                title: Invalid CSRF token
                status: 403
                code: csrf-invalid
            ipNotAllowed:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#ip-not-allowed
                title: Address not allowed for this token
                status: 403
                code: ip-not-allowed
    Forbidden:
      description: Authenticated but not allowed (role).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#forbidden
            title: Forbidden
            status: 403
            code: forbidden
    CsrfInvalid:
      description: Missing or invalid CSRF token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
            title: Invalid CSRF token
            status: 403
            code: csrf-invalid
    AdminForbidden:
      description: |
        The authenticated admin's role or tenants do not allow the operation (`forbidden`), or the
        CSRF check of this unsafe method failed (`csrf-invalid`: missing or wrong `X-CSRF-Token`,
        cross-site `Origin` or `Sec-Fetch-Site`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            forbidden:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#forbidden
                title: Forbidden
                status: 403
                code: forbidden
            csrfInvalid:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#csrf-invalid
                title: Invalid CSRF token
                status: 403
                code: csrf-invalid
    DepositForbidden:
      description: |
        Deposit not allowed. For public deposits the code is always the generic
        `deposit-not-allowed`, whatever the reason (client outside internal IP ranges, email domain
        not internal, address or domain blocklisted), so that the response does not reveal which
        check failed; the precise reason is written to the security log. Other codes:
        `ip-not-allowed` (API token used outside its `allowedCidrs`, visible to the token owner only)
        and `invitation-not-allowed` (external depositor trying to invite).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            depositNotAllowed:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#deposit-not-allowed
                title: Deposit not allowed
                status: 403
                code: deposit-not-allowed
                detail: Deposits are only possible from the internal network with an internal address, or with an invitation.
            ipNotAllowed:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#ip-not-allowed
                title: Address not allowed for this token
                status: 403
                code: ip-not-allowed
            invitationNotAllowed:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invitation-not-allowed
                title: Invitations are reserved to internal users
                status: 403
                code: invitation-not-allowed
    InvitationGone:
      description: Invitation expired, revoked or already used.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invitation-gone
            title: Invitation no longer valid
            status: 410
            code: invitation-gone
    NotFound:
      description: Resource not found (or outside the caller's tenant / scope).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#not-found
            title: Not found
            status: 404
            code: not-found
    TransferGone:
      description: Transfer expired or deleted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-gone
            title: Transfer no longer available
            status: 410
            code: transfer-gone
    DownloadLocked:
      description: |
        The transfer is password protected and not unlocked for this browser (`download-locked`),
        or, since 1.1, its per-recipient link requires a recipient verification not done on this
        browser yet (`recipient-verification-required`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            downloadLocked:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#download-locked
                title: Password required
                status: 401
                code: download-locked
            recipientVerificationRequired:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#recipient-verification-required
                title: Recipient verification required
                status: 401
                code: recipient-verification-required
    DownloadGone:
      description: |
        Transfer expired or deleted (`transfer-gone`), or, since 1.1, its maximum number of
        downloads is reached (`max-downloads-reached`; a resumed range of a download already
        started is still served during the grace period).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            transferGone:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-gone
                title: Transfer no longer available
                status: 410
                code: transfer-gone
            maxDownloadsReached:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#max-downloads-reached
                title: Download limit reached
                status: 410
                code: max-downloads-reached
    MetricsUnauthenticated:
      description: |
        Since 1.1. `unauthenticated`: no `Authorization` header on `/metrics` or `/status`.
        `invalid-credentials`: wrong monitoring token (written to the security log as
        `metrics_token_invalid`).
      headers:
        WWW-Authenticate:
          description: "`Bearer` (RFC 6750)."
          schema: { type: string }
          example: Bearer
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthenticated:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unauthenticated
                title: Authentication required
                status: 401
                code: unauthenticated
            invalidCredentials:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#invalid-credentials
                title: Invalid credentials
                status: 401
                code: invalid-credentials
    StateConflict:
      description: The operation is not allowed in the current state of the resource.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#state-conflict
            title: Operation not allowed in the current state
            status: 409
            code: state-conflict
    AlreadyExists:
      description: A resource with the same unique key already exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#already-exists
            title: Already exists
            status: 409
            code: already-exists
            detail: The FQDN transfer.entity-b.example.com is already used.
    TransferTooLarge:
      description: Declared total size exceeds the tenant per-transfer limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#transfer-too-large
            title: Transfer too large
            status: 413
            code: transfer-too-large
            maxTransferBytes: 21474836480
    PayloadTooLarge:
      description: Request body too large.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#payload-too-large
            title: Payload too large
            status: 413
            code: payload-too-large
    UnsupportedMediaType:
      description: Unsupported content type.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unsupported-media-type
            title: Unsupported media type
            status: 415
            code: unsupported-media-type
    QuotaExceeded:
      description: The tenant storage quota is reached; new deposits are blocked until space is freed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#quota-exceeded
            title: Storage quota reached
            status: 507
            code: quota-exceeded
            detail: The storage space of this service is full. Please try again later.
    RateLimited:
      description: Too many requests (including repeated invalid API tokens from the same IP). Written to the security log.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#rate-limited
            title: Too many requests
            status: 429
            code: rate-limited
            retryAfterSeconds: 1800
    MaintenanceMode:
      description: |
        Maintenance mode; deposits are temporarily refused. `detail` carries the maintenance
        message (plain text) in the negotiated language, chosen like
        `PublicTenant.maintenanceMessage`; absent when no message is set.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#maintenance
            title: Maintenance in progress
            status: 503
            code: maintenance
            detail: Upgrade in progress, back around 8 pm.
    ServiceUnavailable:
      description: |
        The operation cannot be performed right now: either maintenance mode is active (code
        `maintenance`, with `Retry-After`; `detail` carries the maintenance message in the
        negotiated language, chosen like `PublicTenant.maintenanceMessage`), or the verification or invitation email cannot be sent
        (code `mail-unavailable`, for example no SMTP server is configured for the tenant or the
        mail queue is shut down). Clients must branch on `code`.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            maintenance:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#maintenance
                title: Maintenance in progress
                status: 503
                code: maintenance
                detail: Upgrade in progress, back around 8 pm.
                retryAfterSeconds: 300
            mailUnavailable:
              value:
                type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#mail-unavailable
                title: Email cannot be sent
                status: 503
                code: mail-unavailable
    TusVersionUnsupported:
      description: '`Tus-Resumable` missing or not a supported version; no body.'
      headers:
        Tus-Version:
          description: Supported tus versions.
          schema: { type: string }
          example: 1.0.0
    TooManyStreams:
      description: |
        Too many simultaneous download streams; retry after `Retry-After`. Three caps apply, and
        exceeding any of them returns this response:

        - 2 concurrent streams per client for one transfer;
        - 4 concurrent streams for one transfer, across all clients;
        - 8 concurrent streams per client, across all transfers of the tenant.

        A client is identified by its IP address, an IPv6 address being grouped by its /64
        prefix, so that recipients behind one NAT share the per-client caps. Written to the
        security log (`rate_limited`, scope `download_streams`).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#rate-limited
            title: Too many requests
            status: 429
            code: rate-limited
            retryAfterSeconds: 30
    InternalError:
      description: Unexpected server error. The response never contains internal details; the `instance` identifier allows correlation with the server logs.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#internal-error
            title: Internal error
            status: 500
            code: internal-error
            instance: req_01JABCP0S1T2V3V4W5X6Y7Z8A9
    UnknownTenant:
      description: The `Host` header does not match any tenant. Written to the security log.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/ed-fr/transteira/blob/main/docs/api/errors.md#unknown-tenant
            title: Unknown host
            status: 421
            code: unknown-tenant

  schemas:
    # --- Common -----------------------------------------------------------
    Problem:
      type: object
      description: RFC 9457 Problem Details with TransTeira extension members.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, description: Documentation URL of the problem type. }
        title: { type: string, description: Short localised summary. }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Localised human-readable explanation. }
        instance: { type: string, description: Request identifier (also in the `X-Request-Id` header and in logs). }
        code: { $ref: '#/components/schemas/ProblemCode' }
        errors:
          type: array
          description: "Field-level errors: `validation-failed`, and since 1.1 `recipient-domain-refused` (the refused recipients) and `confidentiality-rule-violated` (the rules not met)."
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              allowed: { type: array, items: {} }
              line: { type: integer, minimum: 1, description: "Line of the problem in the field (1-based; mail templates)." }
              column: { type: integer, minimum: 1, description: "Column of the problem in the line, in characters (1-based; mail templates)." }
              message: { type: string, description: "English explanation of the problem (mail templates)." }
        attemptsRemaining: { type: integer, minimum: 0 }
        retryAfterSeconds: { type: integer, minimum: 0 }
        maxTransferBytes: { type: integer, format: int64 }
        files: { type: array, items: { type: string } }
      additionalProperties: false
    ProblemCode:
      type: string
      x-extensible-enum: true
      description: Stable error code. See `docs/api/errors.md`.
      enum:
        - validation-failed
        - unauthenticated
        - invalid-credentials
        - forbidden
        - csrf-invalid
        - deposit-not-allowed
        - ip-not-allowed
        - blocked-file
        - invitation-not-allowed
        - invitation-gone
        - verification-code-invalid
        - verification-exhausted
        - not-found
        - method-not-allowed
        - transfer-gone
        - download-locked
        - transfer-password-invalid
        - transfer-locked
        - state-conflict
        - already-exists
        - upload-incomplete
        - checksum-mismatch
        - transfer-too-large
        - payload-too-large
        - range-not-satisfiable
        - unsupported-media-type
        - quota-exceeded
        - rate-limited
        - maintenance
        - mail-unavailable
        - unknown-tenant
        - setup-already-done
        - setup-token-invalid
        - new-master-key-missing
        - recipient-domain-refused
        - confidentiality-rule-violated
        - abuse-threshold-blocked
        - recipient-verification-required
        - max-downloads-reached
        - reply-not-allowed
        - access-link-invalid
        - extension-limit-reached
        - internal-error
    Language:
      type: string
      x-extensible-enum: true
      description: Supported UI language (ISO 639-1). New languages may be added.
      enum: [fr, en]
    Email:
      description: >-
        A bare mail address (`user@entity-a.example.com`), without display name. A request
        value that is not an acceptable address is refused with a `validation-failed`
        problem naming the field (`invalid-email`).
      type: string
      format: email
      maxLength: 254
      # Decoded as a plain string: the services validate the address and answer a
      # field error with its JSON pointer, which the decoder could not give.
      x-go-type: string
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    ByteSize:
      type: integer
      format: int64
      minimum: 0
    PageCursor:
      type: string
      description: Opaque cursor for the next page; absent on the last page.

    # --- Meta -------------------------------------------------------------
    Health:
      type: object
      required: [status, version, maintenance, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        maintenance: { type: boolean }
        checks:
          type: object
          required: [database, antivirus, storage]
          properties:
            database: { $ref: '#/components/schemas/ComponentHealth' }
            antivirus: { $ref: '#/components/schemas/ComponentHealth' }
            storage: { $ref: '#/components/schemas/ComponentHealth' }
    ComponentHealth:
      type: string
      enum: [ok, unavailable]
    VersionInfo:
      type: object
      required: [version, apiVersion]
      properties:
        version: { type: string, description: SemVer of the application. }
        apiVersion: { type: string, enum: [v1] }
        commit: { type: string }
    PublicTenant:
      type: object
      required: [name, language, availableLanguages, branding, limits, maintenance, legalDocuments]
      properties:
        name: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        availableLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        branding:
          type: object
          required: [primaryColor, accentColor, hasLogo, hasBackground, backgroundUrl]
          properties:
            primaryColor: { $ref: '#/components/schemas/HexColor' }
            accentColor: { $ref: '#/components/schemas/HexColor' }
            hasLogo: { type: boolean, description: The tenant configured a logo. }
            hasBackground: { type: boolean, description: "The tenant configured a background image (otherwise the default one is served)." }
            logoUrl: { type: string, description: URL of the logo; absent when the tenant has none. }
            backgroundUrl: { type: string, description: URL of the background image (the default one when the tenant has none). }
        limits:
          type: object
          required: [maxTransferBytes, expiryDays]
          properties:
            maxTransferBytes: { $ref: '#/components/schemas/ByteSize' }
            expiryDays: { type: array, items: { $ref: '#/components/schemas/ExpiryDays' } }
        maintenance: { type: boolean }
        maintenanceMessage:
          type: string
          description: |
            Maintenance message set by the super admin, as plain text (render it as text, never as
            HTML): the message in the negotiated language (`Accept-Language`), else in the tenant
            default language, else in English, else in any language available. Absent when
            maintenance mode is off or no message is set. Its language is
            `maintenanceMessageLanguage`, which may differ from `language`.
          example: Upgrade in progress, back around 8 pm.
        maintenanceMessageLanguage:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          description: |
            Language the `maintenanceMessage` is written in, after the fallback described there (it
            may differ from `language`, for example when the message only exists in English): a
            client shows the message marked up with this language (HTML `lang` attribute, RGAA
            criterion 8.7). Present if and only if `maintenanceMessage` is present.
          example: en
        legalDocuments: { type: array, items: { type: string, enum: [legal-notice, privacy-policy] } }
        features: { $ref: '#/components/schemas/TenantFeatures' }
        confidentialityLevels:
          type: array
          description: "Since 1.1. Confidentiality levels offered to the senders (1 to 10), in display order, labels and descriptions in the response language. With a single level, the deposit form hides the selector."
          items: { $ref: '#/components/schemas/PublicConfidentialityLevel' }
    LegalDocument:
      type: object
      required: [document, language, markdown]
      properties:
        document: { type: string, enum: [legal-notice, privacy-policy] }
        language: { $ref: '#/components/schemas/Language' }
        markdown: { type: string, maxLength: 100000 }
        html: { type: string, description: "Sanitized HTML rendering of `markdown`, the same on public reads and on admin reads and writes (empty when the document is not written). Headings are shifted down one level (`#` gives `h2`, `###` gives `h4`): the page showing the document has its own `h1`." }
        updatedAt: { type: string, format: date-time }
    LegalDocumentUpdate:
      type: object
      required: [markdown]
      properties:
        markdown: { type: string, maxLength: 100000 }
      additionalProperties: false

    # --- Deposit sessions -------------------------------------------------
    DepositSessionStart:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        invitationToken: { type: string, pattern: '^inv_[A-Za-z0-9]{22,43}$' }
      additionalProperties: false
    VerificationChallenge:
      type: object
      required: [challengeId, email, expiresAt, attemptsRemaining]
      properties:
        challengeId: { type: string }
        email: { $ref: '#/components/schemas/Email' }
        expiresAt: { type: string, format: date-time }
        attemptsRemaining: { type: integer, minimum: 0, maximum: 2 }
    VerificationCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
      additionalProperties: false
    DepositorKind:
      type: string
      x-extensible-enum: true
      description: |
        `internal`: internal IP and domain. `external`: invited external.
        Since 1.1: `internal_remote` (address of an internal domain already verified from the
        internal network, depositing from outside with a code each time), `reply` (recipient
        replying to a transfer). Reserved for V2: `drop_link`.
      enum: [internal, external, internal_remote, reply]
    DepositSession:
      type: object
      required: [email, kind, csrfToken, expiresAt, limits, canInvite]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        kind: { $ref: '#/components/schemas/DepositorKind' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        limits:
          type: object
          required: [maxTransferBytes, expiryDays]
          properties:
            maxTransferBytes: { $ref: '#/components/schemas/ByteSize' }
            expiryDays: { type: array, items: { $ref: '#/components/schemas/ExpiryDays' } }
        canInvite: { type: boolean }
        invitation:
          type: object
          description: Present for external depositors.
          required: [invitedBy, expiresAt]
          properties:
            invitedBy: { $ref: '#/components/schemas/Email' }
            expiresAt: { type: string, format: date-time }
        reply:
          type: object
          description: Since 1.1. Present for a `reply` session.
          required: [recipient, transferExpiresAt]
          properties:
            recipient:
              allOf: [{ $ref: '#/components/schemas/Email' }]
              description: The sender of the original transfer, single recipient of the reply.
            transferExpiresAt:
              type: string
              format: date-time
              description: Expiry of the original transfer; the session never outlives it.

    # --- Transfers --------------------------------------------------------
    ExpiryDays:
      type: integer
      enum: [1, 7, 30]
    TransferStatus:
      type: string
      x-extensible-enum: true
      description: |
        `uploading` → `scanning` → `available` → `expired` | `deleted`.
        `rejected`: every file was infected or blocklisted.
      enum: [uploading, scanning, available, rejected, expired, deleted]
    ScanStatus:
      type: string
      x-extensible-enum: true
      description: |
        `pending`: not analyzed yet. `scanning`: being analyzed (or waiting for ClamAV to come
        back: the antivirus is fail-closed).
        `clean`: analyzed, no threat found.
        `not_scanned_too_large`: file above the ClamAV size limits, delivered unscanned and flagged
        (the sender is told and the download page says so).
        `not_scanned_encrypted`: encrypted archive whose content ClamAV cannot read, delivered
        unscanned and flagged like `not_scanned_too_large`.
        `infected`: file erased, kept in the list for the sender's information only.
        `scan_error`: the file could not be analyzed after several attempts; it is withheld
        (fail-closed, never downloadable) and the sender is informed.
        `not_scanned_disabled` (since 1.1): the antivirus is disabled for the instance
        (`TT_ANTIVIRUS_ENGINE=none`) or for the tenant; delivered unscanned and flagged like
        `not_scanned_too_large`.
      enum: [pending, scanning, clean, infected, not_scanned_too_large, not_scanned_encrypted, scan_error, not_scanned_disabled]
    FileDeclaration:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Original file name (UTF-8). Stored in the database only; never used on disk. Control and bidirectional characters are rejected.
        size: { $ref: '#/components/schemas/ByteSize' }
        mediaType: { type: string, maxLength: 255, description: Informational only; downloads are always served as `application/octet-stream`. }
        expectedSha256: { $ref: '#/components/schemas/Sha256' }
        path: { $ref: '#/components/schemas/FilePath' }
      additionalProperties: false
    FilePath:
      type: string
      minLength: 1
      maxLength: 1024
      description: |
        Since 1.1. Relative folder of the file inside the transfer (folders dropped in the
        browser), segments separated by `/`: no leading or trailing `/`, no empty, `.` or `..`
        segment, at most 16 segments, each validated like a file name (1 to 255 bytes, no control
        or bidirectional character, no `\`). Absent for a file at the root. Shown in the file
        lists and used as the folder inside the ZIP archive. Names are compared after Unicode
        NFC normalisation and case-insensitively: two files with the same name in the same
        folder, or a file whose name equals a folder of the same level, are told apart by
        suffixing the file (`name (2).ext`) in the lists and in the archive.
      example: plans/2026/site-a
    TransferCreate:
      type: object
      required: [expiryDays, files]
      properties:
        senderEmail:
          allOf: [{ $ref: '#/components/schemas/Email' }]
          description: |
            Mandatory with an API token, forbidden with a deposit session (`400
            validation-failed` on `/senderEmail` otherwise). With a token, it must belong to one of
            the tenant's internal domains, match the token's `allowedSenders` when that list is
            not empty, and the blocklist applies to it.
        recipients:
          type: array
          description: Mandatory for internal depositors and API tokens; ignored for invited externals (the inviter is the recipient).
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/Email' }
        message: { type: string, maxLength: 5000, description: Plain text; never interpreted as HTML. }
        expiryDays: { $ref: '#/components/schemas/ExpiryDays' }
        password: { type: string, minLength: 1, maxLength: 1024, description: Optional; stored as an argon2id hash. }
        deleteAfterFirstDownload:
          type: boolean
          default: false
          description: "Delete the transfer after its first complete download. Since 1.1, with per-recipient links: once every recipient has completed at least one download (bounded by the expiry)."
        language: { $ref: '#/components/schemas/Language' }
        files:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/FileDeclaration' }
        recipientVerification:
          type: boolean
          default: false
          description: "Since 1.1. Every recipient must prove their address with a code before downloading; may be imposed by the confidentiality level."
        maxDownloads:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: "Since 1.1. Maximum number of download starts of the transfer, all recipients together (resumed ranges excluded); absent or null for no limit. A level may impose a lower cap."
        confidentialityLevel:
          allOf: [{ $ref: '#/components/schemas/ConfidentialityLevelKey' }]
          description: "Since 1.1. Key of one of the tenant's confidentiality levels; the tenant default level when omitted."
      additionalProperties: false
    SenderFile:
      type: object
      required: [id, name, size, scanStatus]
      properties:
        id: { type: string }
        name: { type: string }
        size: { $ref: '#/components/schemas/ByteSize' }
        mediaType: { type: string }
        sha256: { $ref: '#/components/schemas/Sha256' }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        scanSignature:
          type: string
          maxLength: 200
          description: |
            Name of the signature ClamAV detected in an `infected` file; absent otherwise. Shown to
            the sender only, never to recipients. It comes from the antivirus: clients must escape
            it when displaying it.
          example: Eicar-Test-Signature
        uploadUrl: { type: string, description: tus upload URL (only while the transfer is `uploading`). }
        uploadOffset: { $ref: '#/components/schemas/ByteSize' }
        path: { $ref: '#/components/schemas/FilePath' }
    SenderTransfer:
      type: object
      required: [id, status, senderEmail, recipients, expiryDays, passwordProtected, deleteAfterFirstDownload, totalBytes, createdAt, files]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        senderEmail: { $ref: '#/components/schemas/Email' }
        recipients: { type: array, items: { $ref: '#/components/schemas/Email' } }
        message: { type: string }
        expiryDays: { $ref: '#/components/schemas/ExpiryDays' }
        expiresAt:
          type: string
          format: date-time
          description: |
            Set when the transfer becomes `available`: the full chosen duration (`expiryDays`)
            starts then, so a delayed analysis does not shorten it.
        passwordProtected: { type: boolean }
        deleteAfterFirstDownload: { type: boolean }
        totalBytes: { $ref: '#/components/schemas/ByteSize' }
        createdAt: { type: string, format: date-time }
        uploadExpiresAt: { type: string, format: date-time }
        finalizedAt: { type: string, format: date-time }
        downloadUrl:
          type: string
          format: uri
          description: |
            Public download page, once the transfer is `available`, for a transfer with a single
            shared link (created before 1.1). Since 1.1, absent for new transfers (the type is
            unchanged, so strict 1.0 clients keep working): each recipient
            has their own link, mailed to them only and never returned to the sender or to an API
            token; follow them with `recipientTracking`.
        files: { type: array, items: { $ref: '#/components/schemas/SenderFile' } }
        recipientVerification: { type: boolean, description: "Since 1.1. Recipients must prove their address by code before downloading." }
        maxDownloads: { type: [integer, 'null'], minimum: 1, maximum: 1000, description: "Since 1.1. Maximum number of download starts; null for no limit." }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevelRef' }
        replyToTransferId: { type: string, description: "Since 1.1. For a reply, the original transfer." }
        recipientTracking:
          type: array
          description: |
            Since 1.1, once the transfer is `available` and for a transfer with per-recipient
            links: the tracking status of each recipient (verification and download dates), never
            their link.
          items: { $ref: '#/components/schemas/RecipientTracking' }

    # --- Invitations ------------------------------------------------------
    InvitationStatus:
      type: string
      x-extensible-enum: true
      enum: [pending, used, expired, revoked]
    InvitationCreate:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        message:
          type: string
          maxLength: 2000
          description: Optional text for the invited person. Control and invisible characters are removed.
        language: { $ref: '#/components/schemas/Language' }
      additionalProperties: false
    Invitation:
      type: object
      required: [id, email, invitedBy, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        email: { $ref: '#/components/schemas/Email' }
        invitedBy:
          type: string
          maxLength: 254
          description: "Email address of the internal user who issued the invitation, or the pseudonym `erased-<16 hex>` when that user's data was erased (GDPR); such an invitation is always revoked."
        status: { $ref: '#/components/schemas/InvitationStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    InvitationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    PublicInvitation:
      type: object
      required: [email, invitedBy, expiresAt]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        invitedBy: { $ref: '#/components/schemas/Email' }
        message: { type: string }
        expiresAt: { type: string, format: date-time }

    # --- Downloads --------------------------------------------------------
    TransferPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: An empty or missing password gets `400` with the field code `required`.
      additionalProperties: false
    PublicFile:
      type: object
      required: [id, name, size, sha256, scanStatus, downloadUrl]
      properties:
        id: { type: string }
        name: { type: string }
        size: { $ref: '#/components/schemas/ByteSize' }
        mediaType: { type: string }
        sha256: { $ref: '#/components/schemas/Sha256' }
        scanStatus:
          allOf: [{ $ref: '#/components/schemas/ScanStatus' }]
          description: '`clean`, or `not_scanned_too_large` / `not_scanned_encrypted` / `not_scanned_disabled` (since 1.1; delivered unscanned: the page must say so).'
        downloadUrl: { type: string }
        path: { $ref: '#/components/schemas/FilePath' }
    PublicTransfer:
      type: object
      required: [senderEmail, expiresAt, passwordProtected, locked]
      properties:
        senderEmail: { $ref: '#/components/schemas/Email' }
        message: { type: string, description: "Plain text, to be rendered as text (never HTML)." }
        expiresAt: { type: string, format: date-time }
        passwordProtected: { type: boolean }
        locked: { type: boolean, description: True when a password is required and not yet provided. }
        deleteAfterFirstDownload: { type: boolean }
        totalBytes:
          allOf: [{ $ref: '#/components/schemas/ByteSize' }]
          description: Total size of the listed files; absent while `locked`.
        archiveUrl: { type: string, description: 'URL of the ZIP archive of the listed files; absent while `locked`.' }
        files:
          type: array
          description: |
            Absent while `locked`. Only the deliverable files: infected files and files withheld
            after an analysis error (`scan_error`) are never listed.
          items: { $ref: '#/components/schemas/PublicFile' }
        verificationRequired: { type: boolean, description: "Since 1.1. The link is a per-recipient link whose recipient must prove their address by code." }
        verified: { type: boolean, description: "Since 1.1. With `verificationRequired`: the recipient is verified on this browser. While false, `locked` is true and nothing but the verification can be done." }
        recipientEmailMasked:
          type: string
          description: "Since 1.1. Masked address of the recipient the link was issued for (`c***@customer.example.net`), present while the verification is awaited."
          example: c***@customer.example.net
        downloadsRemaining: { type: integer, minimum: 0, description: "Since 1.1. Download starts left before `maxDownloads` is reached; absent without limit or while `locked`." }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevelRef' }
        replyAllowed: { type: boolean, description: "Since 1.1. The recipient may send files back to the sender (`startTransferReply`); absent while `locked`." }

    # --- Admin auth -------------------------------------------------------
    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: { type: boolean }
    Username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
    AdminPassword:
      type: string
      minLength: 12
      maxLength: 1024
      description: 12 to 1024 characters (Unicode code points); no other rule is applied.
    SetupRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/AdminPassword' }
        setupToken: { type: string, maxLength: 128 }
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 1024 }
      additionalProperties: false
    LoginState:
      type: object
      required: [status, csrfToken]
      properties:
        status:
          type: string
          x-extensible-enum: true
          description: Reserved for V2 - `sso_redirect`.
          enum: [totp_required, totp_enrollment_required, password_change_required, authenticated]
        csrfToken: { type: string }
    TotpCode:
      type: object
      description: Exactly one of `code` or `recoveryCode`.
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, maxLength: 32 }
      oneOf:
        - required: [code]
        - required: [recoveryCode]
      additionalProperties: false
    TotpEnrollment:
      type: object
      required: [secret, otpauthUri, qrCodePng]
      properties:
        secret: { type: string, description: Base32 secret (shown once). }
        otpauthUri: { type: string }
        qrCodePng: { type: string, contentEncoding: base64 }
        csrfToken: { type: string }
    TotpConfirmed:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: { type: array, items: { type: string }, minItems: 8, maxItems: 10, description: "Single-use codes, shown once, stored hashed." }
        csrfToken: { type: string }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        newPassword: { $ref: '#/components/schemas/AdminPassword' }
      additionalProperties: false
    PasswordConfirmation:
      type: object
      required: [currentPassword]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
      additionalProperties: false
    TotpReenrollment:
      type: object
      description: Optional body of `startTotpEnrollment`. `currentPassword` is required to re-enroll (TOTP already enabled) and ignored for a first enrollment.
      properties:
        currentPassword: { type: string, maxLength: 1024 }
      additionalProperties: false
    ActivationRequest:
      type: object
      required: [activationToken, password]
      properties:
        activationToken: { type: string, maxLength: 128 }
        password: { $ref: '#/components/schemas/AdminPassword' }
      additionalProperties: false
    AdminRole:
      type: string
      x-extensible-enum: true
      description: Reserved for V2 - `auditor` (read-only on assigned tenants).
      enum: [super_admin, delegated_admin]
    TenantRef:
      type: object
      required: [id, name, fqdn]
      properties:
        id: { type: string }
        name: { type: string }
        fqdn: { type: string }
    AdminMe:
      type: object
      required: [id, username, email, role, totpEnabled, tenants, csrfToken]
      properties:
        id: { type: string }
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/AdminRole' }
        totpEnabled: { type: boolean }
        tenants: { type: array, items: { $ref: '#/components/schemas/TenantRef' } }
        csrfToken: { type: string }
        language: { $ref: '#/components/schemas/Language' }
    Admin:
      type: object
      required: [id, username, email, role, tenantIds, totpEnabled, activated, disabled, createdAt]
      properties:
        id: { type: string }
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/AdminRole' }
        tenantIds: { type: array, items: { type: string }, description: Empty for super admins (implicit access to all tenants). }
        totpEnabled: { type: boolean }
        activated: { type: boolean, description: True once the admin has chosen a password from an activation link; false after a credentials reset until the new link is used. }
        requireTotp: { type: boolean, description: Always true for super admins. }
        disabled: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminWithActivation:
      description: An admin account with its new single-use activation link, returned once by `createAdmin` and `resetAdminCredentials`. Only a hash of the link token is stored; the link is never sent by email.
      allOf:
        - $ref: '#/components/schemas/Admin'
        - type: object
          required: [activationUrl, activationExpiresAt]
          properties:
            activationUrl:
              type: string
              format: uri
              description: 'Activation link on the admin host: `https://<admin host>/admin/activate#<token>`. The token is in the fragment, so that it never reaches a server log; the page posts it to `activateAdmin`.'
            activationExpiresAt: { type: string, format: date-time, description: End of validity of the link (72 hours). }
    AdminList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Admin' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    AdminCreate:
      type: object
      required: [username, email, role]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/AdminRole' }
        tenantIds: { type: array, items: { type: string }, uniqueItems: true }
        requireTotp: { type: boolean, default: true }
      additionalProperties: false
    AdminUpdate:
      type: object
      description: |
        Changes of an account; absent fields are left unchanged. Promoting to `super_admin`
        requires an activated account with TOTP enabled and clears the tenant assignments (a super
        admin reaches every tenant); demoting to `delegated_admin` requires `tenantIds`. Nobody
        can disable or demote their own account, and the last usable super admin (not disabled,
        activated, TOTP enabled) can be neither disabled nor demoted (`409 state-conflict`).
      properties:
        email: { $ref: '#/components/schemas/Email' }
        role: { $ref: '#/components/schemas/AdminRole' }
        tenantIds: { type: array, items: { type: string }, uniqueItems: true }
        requireTotp: { type: boolean }
        disabled: { type: boolean }
      additionalProperties: false

    # --- Admin tenants ----------------------------------------------------
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
    Fqdn:
      type: string
      maxLength: 253
      pattern: '^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+([a-z]{2,63}|xn--[a-z0-9-]{1,59})$'
    Tenant:
      type: object
      required: [id, name, fqdn, defaultLanguage, maxTransferBytes, maxTransferCeiling, status, storageQuotaBytes, storageUsedBytes, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        fqdn: { $ref: '#/components/schemas/Fqdn' }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        maxTransferBytes: { type: integer, format: int64, minimum: 1, maximum: 21474836480, description: Per-transfer size limit. }
        maxTransferCeiling:
          type: integer
          format: int64
          minimum: 1
          maximum: 21474836480
          description: "Ceiling of `maxTransferBytes`, set by the super admin: a delegated admin may set `maxTransferBytes` at most to it."
        status:
          type: string
          enum: [active, deleting]
          description: "`deleting` while a deletion is in progress or left unfinished (seen by the super admin only)."
        storageQuotaBytes: { $ref: '#/components/schemas/ByteSize' }
        storageUsedBytes: { $ref: '#/components/schemas/ByteSize' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        allowRemoteInternalDeposit: { type: boolean, default: false, description: "Since 1.1. Addresses of an internal domain already verified from the internal network may deposit from outside, with a code each time." }
        allowTransferReply: { type: boolean, default: false, description: "Since 1.1. Recipients may send files back to the sender of a transfer (`startTransferReply`)." }
        antivirusEnabled: { type: boolean, default: true, description: "Since 1.1. Antivirus analysis of the tenant's files; changed by the super admin only." }
        webhookIncludeAddresses: { type: boolean, default: false, description: "Since 1.1. The tenant webhooks receive the sender and recipient addresses concerned (`WebhookEvent.addresses`); off by default (minimal payloads)." }
        antivirusEffective: { type: boolean, readOnly: true, description: "Since 1.1. Read only: files of the tenant are really analysed (`antivirusEnabled` and an instance engine other than `none`)." }
    TenantList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    TenantCreate:
      type: object
      required: [name, fqdn, defaultLanguage, storageQuotaBytes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        fqdn: { $ref: '#/components/schemas/Fqdn' }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        storageQuotaBytes: { type: integer, format: int64, minimum: 1 }
        maxTransferBytes: { type: integer, format: int64, minimum: 1, maximum: 21474836480, default: 21474836480 }
        maxTransferCeiling:
          type: integer
          format: int64
          minimum: 1
          maximum: 21474836480
          description: "Ceiling of `maxTransferBytes` for the delegated admins; defaults to `maxTransferBytes`, which must not exceed it."
      additionalProperties: false
    TenantUpdate:
      type: object
      description: |
        JSON Merge Patch of the tenant general settings; `null` is refused on every field.
      # Decoded by the handler itself, which must tell a null field (refused) from an absent one.
      x-go-type: json.RawMessage
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        fqdn: { $ref: '#/components/schemas/Fqdn' }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        storageQuotaBytes: { type: integer, format: int64, minimum: 1, description: Super admin only. }
        maxTransferBytes: { type: integer, format: int64, minimum: 1, maximum: 21474836480, description: "A delegated admin may set it at most to `maxTransferCeiling`." }
        maxTransferCeiling:
          type: integer
          format: int64
          minimum: 1
          maximum: 21474836480
          description: "Ceiling of `maxTransferBytes` (super admin only); lowering it below `maxTransferBytes` lowers the limit too."
        allowRemoteInternalDeposit: { type: boolean, description: "Since 1.1." }
        allowTransferReply: { type: boolean, description: "Since 1.1." }
        antivirusEnabled: { type: boolean, description: "Since 1.1. Super admin only." }
        webhookIncludeAddresses: { type: boolean, description: "Since 1.1." }
      additionalProperties: false
    ContrastResult:
      type: object
      required: [pair, ratio, level]
      properties:
        pair:
          type: string
          x-extensible-enum: true
          enum: [primary-on-light, accent-on-light, text-on-primary, primary-on-dark, accent-on-dark]
          description: "Since 1.1, the `*-on-dark` pairs check the colours on the dark theme background as well."
        ratio: { type: number }
        level: { type: string, enum: [AAA, AA, fail] }
    Branding:
      type: object
      required: [primaryColor, accentColor, hasLogo, hasBackground, contrast]
      properties:
        primaryColor: { $ref: '#/components/schemas/HexColor' }
        accentColor: { $ref: '#/components/schemas/HexColor' }
        hasLogo: { type: boolean }
        hasBackground: { type: boolean }
        contrast: { type: array, items: { $ref: '#/components/schemas/ContrastResult' } }
    BrandingUpdate:
      type: object
      required: [primaryColor, accentColor]
      properties:
        primaryColor: { $ref: '#/components/schemas/HexColor' }
        accentColor: { $ref: '#/components/schemas/HexColor' }
      additionalProperties: false
    NetworkRules:
      type: object
      required: [internalCidrs, internalDomains]
      properties:
        internalCidrs:
          type: array
          maxItems: 500
          items: { type: string, description: IPv4 or IPv6 CIDR. }
        internalDomains:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 253, description: Exact domain match (subdomains must be listed explicitly). }
      additionalProperties: false
    SmtpSecurity:
      type: string
      enum: [none, starttls, tls]
      description: '`none` is intended for an unauthenticated relay on the internal Docker network.'
    SmtpSettings:
      type: object
      required: [host, port, security, passwordSet, fromAddress]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { $ref: '#/components/schemas/SmtpSecurity' }
        username: { type: [string, 'null'], maxLength: 320 }
        passwordSet: { type: boolean }
        fromAddress: { $ref: '#/components/schemas/Email' }
        fromName: { type: [string, 'null'], maxLength: 100 }
    SmtpSettingsUpdate:
      type: object
      required: [host, port, security, fromAddress]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { $ref: '#/components/schemas/SmtpSecurity' }
        username: { type: [string, 'null'], maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1024, description: "New password. Omit to keep the stored one." }
        removePassword: { type: boolean, default: false, description: "Remove the stored password (unauthenticated relay). Cannot be combined with `password`." }
        fromAddress: { $ref: '#/components/schemas/Email' }
        fromName: { type: [string, 'null'], maxLength: 100 }
      additionalProperties: false
      not:
        required: [password, removePassword]
    SmtpTest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/Email' }
      additionalProperties: false
    SmtpTestResult:
      type: object
      required: [success, durationMs, stage]
      properties:
        success: { type: boolean }
        durationMs: { type: integer }
        stage:
          type: string
          x-extensible-enum: true
          enum: [settings, connect, tls, greeting, starttls, auth, envelope, data, done, unknown]
          description: "How far the SMTP dialogue went: `done` on success, otherwise the step that failed."
        error: { type: string, description: "SMTP error message, sanitized: never contains credentials nor control characters, truncated to 300 characters." }
    DnsRecordCheck:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, warning, missing, error] }
        record: { type: string }
        message: { type: string }
    MailDnsCheck:
      type: object
      required: [domain, spf, dkim, dmarc]
      properties:
        domain: { type: string }
        spf: { $ref: '#/components/schemas/DnsRecordCheck' }
        dkim:
          type: object
          required: [status, selectors]
          properties:
            status: { type: string, enum: [ok, warning, missing, error] }
            selectors:
              type: array
              items:
                type: object
                required: [selector, found]
                properties:
                  selector: { type: string }
                  found: { type: boolean }
        dmarc: { $ref: '#/components/schemas/DnsRecordCheck' }
    EmailTemplateKey:
      type: string
      x-extensible-enum: true
      description: |
        Mail template of an entity. `file-problems` is the alert sent to the sender when files of
        a transfer are infected (erased) or withheld after an analysis error (`scan_error`);
        `file-not-scanned` tells the sender that files were released unscanned because they were
        too large, too complex or encrypted to be analysed; `transfer-notification` and
        `transfer-confirmation` go to the recipients and to the sender once a transfer is
        available; `first-download` tells the sender, only once, that the transfer has been
        downloaded in full for the first time, and when it will be erased if it is deleted after
        its first download; `antivirus-unavailable` goes to the delegated admins of an entity
        (else the super admins) when the antivirus has stayed unreachable beyond the grace period
        while transfers of the entity wait for analysis, once per outage.
        Since 1.1: `expiry-reminder` (recipients who have not downloaded yet, the day before
        expiry, once per expiry date, skipped when less than 36 hours remained at availability), `abuse-alert` (delegated admins, abuse threshold or unusual activity),
        `abuse-report` (delegated admins, report from a download page), `my-transfers-link`
        (sender, "My transfers" access link) and `recipient-verification-code` (recipient of a
        per-recipient link).
      enum:
        - verification-code
        - transfer-notification
        - transfer-confirmation
        - first-download
        - file-problems
        - file-not-scanned
        - invitation
        - quota-warning
        - quota-reached
        - antivirus-unavailable
        - expiry-reminder
        - abuse-alert
        - abuse-report
        - my-transfers-link
        - recipient-verification-code
    EmailTemplateSummary:
      type: object
      required: [key, language, customised]
      properties:
        key: { $ref: '#/components/schemas/EmailTemplateKey' }
        language: { $ref: '#/components/schemas/Language' }
        customised: { type: boolean }
        updatedAt: { type: string, format: date-time }
    EmailTemplate:
      type: object
      required: [key, language, customised, subject, bodyHtml, bodyText, variables, requiredVariables]
      properties:
        key: { $ref: '#/components/schemas/EmailTemplateKey' }
        language: { $ref: '#/components/schemas/Language' }
        customised: { type: boolean }
        subject: { type: string, maxLength: 255 }
        bodyHtml: { type: string, maxLength: 100000 }
        bodyText: { type: string, maxLength: 100000 }
        variables: { type: array, items: { type: string }, description: "Variables available in this template." }
        requiredVariables:
          type: array
          items: { type: string }
          description: "Subset of `variables` that must appear in both the HTML and the text body (such as the download link or the verification code); a template without one of them is refused. Empty when none is required."
        updatedAt: { type: string, format: date-time }
    EmailTemplateUpdate:
      type: object
      required: [subject, bodyHtml, bodyText]
      properties:
        subject: { type: string, minLength: 1, maxLength: 255 }
        bodyHtml: { type: string, maxLength: 100000 }
        bodyText: { type: string, maxLength: 100000 }
      additionalProperties: false
    EmailPreview:
      type: object
      required: [subject, bodyHtml, bodyText]
      properties:
        subject: { type: string }
        bodyHtml:
          type: string
          description: >-
            Complete HTML document of the mail, sanitized. Style attributes and style elements
            are removed in the preview (the administration CSP would block them), and images are
            replaced by their alt text in brackets; the mail sent keeps them.
        bodyText: { type: string }

    # --- Admin operations -------------------------------------------------
    TransferOrigin:
      type: string
      x-extensible-enum: true
      description: "Since 1.1: `internal_remote` (internal address depositing from outside), `reply` (recipient replying to a transfer). Reserved for V2: `drop_link`."
      enum: [internal, external, api, internal_remote, reply]
    AdminTransfer:
      type: object
      required: [id, status, origin, senderEmail, recipients, fileCount, totalBytes, passwordProtected, deleteAfterFirstDownload, createdAt, downloadCount]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        origin: { $ref: '#/components/schemas/TransferOrigin' }
        senderEmail: { $ref: '#/components/schemas/Email' }
        recipients: { type: array, items: { $ref: '#/components/schemas/Email' } }
        invitationId: { type: string }
        apiTokenId: { type: string }
        fileCount: { type: integer }
        totalBytes: { $ref: '#/components/schemas/ByteSize' }
        passwordProtected: { type: boolean }
        deleteAfterFirstDownload: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        firstDownloadedAt: { type: [string, 'null'], format: date-time }
        downloadCount:
          type: integer
          minimum: 0
          description: "Number of download starts of a file or of the archive (HEAD requests and resumed ranges excluded)."
        recipientVerification: { type: boolean, description: "Since 1.1." }
        maxDownloads: { type: [integer, 'null'], minimum: 1, maximum: 1000, description: "Since 1.1. Null for no limit." }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevelRef' }
        replyToTransferId: { type: string, description: "Since 1.1. For a reply, the original transfer." }
    AdminTransferDetail:
      allOf:
        - $ref: '#/components/schemas/AdminTransfer'
        - type: object
          required: [files]
          properties:
            senderIp:
              type: [string, 'null']
              description: "Client IP address of the sender when the transfer was created. Absent or null when unknown: transfers created before this field existed."
            files:
              type: array
              items:
                type: object
                required: [id, name, size, scanStatus]
                properties:
                  id: { type: string }
                  name: { type: string }
                  size: { $ref: '#/components/schemas/ByteSize' }
                  mediaType: { type: string }
                  sha256: { $ref: '#/components/schemas/Sha256' }
                  scanStatus: { $ref: '#/components/schemas/ScanStatus' }
                  path: { $ref: '#/components/schemas/FilePath' }
            recipientTracking:
              type: array
              description: "Since 1.1. Per-recipient download tracking, for a transfer with per-recipient links."
              items: { $ref: '#/components/schemas/RecipientTracking' }
    AdminTransferList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminTransfer' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    AdminReason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: "Free text recorded in the audit log after its e-mail addresses are replaced by `[address]`, then cut to 500 characters (the replacement may lengthen it)."
      additionalProperties: false
    ResendRequest:
      type: object
      properties:
        recipients:
          type: array
          description: Subset of the original recipients; all of them when omitted.
          items: { $ref: '#/components/schemas/Email' }
      additionalProperties: false
    BlocklistKind:
      type: string
      enum: [email, domain, sha256]
    BlocklistEntryCreate:
      type: object
      required: [kind, value]
      properties:
        kind: { $ref: '#/components/schemas/BlocklistKind' }
        value:
          type: string
          minLength: 1
          maxLength: 320
          description: "Trimmed and normalised to lower case, then validated according to `kind`: an email address, a domain name (no `@`), or a SHA-256 fingerprint (64 hexadecimal characters)."
        comment: { type: string, maxLength: 500 }
      additionalProperties: false
    BlocklistEntry:
      type: object
      required: [id, kind, value, createdBy, createdAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/BlocklistKind' }
        value: { type: string }
        comment: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    BlocklistList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BlocklistEntry' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    AllowedCidrs:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      description: IPv4 or IPv6 CIDR ranges the token may be used from. `0.0.0.0/0` and `::/0` mean any address.
      items: { type: string, maxLength: 43 }
    AllowedSenders:
      type: array
      maxItems: 100
      uniqueItems: true
      description: |
        Sender addresses the token may deposit as. Each entry is either a full address (strict
        syntax, no display name; normalized to lowercase with a punycode domain) or a mail domain
        (normalized to lowercase punycode, no trailing dot). A `senderEmail` is allowed when it
        equals an address entry or its domain equals a domain entry exactly: a domain entry does
        not cover its subdomains. Two entries equal once normalized are refused. An empty list
        (the default) allows any address of the tenant's internal domains; in every case the
        address must also belong to an internal domain and not be blocklisted.
      items: { type: string, minLength: 1, maxLength: 254 }
      example: [reporting@entity-a.example.com, erp.entity-a.example.com]
    ApiToken:
      type: object
      required: [id, name, prefix, allowedCidrs, allowedSenders, createdBy, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: "First characters of the token, to recognise it." }
        allowedCidrs: { $ref: '#/components/schemas/AllowedCidrs' }
        allowedSenders: { $ref: '#/components/schemas/AllowedSenders' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: Last successful use of the token. Updated at most once a minute per token, so it may lag behind the real last use by up to a minute.
        expiresAt: { type: [string, 'null'], format: date-time, description: "Optional expiry; `null` means the token never expires." }
        revokedAt: { type: [string, 'null'], format: date-time, description: "Revocation date; a revoked token is refused immediately." }
    ApiTokenCreate:
      type: object
      required: [name, allowedCidrs]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        allowedCidrs: { $ref: '#/components/schemas/AllowedCidrs' }
        allowedSenders:
          allOf: [{ $ref: '#/components/schemas/AllowedSenders' }]
          description: Optional; absent or empty allows any address of the tenant's internal domains.
        expiresAt: { type: [string, 'null'], format: date-time }
      additionalProperties: false
    ApiTokenUpdate:
      type: object
      description: |
        JSON Merge Patch of an API token; `null` is refused on every field. A list given replaces
        the current one: `allowedSenders: []` lifts the sender restriction (any internal address).
        An unknown member is refused (`400 validation-failed`, `invalid-format` on its pointer).
      # Decoded by the handler itself, which must tell a null field (refused) from an absent one.
      x-go-type: json.RawMessage
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        allowedCidrs: { $ref: '#/components/schemas/AllowedCidrs' }
        allowedSenders: { $ref: '#/components/schemas/AllowedSenders' }
      additionalProperties: false
    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "Secret value, returned only once." }
    AuditAction:
      type: string
      x-extensible-enum: true
      description: |
        Audit action, `<object>.<verb>`. The list is extensible: new actions may be added within
        the API version, so clients must accept unknown values, and filters accept any value of
        this form (`^[a-z_]+\.[a-z_]+$`, at most 64 characters). Notable actions:
        `transfer.downloaded` is recorded at the start of the download of a file or of the
        archive (never for HEAD requests or resumed ranges); `transfer.deleted` by an admin carries
        the redacted reason; `data_subject.searched` and `data_subject.erased` never contain the
        address; `blocklist.updated` stores the value for the `domain` and `sha256` kinds only;
        `quota.warning` and `quota.reached` are recorded even when no mail can be sent;
        `api_token.created`, `api_token.updated` and `api_token.revoked` never contain the secret;
        `api_token.used` is recorded once per transfer created with an API token (not per request);
        `config.updated` (instance settings, without tenant) carries the names of the changed
        fields only (`details.fields`), never their values; `maintenance.enabled` and
        `maintenance.disabled` (object `system`/`maintenance`, without tenant) carry the list of
        message languages only (`details.languages`); `master_key.rotation_started`,
        `master_key.rotation_completed` and `master_key.rotation_failed` (without tenant) carry
        the key identifiers, never key material; `disk.alert_raised` and `disk.alert_cleared`
        (object `system`/`disk`, actor `system`, without tenant) are recorded even when no system
        mail can be sent; `antivirus.alert_raised` (clamd unreachable beyond the grace period,
        details `outageSeconds`, `waitingTransfers` and `tenants`) and `antivirus.alert_cleared`
        (clamd answering again, details `outageSeconds`) use object `system`/`antivirus`, actor
        `system`, without tenant, and are recorded even when no mail can be sent.
        Since 1.1: deposits from outside (`internal_remote`) carry `details.remote: true` on
        `transfer.created`; `transfer.extended` carries the old and new expiry and the number of
        extensions; `transfer.recipient_refused` (recipient domain rules, audit only, never in the
        security log) names the refused domains; `antivirus.scans_released` (actor `system`,
        without tenant) counts the files released as `not_scanned_disabled` at a start with
        `TT_ANTIVIRUS_ENGINE=none`; `abuse.report_reopened` names the report;
        `transfer.reminder_sent` the number of recipients; `recipient.verified` names the
        recipient link, never the code; `abuse.threshold_exceeded` and `abuse.unusual_activity`
        (actor `system`) name the rule and the sender; `abuse.reported` and `abuse.report_closed`
        name the report; `webhook.*` never carry the URL (host only) nor the secret;
        `tenant.antivirus_disabled` and `tenant.antivirus_enabled` are recorded for the super
        admin's change of `antivirusEnabled`; `my_transfers.link_requested` is recorded only when
        a link is actually sent.
      enum:
        - transfer.created
        - transfer.finalized
        - transfer.downloaded
        - transfer.expired
        - transfer.deleted
        - transfer.notification_resent
        - file.infected
        - file.not_scanned
        - address.verified
        - invitation.created
        - invitation.used
        - invitation.revoked
        - quota.warning
        - quota.reached
        - api_token.created
        - api_token.updated
        - api_token.used
        - api_token.revoked
        - admin.login
        - admin.login_failed
        - admin.logout
        - admin.totp_enrolled
        - admin.totp_disabled
        - admin.recovery_code_used
        - admin.password_changed
        - admin.created
        - admin.updated
        - admin.deleted
        - admin.credentials_reset
        - admin.activated
        - admin.totp_reset_local
        - admin.password_reset_local
        - tenant.created
        - tenant.updated
        - tenant.deletion_started
        - tenant.deleted
        - tenant.branding_updated
        - tenant.asset_uploaded
        - tenant.asset_deleted
        - tenant.network_updated
        - tenant.smtp_updated
        - tenant.smtp_tested
        - tenant.template_updated
        - tenant.template_reset
        - tenant.legal_updated
        - config.updated
        - blocklist.updated
        - data_subject.searched
        - data_subject.erased
        - maintenance.enabled
        - maintenance.disabled
        - master_key.rotation_started
        - master_key.rotation_completed
        - master_key.rotation_failed
        - disk.alert_raised
        - disk.alert_cleared
        - antivirus.alert_raised
        - antivirus.alert_cleared
        - setup.completed
        - transfer.extended
        - transfer.reminder_sent
        - transfer.reply_created
        - recipient.verified
        - abuse.threshold_exceeded
        - abuse.unusual_activity
        - abuse.reported
        - abuse.report_closed
        - abuse.report_reopened
        - transfer.recipient_refused
        - antivirus.scans_released
        - webhook.created
        - webhook.updated
        - webhook.deleted
        - webhook.tested
        - tenant.confidentiality_updated
        - tenant.recipient_rules_updated
        - tenant.abuse_settings_updated
        - tenant.antivirus_disabled
        - tenant.antivirus_enabled
        - my_transfers.link_requested
        - my_transfers.signed_in
    AuditEvent:
      type: object
      required: [id, occurredAt, actor, action, object]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        tenantId:
          description: Tenant of the event; absent for an event without tenant (setup, admin management, maintenance, key rotation).
          type: [string, 'null']
        actor:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, x-extensible-enum: true, enum: [depositor, recipient, admin, api_token, system] }
            id: { type: string }
        ip: { type: string }
        action: { $ref: '#/components/schemas/AuditAction' }
        object:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: string }
        details: { type: object, additionalProperties: true }
    AuditEventList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    TenantStats:
      type: object
      required: [period, transferCount, bytesUploaded, downloadCount, bytesDownloaded, virusDetections, storageUsedBytes, storageQuotaBytes, storageUsedRatio, series]
      properties:
        period: { type: string, enum: [7d, 30d, 12m] }
        transferCount:
          type: integer
          minimum: 0
          description: "Transfers finalized during the period (counted when they are finalized, whatever happened to them afterwards)."
        bytesUploaded:
          allOf: [{ $ref: '#/components/schemas/ByteSize' }]
          description: "Total size of the transfers counted in `transferCount`."
        downloadCount:
          type: integer
          minimum: 0
          description: "Download starts of a file or of the archive during the period; HEAD requests and resumed ranges are not counted."
        bytesDownloaded:
          allOf: [{ $ref: '#/components/schemas/ByteSize' }]
          description: "Plaintext bytes actually served to recipients during the period."
        virusDetections:
          type: integer
          minimum: 0
          description: "Files found infected by the antivirus during the period."
        storageUsedBytes:
          allOf: [{ $ref: '#/components/schemas/ByteSize' }]
          description: "Storage currently used by the tenant (current value, not limited to the period)."
        storageQuotaBytes:
          allOf: [{ $ref: '#/components/schemas/ByteSize' }]
          description: "Storage quota of the tenant."
        storageUsedRatio: { type: number, minimum: 0, description: "`storageUsedBytes` / `storageQuotaBytes` (may exceed 1)." }
        series:
          type: array
          description: |
            Breakdown of `transferCount` and `bytesUploaded` over the period, oldest first, with a
            zero-filled point for every period without activity: one point per UTC day for `7d`
            (7 points) and `30d` (30 points), today included; one point per calendar month (UTC)
            for `12m` (12 points, current month included), whose `date` is the first day of the
            month.
          items:
            type: object
            required: [date, transfers, bytesUploaded]
            properties:
              date: { type: string, format: date }
              transfers: { type: integer }
              bytesUploaded: { $ref: '#/components/schemas/ByteSize' }
    DataSubjectRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
      additionalProperties: false
    DataSubjectSummary:
      type: object
      required: [email, verifiedAddress, transfersAsSender, transfersAsRecipient, invitations, auditEvents, securityEvents]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        verifiedAddress: { type: boolean }
        transfersAsSender: { type: integer }
        transfersAsRecipient: { type: integer }
        invitations: { type: integer }
        auditEvents: { type: integer, description: "Audit events of the tenant whose actor is the address." }
        securityEvents: { type: integer, description: "Always 0: the security log never records e-mail addresses." }
    DataSubjectEraseReport:
      type: object
      required: [transfersDeleted, recipientEntriesRemoved, verifiedAddressDeleted, invitationsDeleted, logEntriesPseudonymised]
      properties:
        transfersDeleted: { type: integer }
        recipientEntriesRemoved: { type: integer }
        verifiedAddressDeleted: { type: boolean }
        invitationsDeleted: { type: integer }
        logEntriesPseudonymised: { type: integer }
        abuseReports: { type: integer, description: "Since 1.1. Abuse reports pseudonymised (made by the address, or about its transfers)." }
        accessLinks: { type: integer, description: "Since 1.1. \"My transfers\" access links and sessions deleted." }

    # --- System -----------------------------------------------------------
    GlobalStats:
      type: object
      required: [period, disk, tenants]
      properties:
        period: { type: string, enum: [7d, 30d, 12m] }
        disk:
          type: object
          description: "Usage of the filesystem that holds the data directory (encrypted files)."
          required: [totalBytes, usedBytes, usedRatio, alertThreshold, alertActive, alertMailConfigured]
          properties:
            totalBytes: { $ref: '#/components/schemas/ByteSize' }
            usedBytes: { $ref: '#/components/schemas/ByteSize' }
            usedRatio: { type: number, minimum: 0, maximum: 1 }
            alertThreshold:
              type: number
              description: "Ratio at or above which the super admins are alerted (`diskAlertThreshold` of the system settings)."
            alertActive:
              type: boolean
              description: "The disk alert is raised (the usage reached the threshold and has not yet fallen 5 points below it)."
            alertMailConfigured:
              type: boolean
              description: "The system SMTP server (`TT_SYSTEM_SMTP_*`) is configured, so the disk alert is also sent by mail; otherwise it is only visible here, in the audit log and in the application log."
        tenants:
          type: array
          description: "One row per active tenant (tenants being deleted are excluded); counters defined as in `TenantStats`."
          items:
            type: object
            required: [tenantId, name, transferCount, bytesUploaded, storageUsedBytes, storageQuotaBytes, storageUsedRatio]
            properties:
              tenantId: { type: string }
              name: { type: string }
              transferCount: { type: integer }
              bytesUploaded: { $ref: '#/components/schemas/ByteSize' }
              storageUsedBytes: { $ref: '#/components/schemas/ByteSize' }
              storageQuotaBytes: { $ref: '#/components/schemas/ByteSize' }
              storageUsedRatio: { type: number }
    SystemSettings:
      type: object
      required: [diskAlertThreshold, alertEmail]
      properties:
        diskAlertThreshold:
          type: number
          minimum: 0.5
          maximum: 0.99
          default: 0.85
          description: Disk usage ratio at or above which the disk alert is raised; it clears 5 points below.
        alertEmail:
          type: [string, 'null']
          format: email
          maxLength: 254
          description: "Additional recipient of the disk alert (besides the super admins); `null` when none."
          # Plain string: the service validates the address (see Email).
          x-go-type: string
        antivirusEngine:
          allOf: [{ $ref: '#/components/schemas/AntivirusEngine' }]
          readOnly: true
          description: "Since 1.1. Read only: the antivirus engine selected by `TT_ANTIVIRUS_ENGINE`, configured by environment variables only."
      additionalProperties: false
    SystemSettingsUpdate:
      type: object
      description: |
        JSON Merge Patch of the instance settings. `alertEmail: null` removes the address;
        `diskAlertThreshold: null` is refused. The address must be a bare mail address
        (`invalid-email` otherwise). An unknown member is refused.
      # Decoded by the handler itself, which must tell a null field from an absent one.
      x-go-type: json.RawMessage
      properties:
        diskAlertThreshold: { type: number, minimum: 0.5, maximum: 0.99 }
        alertEmail: { type: [string, 'null'], format: email, maxLength: 254 }
      additionalProperties: false
    Maintenance:
      type: object
      required: [enabled, source, adminEnabled]
      properties:
        enabled: { type: boolean, description: Maintenance mode is in effect. }
        source:
          type: string
          enum: [none, environment, admin]
          description: "`environment` when `TT_MAINTENANCE=true` forces the mode (it always wins), `admin` when enabled by the super admin, `none` when off."
        adminEnabled:
          type: boolean
          description: "Choice stored by the super admin, shown even while the environment forces the mode."
        since:
          type: string
          format: date-time
          description: "Start of the maintenance (process start when forced by the environment); absent when off."
        message: { $ref: '#/components/schemas/MaintenanceMessages' }
    MaintenanceMessages:
      type: object
      description: |
        Maintenance message per supported language, as plain text of 1 to 500 characters without
        control characters other than line feed, without Unicode line or paragraph separators and
        without bidirectional control characters.
      propertyNames: { $ref: '#/components/schemas/Language' }
      additionalProperties: { type: string, minLength: 1, maxLength: 500 }
    MaintenanceUpdate:
      type: object
      # Decoded by the handler itself, which must refuse a missing or null
      # enabled and unknown members.
      x-go-type: json.RawMessage
      required: [enabled]
      properties:
        enabled: { type: boolean }
        message: { $ref: '#/components/schemas/MaintenanceMessages' }
      additionalProperties: false
    MasterKeyStatus:
      type: object
      required: [activeKeyId, restartRequired]
      properties:
        activeKeyId:
          type: string
          pattern: '^mk_[0-9a-f]{16}$'
          description: Identifier of the master key in use (`TT_MASTER_KEY_FILE`), derived from the key (not secret).
        newKeyId:
          type: string
          pattern: '^mk_[0-9a-f]{16}$'
          description: Identifier of the new master key (`TT_MASTER_KEY_NEW_FILE`); absent when none is configured.
        restartRequired:
          type: boolean
          description: "A rotation to `newKeyId` has completed: restart the instance with the switched configuration (the new key as `TT_MASTER_KEY_FILE`)."
        latestRotation: { $ref: '#/components/schemas/KeyRotation' }
    KeyRotation:
      type: object
      required: [id, status, fromKeyId, toKeyId, totalKeys, rewrappedKeys, startedAt]
      properties:
        id: { type: string, pattern: '^rot_[0-7][0-9A-HJKMNP-TV-Z]{25}$' }
        status: { type: string, enum: [running, completed, failed] }
        fromKeyId:
          type: string
          pattern: '^mk_[0-9a-f]{16}$'
          description: Identifier of the master key being replaced, derived from the key (not secret).
        toKeyId:
          type: string
          pattern: '^mk_[0-9a-f]{16}$'
          description: Identifier of the new master key, derived from the key (not secret).
        totalKeys:
          type: integer
          format: int64
          minimum: 0
          description: Number of wrapped keys under the old master key when the rotation started.
        rewrappedKeys:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of wrapped keys rewrapped so far. It can exceed totalKeys when keys were created
            under the old master key while the rotation was running.
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        error: { type: string }

    # --- Monitoring (since 1.1) -------------------------------------------
    AntivirusEngine:
      type: string
      x-extensible-enum: true
      description: |
        Since 1.1. Antivirus engine selected by `TT_ANTIVIRUS_ENGINE` (environment only):
        `clamd` (default, local or remote clamd), `icap` (RFC 3507 server), `http` (generic HTTP
        scanning API), `none` (antivirus disabled for the whole instance: files are delivered
        `not_scanned_disabled`).
      enum: [clamd, icap, http, none]
    InstanceStatus:
      type: object
      description: Since 1.1. Answer of `/status`.
      required: [status, version, checkedAt, maintenance, checks, disk, antivirus, tenants]
      properties:
        status: { type: string, enum: [ok, degraded], description: "`degraded` when a component of `checks` is unavailable." }
        version: { type: string }
        checkedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, format: int64, minimum: 0 }
        maintenance: { type: boolean }
        checks:
          type: object
          required: [database, antivirus, storage]
          properties:
            database: { $ref: '#/components/schemas/ComponentHealth' }
            antivirus: { $ref: '#/components/schemas/ComponentHealth' }
            storage: { $ref: '#/components/schemas/ComponentHealth' }
        disk:
          type: object
          required: [totalBytes, usedBytes, usedRatio, alertThreshold, alertActive]
          properties:
            totalBytes: { $ref: '#/components/schemas/ByteSize' }
            usedBytes: { $ref: '#/components/schemas/ByteSize' }
            usedRatio: { type: number, minimum: 0, maximum: 1 }
            alertThreshold: { type: number }
            alertActive: { type: boolean }
        antivirus:
          type: object
          required: [queuedFiles, alertActive]
          properties:
            engine: { $ref: '#/components/schemas/AntivirusEngine' }
            queuedFiles: { type: integer, minimum: 0, description: Files waiting for or under analysis. }
            alertActive: { type: boolean, description: The antivirus outage alert is raised. }
        lifecycle:
          type: object
          description: |
            End of the last successful run of each periodic cleanup task (`expire`,
            `delete-after-download`, `abandoned-uploads`, `tenant-deletions`, `purge-rows`,
            `orphans`, `backup`), keyed by task name. A task that never succeeded since the start
            is absent. A run that left work for the next run after a failure does not move it.
          additionalProperties: { type: string, format: date-time }
        tenants:
          type: array
          description: One row per active tenant.
          items:
            type: object
            required: [id, name, storageUsedBytes, storageQuotaBytes, storageUsedRatio, activeTransfers, transfersLast24h]
            properties:
              id: { type: string }
              name: { type: string }
              storageUsedBytes: { $ref: '#/components/schemas/ByteSize' }
              storageQuotaBytes: { $ref: '#/components/schemas/ByteSize' }
              storageUsedRatio: { type: number, minimum: 0 }
              activeTransfers: { type: integer, minimum: 0, description: Transfers currently available. }
              transfersLast24h: { type: integer, minimum: 0, description: Transfers made available during the last 24 hours. }

    # --- Public tenant rules (since 1.1) -------------------------------------
    TenantFeatures:
      type: object
      description: Since 1.1. Real rules of the tenant, for the deposit form and the built-in help.
      required: [remoteInternalDeposit, transferReply, recipientVerification, maxDownloads, folders, recipientRestrictions, antivirus]
      properties:
        remoteInternalDeposit: { type: boolean, description: "Internal addresses already verified from the internal network may deposit from outside (code each time)." }
        transferReply: { type: boolean, description: Recipients may send files back to the sender. }
        recipientVerification: { type: boolean, description: The recipient verification option is offered to senders. }
        maxDownloads: { type: boolean, description: The maximum number of downloads option is offered to senders. }
        folders: { type: boolean, description: Folders may be dropped and keep their tree. }
        recipientRestrictions: { type: boolean, description: "Recipient domain rules apply (the domains themselves are not disclosed)." }
        antivirus:
          type: string
          x-extensible-enum: true
          enum: [enabled, disabled]
          description: "`disabled` when files of the tenant are not analysed (instance engine `none` or tenant flag off): the download page tells recipients so."
    ConfidentialityLevelKey:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,31}$'
      description: Since 1.1. Key of a confidentiality level, unique within the tenant.
      example: confidential
    ConfidentialityRules:
      type: object
      description: Since 1.1. Rules a confidentiality level imposes on a transfer, enforced by the server at creation.
      required: [requireRecipientVerification, requirePassword, allowedExpiryDays, internalRecipientsOnly, forceDeleteAfterFirstDownload, maxDownloads]
      properties:
        requireRecipientVerification: { type: boolean }
        requirePassword: { type: boolean }
        allowedExpiryDays:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/ExpiryDays' }
        internalRecipientsOnly: { type: boolean, description: "Recipients must belong to the tenant's internal domains (exact match)." }
        forceDeleteAfterFirstDownload: { type: boolean }
        maxDownloads: { type: [integer, 'null'], minimum: 1, maximum: 1000, description: "Cap of `maxDownloads` (applied when the sender sets none or more); null for none." }
      additionalProperties: false
    ConfidentialityLevel:
      type: object
      description: Since 1.1. A confidentiality level of a tenant, as managed by its admins.
      required: [key, labels, isDefault, rules]
      properties:
        key: { $ref: '#/components/schemas/ConfidentialityLevelKey' }
        labels:
          type: object
          description: Label per supported language (1 to 50 characters of plain text); every supported language is required.
          propertyNames: { $ref: '#/components/schemas/Language' }
          additionalProperties: { type: string, minLength: 1, maxLength: 50 }
        descriptions:
          type: object
          description: Optional description per supported language (plain text, at most 500 characters), shown in the deposit form and the help.
          propertyNames: { $ref: '#/components/schemas/Language' }
          additionalProperties: { type: string, minLength: 1, maxLength: 500 }
        isDefault: { type: boolean }
        rules: { $ref: '#/components/schemas/ConfidentialityRules' }
      additionalProperties: false
    ConfidentialityLevelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ConfidentialityLevel' }
      additionalProperties: false
    PublicConfidentialityLevel:
      type: object
      description: Since 1.1. A confidentiality level as offered to senders, label in the response language.
      required: [key, label, isDefault, rules]
      properties:
        key: { $ref: '#/components/schemas/ConfidentialityLevelKey' }
        label: { type: string }
        description: { type: string, description: Description in the response language; absent when none is written. }
        isDefault: { type: boolean }
        rules: { $ref: '#/components/schemas/ConfidentialityRules' }
    ConfidentialityLevelRef:
      type: object
      description: "Since 1.1. Confidentiality level of a transfer, snapshotted when the transfer was created: key, label (in the transfer language) and the rules applied, which later changes of the level never affect; absent when the transfer has none."
      required: [key, label]
      properties:
        key: { $ref: '#/components/schemas/ConfidentialityLevelKey' }
        label: { type: string }
        rules: { $ref: '#/components/schemas/ConfidentialityRules' }

    # --- Recipients (since 1.1) ------------------------------------------------
    RecipientVerificationStart:
      type: object
      properties:
        purpose:
          type: string
          enum: [download, reply]
          default: download
          description: "`reply` asks for a code before replying, even when the transfer does not require recipient verification."
        language: { $ref: '#/components/schemas/Language' }
      additionalProperties: false
    RecipientVerificationChallenge:
      type: object
      required: [emailMasked, expiresAt, attemptsRemaining]
      properties:
        emailMasked: { type: string, description: "Masked recipient address; the full address is never returned." }
        expiresAt: { type: string, format: date-time }
        attemptsRemaining: { type: integer, minimum: 0, maximum: 2 }
    TransferReplyStart:
      type: object
      description: Since 1.1. Body of `startTransferReply` (a JSON body is required for cross-site protection).
      properties:
        language: { $ref: '#/components/schemas/Language' }
      additionalProperties: false
    AbuseReportCategory:
      type: string
      x-extensible-enum: true
      enum: [malware, phishing, illegal_content, spam, unknown_sender, other]
    AbuseReportCreate:
      type: object
      required: [category]
      properties:
        category: { $ref: '#/components/schemas/AbuseReportCategory' }
        message: { type: string, maxLength: 1000, description: "Plain text; control, invisible and bidirectional characters are removed." }
      additionalProperties: false
    RecipientTracking:
      type: object
      description: Since 1.1. Downloads of one recipient through their own link.
      required: [email, verifiedAt, firstDownloadedAt, lastDownloadedAt, downloads]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        verifiedAt: { type: [string, 'null'], format: date-time, description: "Last recipient verification by code; null when never verified." }
        firstDownloadedAt: { type: [string, 'null'], format: date-time }
        lastDownloadedAt: { type: [string, 'null'], format: date-time }
        downloads:
          type: array
          items:
            type: object
            required: [firstAt, lastAt, count]
            properties:
              fileId: { type: [string, 'null'], description: "Downloaded file; null for the ZIP archive." }
              firstAt: { type: string, format: date-time }
              lastAt: { type: string, format: date-time }
              count: { type: integer, minimum: 1, description: Download starts (resumed ranges excluded). }

    # --- My transfers (since 1.1) ------------------------------------------------
    MyTransfersLinkRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        language: { $ref: '#/components/schemas/Language' }
      additionalProperties: false
    MyTransfersSessionStart:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^mta_[A-Za-z0-9]{22,43}$', description: "Token from the fragment of the mailed access link." }
      additionalProperties: false
    MyTransfersSession:
      type: object
      required: [email, csrfToken, expiresAt]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    MyTransfer:
      type: object
      required: [id, status, recipients, fileCount, totalBytes, expiryDays, createdAt, passwordProtected, recipientVerification, downloadedBy]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TransferStatus' }
        recipients: { type: array, items: { $ref: '#/components/schemas/Email' } }
        fileCount: { type: integer, minimum: 0 }
        totalBytes: { $ref: '#/components/schemas/ByteSize' }
        expiryDays: { $ref: '#/components/schemas/ExpiryDays' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Absent while `scanning`. }
        passwordProtected: { type: boolean }
        recipientVerification: { type: boolean }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevelRef' }
        downloadedBy: { type: integer, minimum: 0, description: "Recipients who downloaded at least one file (per-recipient links only; 0 otherwise)." }
    MyTransferDetail:
      allOf:
        - $ref: '#/components/schemas/MyTransfer'
        - type: object
          required: [deleteAfterFirstDownload, maxDownloads, downloadCount, files, recipientTracking]
          properties:
            message: { type: string }
            deleteAfterFirstDownload: { type: boolean }
            maxDownloads: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
            downloadCount: { type: integer, minimum: 0, description: 'Download starts, all recipients together.' }
            extensionCount: { type: integer, minimum: 0, description: Number of extensions made. }
            extendableTo:
              type: string
              format: date-time
              description: "Latest expiry `extendMyTransfer` could set now: now plus the longest duration allowed by the snapshotted level, but never more than 90 days after the creation; absent when the transfer cannot be extended."
            files:
              type: array
              items:
                type: object
                required: [id, name, size, scanStatus]
                properties:
                  id: { type: string }
                  name: { type: string }
                  path: { $ref: '#/components/schemas/FilePath' }
                  size: { $ref: '#/components/schemas/ByteSize' }
                  sha256: { $ref: '#/components/schemas/Sha256' }
                  scanStatus: { $ref: '#/components/schemas/ScanStatus' }
            recipientTracking:
              type: array
              description: One entry per recipient for a transfer with per-recipient links; empty for a transfer created before 1.1.
              items: { $ref: '#/components/schemas/RecipientTracking' }
    MyTransferList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MyTransfer' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    TransferExtension:
      type: object
      required: [expiryDays]
      properties:
        expiryDays:
          allOf: [{ $ref: '#/components/schemas/ExpiryDays' }]
          description: The transfer then expires this many days from now.
      additionalProperties: false

    # --- Admin: recipient rules and abuse (since 1.1) ------------------------------
    RecipientRules:
      type: object
      description: |
        Since 1.1. Recipient domain rules of a tenant. An entry matches the domain itself and all
        its subdomains (`example.net` covers `mail.example.net`); matching is case-insensitive on
        the punycode form. A recipient is refused when its domain matches a denied entry, or when
        `allowedDomains` is not empty and its domain matches none of its entries; the deny list
        wins over the allow list. Both lists empty: no restriction.
      required: [allowedDomains, deniedDomains]
      properties:
        allowedDomains:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 253 }
        deniedDomains:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 253 }
      additionalProperties: false
    OfficeHours:
      type: object
      description: "Office hours of the tenant, in the `timeZone` of the thresholds; a transfer created outside them raises an unusual activity alert."
      required: [start, end, weekdays]
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Local start time (HH:MM). }
        end: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', description: "Local end time (HH:MM, `24:00` for the end of the day), after `start`." }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: Working days, ISO 8601 numbering (1 = Monday, 7 = Sunday).
          items: { type: integer, minimum: 1, maximum: 7 }
      additionalProperties: false
    AbuseThresholds:
      type: object
      description: |
        Since 1.1. Abuse detection settings of a tenant. Every member is required; `null`
        disables the corresponding rule. Daily counters are computed per day of `timeZone` from
        the transfers of the tenant (no write per uploaded chunk); deposits from outside
        (`internal_remote`) count like internal ones.
      required: [maxDailyBytesPerSender, maxDailyTransfersPerSender, maxRecipientsPerTransfer, blockOnExceed, unusualVolumeFactor, unusualMinHistoryDays, largeExternalTransferBytes, timeZone, officeHours, maxInvitationsPerInviter, externalMaxDailyBytes, externalMaxDailyDeposits]
      properties:
        maxDailyBytesPerSender: { type: [integer, 'null'], format: int64, minimum: 1, description: Volume sent per sender per day. }
        maxDailyTransfersPerSender: { type: [integer, 'null'], minimum: 1, description: Transfers per sender per day. }
        maxRecipientsPerTransfer: { type: [integer, 'null'], minimum: 1, maximum: 100, description: Recipients of one transfer. }
        blockOnExceed: { type: boolean, description: "Refuse a transfer exceeding a per-sender limit or an external quota (`403 abuse-threshold-blocked`) instead of only alerting." }
        unusualVolumeFactor:
          type: [number, 'null']
          minimum: 1.5
          maximum: 100
          multipleOf: 0.1
          description: "Alert when a sender's daily volume exceeds this factor times their average daily volume over the last 30 days (only with at least `unusualMinHistoryDays` days of history). Alert only, never blocks."
        unusualMinHistoryDays: { type: integer, minimum: 1, maximum: 30, default: 7, description: Days of activity a sender needs before the unusual volume rule applies to them. }
        timeZone: { type: string, minLength: 1, maxLength: 64, default: UTC, description: "IANA time zone of the day boundary of the daily counters and of the office hours." }
        largeExternalTransferBytes: { type: [integer, 'null'], format: int64, minimum: 1, description: "Alert on a transfer at least this large with a recipient outside the internal domains. Alert only." }
        officeHours:
          oneOf:
            - $ref: '#/components/schemas/OfficeHours'
            - type: 'null'
          description: Alert on transfers created outside office hours; null disables it. Alert only.
        maxInvitationsPerInviter: { type: integer, minimum: 1, maximum: 1000, default: 20, description: Invitations an internal user may issue per rolling hour. }
        externalMaxDailyBytes: { type: [integer, 'null'], format: int64, minimum: 1, description: "Volume an external address (invited or replying) may deposit per day." }
        externalMaxDailyDeposits: { type: [integer, 'null'], minimum: 1, description: "Transfers an external address (invited or replying) may create per day." }
      additionalProperties: false
    AbuseReportStatus:
      type: string
      enum: [open, closed]
    AbuseReport:
      type: object
      required: [id, transferId, senderEmail, reporterVerified, category, status, reportedAt]
      properties:
        id: { type: string }
        transferId: { type: string, description: "Reported transfer (it may have expired or been deleted since)." }
        senderEmail:
          type: string
          maxLength: 254
          description: "Sender of the reported transfer, or the pseudonym `erased-<16 hex>` after a GDPR erasure."
        reportedBy:
          type: [string, 'null']
          maxLength: 254
          description: "Address of the reporter, only when a valid recipient verification of the link proved it (`reporterVerified`); null otherwise, or the pseudonym after a GDPR erasure."
        reporterVerified: { type: boolean, description: "The reporter proved being the recipient of the link (`__Host-tt_rv`)." }
        recipientIndex:
          type: [integer, 'null']
          minimum: 1
          description: "Position (1-based) of the recipient whose link was used, as an unverified hint; null for a shared link (transfers created before 1.1)."
        category: { $ref: '#/components/schemas/AbuseReportCategory' }
        message: { type: string, description: "Plain text, to be rendered as text (never HTML)." }
        status: { $ref: '#/components/schemas/AbuseReportStatus' }
        reportedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        closedBy: { type: string, description: Username of the admin who closed the report. }
        note: { type: string }
    AbuseReportList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AbuseReport' } }
        nextCursor: { $ref: '#/components/schemas/PageCursor' }
    AbuseReportUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AbuseReportStatus' }
        note: { type: string, maxLength: 1000 }
      additionalProperties: false

    # --- Webhooks (since 1.1) --------------------------------------------------------
    WebhookKind:
      type: string
      x-extensible-enum: true
      description: "`teams` and `slack` receive a formatted message (incoming webhook); `generic` receives a signed `WebhookEvent` JSON document."
      enum: [teams, slack, generic]
    WebhookEventType:
      type: string
      x-extensible-enum: true
      description: |
        Since 1.1. Event delivered to webhooks. Tenant events, for the tenant webhooks only:
        `virus.detected`, `abuse.threshold_exceeded`, `abuse.unusual_activity`, `abuse.reported`,
        `quota.warning`, `quota.reached`. System events, for the instance-wide webhooks only:
        `disk.alert_raised`, `disk.alert_cleared`, `antivirus.alert_raised`,
        `antivirus.alert_cleared`, `maintenance.enabled`, `maintenance.disabled`,
        `master_key.rotation_completed`, `master_key.rotation_failed`. `webhook.test` is only
        sent by the test operations and cannot be subscribed to.
      enum:
        - virus.detected
        - abuse.threshold_exceeded
        - abuse.unusual_activity
        - abuse.reported
        - quota.warning
        - quota.reached
        - disk.alert_raised
        - disk.alert_cleared
        - antivirus.alert_raised
        - antivirus.alert_cleared
        - maintenance.enabled
        - maintenance.disabled
        - master_key.rotation_completed
        - master_key.rotation_failed
        - webhook.test
    WebhookErrorCategory:
      type: string
      x-extensible-enum: true
      description: "Since 1.1. Coarse cause of a failed delivery; no address, port, banner or body is ever reported: `dns` (name not resolved), `refused_network` (address denied by the network guard), `connect`, `tls`, `timeout`, `http_status` (non-2xx answer)."
      enum: [dns, refused_network, connect, tls, timeout, http_status]
    WebhookDelivery:
      type: object
      description: Outcome of the latest delivery attempt.
      required: [at, success, durationMs]
      properties:
        at: { type: string, format: date-time }
        success: { type: boolean }
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
        durationMs: { type: integer, minimum: 0 }
        errorCategory: { $ref: '#/components/schemas/WebhookErrorCategory' }
    Webhook:
      type: object
      description: |
        Since 1.1. A webhook of a tenant or of the instance. Deliveries are made in the
        background with a 10-second timeout, up to 5 attempts with exponential back-off, never
        following redirects; after 5 consecutive failed deliveries a circuit breaker suspends the
        webhook for 15 minutes (`circuitOpenUntil`). Pending deliveries are kept in memory only:
        they are lost on a restart (the audit log and the alert mails are not affected).
      required: [id, name, kind, urlHint, events, enabled, hasSecret, createdBy, createdAt, updatedAt, lastDelivery, circuitOpenUntil]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/WebhookKind' }
        urlHint: { type: string, description: "Scheme and host of the URL only (the full URL is sealed and never returned)." }
        events:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean }
        hasSecret: { type: boolean, description: "A signing secret exists (`generic` kind)." }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastDelivery:
          oneOf:
            - $ref: '#/components/schemas/WebhookDelivery'
            - type: 'null'
        circuitOpenUntil: { type: [string, 'null'], format: date-time, description: "End of the suspension by the circuit breaker; null when deliveries are allowed." }
    WebhookWithSecret:
      description: Since 1.1. A webhook with its signing secret, present only in the answer of a creation of a `generic` webhook or of a secret rotation.
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            secret: { type: string, pattern: "^[0-9a-f]{64}$", description: "Signing secret, shown once: 64 lowercase hexadecimal characters (256 random bits). The receiver uses this text as shown, byte for byte, as the HMAC-SHA256 key." }
    WebhookCreate:
      type: object
      required: [name, kind, url, events]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/WebhookKind' }
        url: { type: string, format: uri, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean, default: true }
      additionalProperties: false
    WebhookUpdate:
      type: object
      description: JSON Merge Patch of a webhook; `null` is refused on every member, an unknown member is refused.
      # Decoded by the handler itself, which must tell a null field (refused) from an absent one.
      x-go-type: json.RawMessage
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 2048 }
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean }
        rotateSecret: { type: boolean, description: "`true` replaces the signing secret (`generic` kind only)." }
      additionalProperties: false
    WebhookTestResult:
      type: object
      required: [success, durationMs]
      properties:
        success: { type: boolean }
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
        durationMs: { type: integer, minimum: 0 }
        errorCategory: { $ref: '#/components/schemas/WebhookErrorCategory' }
    WebhookEvent:
      type: object
      description: |
        Since 1.1. JSON body POSTed to a `generic` webhook (`Content-Type: application/json`).
        Headers: `X-TransTeira-Event` (the event type), `X-TransTeira-Delivery` (the event `id`,
        identical across retries, for deduplication) and `X-TransTeira-Signature:
        t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" with the webhook secret>`. A
        receiver checks the signature in constant time and rejects a `t` older than 5 minutes.

        The payload is minimal by default: event type, severity, time, tenant identifier and
        name, counters and a link to the administration, **no e-mail address**. A tenant may
        enable `webhookIncludeAddresses` to add the sender and recipient addresses concerned
        (`addresses`). File names, contents, tokens, links and passwords are never sent. System
        events carry no `tenant`.
      required: [id, type, severity, occurredAt, counts]
      properties:
        id: { type: string, description: Event identifier (`evt_` + ULID). }
        type: { $ref: '#/components/schemas/WebhookEventType' }
        severity: { type: string, x-extensible-enum: true, enum: [info, warning, critical] }
        occurredAt: { type: string, format: date-time }
        tenant:
          type: object
          description: Tenant of a tenant event; absent for a system event.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        counts:
          type: object
          description: "Counters of the event, for example `{files}` for `virus.detected`, `{value, threshold}` for an abuse threshold, `{usedRatio, threshold}` for a quota or disk alert, `{waitingTransfers, outageSeconds}` for an antivirus outage."
          additionalProperties: { type: number }
        adminUrl: { type: string, format: uri, description: Page of the administration where the event can be examined. }
        addresses:
          type: object
          description: "Only when the tenant enables `webhookIncludeAddresses`: the addresses concerned."
          properties:
            sender: { $ref: '#/components/schemas/Email' }
            recipients: { type: array, items: { $ref: '#/components/schemas/Email' } }
            reporter: { $ref: '#/components/schemas/Email' }
      example:
        id: evt_01JABCU7W8X9Y0Z1A2B3C4D5E6
        type: abuse.threshold_exceeded
        severity: warning
        occurredAt: '2026-10-27T09:00:00Z'
        tenant: { id: ten_01JAB00000000000000ENT1TYA, name: Entity A }
        counts: { value: 118111600640, threshold: 107374182400 }
        adminUrl: https://admin.transfer.example.com/admin/tenants/ten_01JAB00000000000000ENT1TYA/audit
