# TransTeira behind Apache httpd 2.4 (included at the end of httpd.conf).
#
# Requires Apache 2.4.54 or later. Certificates come from certbot (webroot),
# one certificate named "transteira" covering the admin host and every tenant
# FQDN; see README.md. Replace every example.com name.

# --- Modules ---------------------------------------------------------------------
# Loaded here only when not loaded yet (official httpd image). On Debian or
# Ubuntu, enable them with a2enmod instead (the paths below are relative to
# the ServerRoot of the official image): the IfModule guards then skip them.
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !ssl_module>
    LoadModule ssl_module modules/mod_ssl.so
</IfModule>
<IfModule !socache_shmcb_module>
    LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
</IfModule>
<IfModule !http2_module>
    LoadModule http2_module modules/mod_http2.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !setenvif_module>
    LoadModule setenvif_module modules/mod_setenvif.so
</IfModule>
<IfModule !log_config_module>
    LoadModule log_config_module modules/mod_log_config.so
</IfModule>
<IfModule !alias_module>
    LoadModule alias_module modules/mod_alias.so
</IfModule>

# Debian and Ubuntu already listen on 443 in ports.conf: remove this line there.
Listen 443

ServerTokens Prod
ServerSignature Off
ProxyRequests Off

# Idle timeouts (time waiting for one read or write, never the duration of the
# whole transfer), towards the client (Timeout) and towards TransTeira
# (ProxyTimeout). They exceed TransTeira's own idle timeouts (upload idle
# timeout up to 10 minutes). mod_reqtimeout keeps its defaults: its body
# timeout grows with the data received, so it never cuts a moving upload.
Timeout 3600
ProxyTimeout 3600

SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLSessionTickets off
SSLSessionCache "shmcb:logs/ssl_scache(512000)"

# --- Access log without capability tokens (threat model T-161) ---------------------
# Requests to /d/{token}, /i/{token}, /api/v1/downloads/{token}/... and
# /api/v1/invitations/{token} are logged with a second format that contains
# only the path prefix, never the token nor the rest of the URL. No Referer.
SetEnvIf Request_URI "^(/d/|/i/|/api/v1/downloads/|/api/v1/invitations/)" TT_TOKEN_PREFIX=$1
LogFormat "%a %l %u %t \"%m %U%q %H\" %>s %B \"%{User-Agent}i\" host=%{Host}i rt_us=%D" transteira
LogFormat "%a %l %u %t \"%m %{TT_TOKEN_PREFIX}eREDACTED %H\" %>s %B \"%{User-Agent}i\" host=%{Host}i rt_us=%D" transteira_redacted

# --- Default virtual hosts: unknown host names are refused -----------------------
# The first virtual host of an address:port is the default one.
<VirtualHost *:80>
    ServerName default.invalid
    CustomLog /proc/self/fd/1 transteira_redacted "env=TT_TOKEN_PREFIX"
    CustomLog /proc/self/fd/1 transteira "env=!TT_TOKEN_PREFIX"
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName default.invalid
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/transteira/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/transteira/privkey.pem
    CustomLog /proc/self/fd/1 transteira_redacted "env=TT_TOKEN_PREFIX"
    CustomLog /proc/self/fd/1 transteira "env=!TT_TOKEN_PREFIX"
    <Location />
        Require all denied
    </Location>
</VirtualHost>

# --- HTTP: ACME challenges and redirect to HTTPS -----------------------------------
<VirtualHost *:80>
    ServerName admin.transfer.example.com
    ServerAlias transfer.entity-a.example.com transfer.entity-b.example.com
    CustomLog /proc/self/fd/1 transteira_redacted "env=TT_TOKEN_PREFIX"
    CustomLog /proc/self/fd/1 transteira "env=!TT_TOKEN_PREFIX"

    # certbot --webroot -w /var/www/certbot
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# --- HTTPS: TransTeira -----------------------------------------------------------------
<VirtualHost *:443>
    # The admin host and every tenant FQDN (add a tenant here and to the
    # certificate, see README.md). TransTeira routes by the Host header.
    ServerName admin.transfer.example.com
    ServerAlias transfer.entity-a.example.com transfer.entity-b.example.com

    <IfModule http2_module>
        Protocols h2 http/1.1
    </IfModule>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/transteira/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/transteira/privkey.pem

    CustomLog /proc/self/fd/1 transteira_redacted "env=TT_TOKEN_PREFIX"
    CustomLog /proc/self/fd/1 transteira "env=!TT_TOKEN_PREFIX"

    # HSTS (CLAUDE.md section 16.2). No includeSubDomains by default: see
    # README.md.
    Header always set Strict-Transport-Security "max-age=31536000"

    # No request body size limit. Since 2.4.54 the default is 1 GiB, which
    # would refuse the tus PATCH requests of big files. TransTeira enforces
    # the per-transfer limit (up to 20 GB) itself.
    LimitRequestBody 0

    # Host unchanged (tenant resolution).
    ProxyPreserveHost On
    # Real client IP. mod_proxy_http appends the client address to
    # X-Forwarded-For: the client's own header is removed first, so that
    # TransTeira receives exactly one address. X-Real-IP is set as well.
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"

    # Monitoring endpoints (/metrics, /status) only on the admin host: 404 on
    # every other name (threat model T-191). Evaluated before ProxyPass.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^admin\.transfer\.example\.com(:[0-9]+)?$ [NC]
    RewriteRule ^/(metrics|status)/?$ - [R=404,L]

    # Streaming in both directions. Request bodies are streamed by
    # mod_proxy_http (do not set proxy-sendcl, which spools chunked bodies to
    # disk); flushpackets=on sends every chunk of a download or ZIP archive to
    # the client at once. ttl closes idle backend connections before
    # TransTeira does (its keep-alive timeout is 120 s).
    ProxyPass        / http://transteira:8080/ flushpackets=on ttl=60 connectiontimeout=10
    ProxyPassReverse / http://transteira:8080/

    # Compression of the web interface and of the JSON API only. Uploads
    # (tus) and downloads (byte ranges, ZIP archives) are never compressed.
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/problem+json image/svg+xml
    SetEnvIf Request_URI "^/api/v1/(uploads|downloads/)" no-gzip
</VirtualHost>
