# TransTeira behind Nginx (http context: /etc/nginx/conf.d/transteira.conf).
#
# Requires nginx 1.27.3 or later (upstream "resolve"). Certificates come from
# certbot (webroot), one certificate named "transteira" covering the admin
# host and every tenant FQDN; see README.md. Replace every example.com name.

# --- Upstream -----------------------------------------------------------------

# Docker's embedded DNS. "resolve" lets nginx start even while the transteira
# container is down, and follows its address when it is recreated.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream transteira {
    zone transteira 64k;
    server transteira:8080 resolve;
    keepalive 16;
    # Below TransTeira's own keep-alive timeout (120 s): nginx never reuses a
    # connection that TransTeira is about to close.
    keepalive_timeout 60s;
}

# --- Access log without capability tokens (threat model T-161) ----------------

# /d/{token}, /i/{token}, /api/v1/downloads/{token}/... and
# /api/v1/invitations/{token}: the token segment is replaced by REDACTED.
map $request_uri $transteira_log_uri {
    "~^(?<tt_prefix>/(?:d|i|api/v1/downloads|api/v1/invitations)/)[^/?]+(?<tt_rest>.*)$" "${tt_prefix}REDACTED${tt_rest}";
    default $request_uri;
}

# Like "combined", with the redacted URI and without the Referer.
log_format transteira '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $transteira_log_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent" '
                      'host=$host rt=$request_time';

# --- HTTP: ACME challenges and redirect to HTTPS -------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name admin.transfer.example.com
                transfer.entity-a.example.com
                transfer.entity-b.example.com;
    access_log /var/log/nginx/access.log transteira;
    server_tokens off;

    # certbot --webroot -w /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Unknown host names are refused (no redirect, no certificate).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

# --- HTTPS: TransTeira ----------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # The admin host and every tenant FQDN (add a tenant here and to the
    # certificate, see README.md). TransTeira routes by the Host header.
    server_name admin.transfer.example.com
                transfer.entity-a.example.com
                transfer.entity-b.example.com;

    ssl_certificate     /etc/letsencrypt/live/transteira/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transteira/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:transteira_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    access_log /var/log/nginx/access.log transteira;

    # HSTS (CLAUDE.md section 16.2). No includeSubDomains by default: see
    # README.md. Never declare add_header in a location below, or this one
    # would no longer be inherited there.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No request body size limit: TransTeira enforces the per-transfer limit
    # (up to 20 GB) itself; tus sends the file in PATCH requests.
    client_max_body_size 0;

    # Idle timeouts (time between two successive reads or writes, never the
    # duration of the whole transfer). They exceed TransTeira's own idle
    # timeouts (upload idle timeout up to 10 minutes).
    client_body_timeout 1h;
    send_timeout 1h;
    proxy_connect_timeout 10s;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;

    # Request and response buffering off: uploads are streamed to TransTeira
    # as they arrive, downloads and ZIP archives are streamed to the client,
    # nothing is spooled to disk.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # HTTP/1.1 with keep-alive to the upstream (required for streaming
    # request bodies without buffering, and for chunked responses).
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Host unchanged (tenant resolution), real client IP. X-Forwarded-For is
    # overwritten with the TCP peer, never appended to what the client sent.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Compression of the web interface and of the JSON API only (text/html
    # is always included by gzip).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/problem+json image/svg+xml;

    # tus uploads (POST, HEAD, PATCH, DELETE and OPTIONS are passed through
    # as is) and downloads (byte ranges, ZIP archives): never compressed.
    location /api/v1/uploads {
        gzip off;
        proxy_pass http://transteira;
    }

    location /api/v1/downloads/ {
        gzip off;
        proxy_pass http://transteira;
    }

    location / {
        proxy_pass http://transteira;
    }
}
