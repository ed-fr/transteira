# Brute force against TransTeira: wrong verification codes, wrong transfer
# passwords, failed admin logins (password, TOTP, recovery code), invalid API
# tokens, refused deposits and rate limiting, per client IP.
# 10 events in a burst (capacity 9, one event leaks per minute) trigger it.
type: leaky
name: ed-fr/transteira-bf
description: "Detect brute force against TransTeira (codes, passwords, admin login, API tokens)"
# rate_limited lines of the download stream limits (scope download_streams)
# are excluded: recipients behind one NAT, or a download manager opening
# parallel connections, hit them without any attack. The exclusion matches
# the whole fields part of the exact line TransTeira writes for them (the
# truncated transfer ID, then the scope, nothing after): a
# scope="download_streams" smuggled into another value is quoted and escaped
# and never matches. Checked by internal/securitylog/crowdsec_test.go: keep
# the filter on a single line.
filter: "evt.Meta.log_type == 'transteira_security' && evt.Meta.transteira_event in ['verification_code_invalid', 'transfer_password_invalid', 'admin_login_failed', 'api_token_invalid', 'deposit_refused', 'rate_limited'] && !(evt.Meta.transteira_event == 'rate_limited' && evt.Parsed.fields matches '^transfer=\"trf_[0-9A-Z]{10}\" scope=\"download_streams\"$')"
groupby: evt.Meta.source_ip
capacity: 9
leakspeed: 1m
blackhole: 5m
labels:
  service: transteira
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1110
  label: "TransTeira brute force"
  behavior: "http:bruteforce"
  remediation: true
