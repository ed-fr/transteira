# fail2ban filter for the single sign-on failures of the TransTeira security log
# (event sso_failed, since 2.0). Same format and same safety rules as
# transteira.conf (docs/operations/security-log.md, threat model T-99).
#
# Kept apart from transteira.conf on purpose: a failed single sign-on login is
# far less telling than a wrong password. A stale browser tab, a bookmarked
# callback URL or a double click ends with reason="state_invalid" without any
# attack, so this filter is used by its own jail, with a higher threshold
# (jail.d/transteira.local, jail [transteira-sso]).
#
#   2026-11-05T08:12:00.123Z ip=203.0.113.7 tenant=- event=sso_failed reason="state_invalid"
#
# The date pattern and the regex are anchored as in transteira.conf: only the
# second token of the line (ip=) is trusted, and ip=- never matches.

[INCLUDES]

before = common.conf

[Definition]

failregex = ^ ip=<ADDR> tenant=[a-z0-9.-]+ event=sso_failed(?: |$)

datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S\.%%fZ

# Timestamps are written in UTC.
logtimezone = UTC
