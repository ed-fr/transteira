# fail2ban filter for the TransTeira security log.
#
# Log format (docs/operations/security-log.md):
#   2026-10-20T07:41:00.123Z ip=203.0.113.7 tenant=transfer.entity-a.example.com event=unknown_fqdn host="evil.example.net"
#
# Safety rules (threat model T-99):
#   - the date pattern is anchored at the start of the line ({^LN-BEG}), so a
#     date hidden in a quoted value is never used;
#   - fail2ban removes the matched date before applying failregex, so the
#     regex is anchored on what follows it, leading space included:
#     " ip=<ADDR> tenant=... event=...".
#     The ip= token is the second token of the line, written by TransTeira
#     from the TCP connection or a trusted proxy, never from free text;
#   - <ADDR> only matches an IPv4 or IPv6 address (no DNS name), so lines
#     with "ip=-" (event without a client IP) never match;
#   - free-form values come after event= and are always quoted and escaped:
#     they can contain neither a newline nor a bare " ip=" token.
#
# This file is covered by a Go test (internal/securitylog/fail2ban_test.go):
# keep the [Definition] keys on single or indented continuation lines.

[INCLUDES]

before = common.conf

[Definition]

# Events counted as failures. Add a name here to ban on a new event type.
_events = verification_code_invalid|transfer_password_invalid|admin_login_failed|api_token_invalid|unknown_fqdn|deposit_refused|rate_limited|metrics_token_invalid|access_link_invalid|provisioning_token_invalid|drop_link_invalid|secret_invalid|secret_proof_invalid

failregex = ^ ip=<ADDR> tenant=[a-z0-9.-]+ event=(?:%(_events)s)(?: |$)

# rate_limited lines of the download stream limits (scope
# download_streams) and of the hourly deposit cap of a drop link (scope
# drop_link, a limit of the link, not of the client: a third party filling
# a link must not get its legitimate depositors banned) are not counted: recipients behind one NAT, or a
# download manager opening parallel connections, hit these limits without
# any attack, and banning them would cut a whole office. The regex matches
# the exact line TransTeira writes for them, anchored at both ends: the
# truncated object ID in the transfer field (trf_ for a transfer, sec_ for
# the file of a one-time secret since 2.1, then 10 ULID characters, no
# quote possible), then the scope, and nothing after (the drop_link line
# has the scope only).
# A scope="download_streams" or scope="drop_link" smuggled into another value is quoted and escaped, so it can never make a line
# match this regex and escape a ban.
ignoreregex = ^ ip=<ADDR> tenant=[a-z0-9.-]+ event=rate_limited (?:transfer="(?:trf|sec)_[0-9A-Z]{10}" scope="download_streams"|scope="drop_link")$

datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S\.%%fZ

# Timestamps are written in UTC.
logtimezone = UTC
