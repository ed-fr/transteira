# TransTeira - local test environment (used by `make test`, see test/README.md).
# Separate from any production compose file; nothing here is meant for deployment.
name: transteira-test

services:
  postgres:
    image: postgres:17.6-alpine
    # TEST-ONLY credentials: this throwaway database listens on loopback only
    # and holds no real data. Never reuse these values anywhere else.
    environment:
      POSTGRES_USER: transteira_test
      POSTGRES_PASSWORD: transteira_test
      POSTGRES_DB: transteira_test
    ports:
      - "127.0.0.1:55432:5432"
    # Data lives in memory: every `down` / restart starts from an empty cluster.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # Creates the non-superuser role the tests connect as (see the script).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Durability is pointless for a disposable test database: trade it for speed.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      # Test packages run in parallel, each with its own pools: the default
      # 100 connections are not enough.
      - -c
      - max_connections=300
      # Dropping a test schema locks each of its tables and indexes; with the
      # packages running in parallel the default (64) runs out of lock slots
      # ("out of shared memory").
      - -c
      - max_locks_per_transaction=256
    healthcheck:
      # TCP on purpose: the entrypoint's temporary init server only listens on
      # the Unix socket, so the check turns healthy once init scripts are done.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "transteira_test", "-d", "transteira_test"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Captures every mail sent by the tests; nothing is ever relayed. The tests
  # send on 51025 and read messages back through the HTTP API on 58025
  # (TT_TEST_MAILPIT_SMTP / TT_TEST_MAILPIT_API, exported by the Makefile).
  mailpit:
    image: axllent/mailpit:v1.24.2
    # Default SMTP listener: plain TCP without authentication, like an
    # internal relay (CLAUDE.md section 12.1).
    environment:
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  # End-to-end tests only (profile "e2e", started by test/e2e/support/caddy.ts): the reference
  # reverse proxy in front of the server under test, which runs on the host. The Caddyfile is
  # generated at each run with the server's port into test/e2e/.run/caddy (gitignored); the
  # three *.localhost hosts get certificates from Caddy's internal CA (the browser ignores
  # HTTPS errors). Port 443 is bound to loopback only.
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: ["e2e"]
    command: ["caddy", "run", "--config", "/etc/caddy-e2e/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:${E2E_HTTPS_PORT:-443}:443"
    # Linux has no host.docker.internal by default (Docker Desktop provides it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./e2e/.run/caddy:/etc/caddy-e2e:ro
    # Certificates and the internal CA are thrown away with the container.
    tmpfs:
      - /data
      - /config
