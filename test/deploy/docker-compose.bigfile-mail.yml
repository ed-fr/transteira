# Mail sink of the big-file test (scripts/bigfile.sh): the API never returns download links, a
# recipient gets theirs by mail, so the tenant SMTP points at a Mailpit that the client reads.
# Mailpit sits on a network of its own shared with TransTeira (like an SMTP relay of
# docs/install/smtp.md, outside TT_SMTP_DENY_NETWORKS); its HTTP API is published on loopback
# only (BIGFILE_MAIL_PORT). The production services are not changed otherwise.
services:
  mailpit:
    image: axllent/mailpit:v1.24.2
    container_name: ${SMOKE_PROJECT:?}-mailpit
    networks:
      - mail
    ports:
      - "127.0.0.1:${BIGFILE_MAIL_PORT:?}:8025"
    environment:
      MP_MAX_MESSAGES: "100"
  transteira:
    networks:
      - mail

networks:
  mail:
    ipam:
      config:
        - subnet: ${BIGFILE_MAIL_SUBNET:-172.31.246.0/24}
