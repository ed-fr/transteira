# Deployment smoke test: overrides the reference Caddy compose file
# (integrations/reverse-proxy/caddy/docker-compose.yml), run under its own project name
# (`docker compose -p`), so that it never touches a real reverse proxy on the same host:
#   - the smoke Caddyfile, generated by scripts/deploy-smoke.sh from the reference one;
#   - HTTPS published on the loopback only, on a free port, instead of 80 and 443;
#   - the smoke proxy network (its own subnet) and the fixed proxy address on it.

services:
  caddy:
    ports: !override
      - "127.0.0.1:${SMOKE_HTTPS_PORT:?}:443"
    volumes:
      - ${SMOKE_CADDYFILE:?}:/etc/caddy/Caddyfile:ro
    networks:
      proxy:
        ipv4_address: ${SMOKE_PROXY_IP:?}

networks:
  proxy:
    name: ${SMOKE_PROXY_NETWORK:?}
    external: true
