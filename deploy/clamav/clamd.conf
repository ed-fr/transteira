# clamd configuration for TransTeira (deploy/docker-compose.yml).
#
# Mounted read-only at /etc/clamav/clamd.conf in the "clamav" service, which
# runs clamd directly as the unprivileged clamav user (UID 100), on the
# internal network only. Signature updates are done by the separate
# "clamav-update" service (see freshclam.conf). Values follow
# docs/operations/antivirus.md; keep them aligned with the TT_CLAMAV_*
# variables of TransTeira.

# --- Process -----------------------------------------------------------------

# Stay in the foreground under the container init (tini).
Foreground yes

# No LogFile: messages go to the container output (docker logs), and the root
# file system stays read-only.
LogTime yes
LogClean no
ExtendedDetectionInfo yes

# Signatures: the clamav_db volume, mounted read-only here and kept up to date
# by clamav-update. SelfCheck detects new signatures and reloads them.
DatabaseDirectory /var/lib/clamav
SelfCheck 600

# Reload signatures without a second engine in memory: scans wait a few
# seconds during a reload (well below TT_CLAMAV_TIMEOUT) instead of doubling
# the memory needs (about 1.5 GiB instead of 3 GiB with the official
# signatures).
ConcurrentDatabaseReload no

# INSTREAM data is spooled here, decrypted, before analysis: up to
# StreamMaxLength per scan, plus the files extracted from it. It is a tmpfs
# (docker-compose.yml), never a volume, so that the plaintext of a deposited
# file never reaches a disk or a backup (threat model T-44); it is sized for
# one stream, hence TT_SCAN_WORKERS=1.
TemporaryDirectory /var/tmp/clamav
LeaveTemporaryFiles no

# --- Network -----------------------------------------------------------------

# TransTeira connects to clamav:3310 (TT_CLAMAV_ADDR) over the internal Docker
# network; no port is published on the host.
TCPSocket 3310
TCPAddr 0.0.0.0

# Keep TT_SCAN_WORKERS (1 in deploy/.env.example, at most 16) at or below
# MaxThreads.
MaxThreads 10
# A stalled client is cut after this many seconds without data; TransTeira
# cuts a stalled exchange after one minute on its side.
ReadTimeout 120
CommandReadTimeout 30
IdleTimeout 60

# --- Limits (TT_CLAMAV_MAX_SCAN_BYTES, default 2 GiB = 2048M) ----------------

# All three equal to TT_CLAMAV_MAX_SCAN_BYTES. If you lower that variable,
# lower these values too (in M, 1M = 1048576 bytes).
StreamMaxLength 2048M
MaxScanSize 2048M
MaxFileSize 2048M

# Below TT_CLAMAV_TIMEOUT (default 10 min), so that a slow file is reported as
# not (fully) scanned instead of being retried: 8 minutes, in milliseconds.
MaxScanTime 480000

# MaxRecursion and MaxFiles keep their defaults (protection against archive
# bombs, threat model T-43).

# --- Mandatory alerts (docs/operations/antivirus.md) -------------------------

# Without them clamd silently skips the content it does not analyse and still
# answers "OK"; with them TransTeira flags the file as not (fully) scanned.
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes

# A heuristic match never masks a real signature (the default).
HeuristicScanPrecedence no
