# freshclam configuration for TransTeira (deploy/docker-compose.yml).
#
# Mounted read-only at /etc/clamav/freshclam.conf in the "clamav-update"
# service. That service is the only ClamAV container with Internet access
# (network clamav_egress): it downloads the signatures into the clamav_db
# volume, which clamd reads (read-only) and reloads through SelfCheck. clamd
# itself never reaches the Internet, so a file that compromised clamd could
# not be sent out (docs/operations/antivirus.md, threat model T-46).

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes

# No UpdateLogFile: messages go to the container output (--stdout), and the
# root file system stays read-only.
LogTime yes

# No NotifyClamd: clamd runs in another container and has no route from here;
# its SelfCheck picks the new signatures up.
